<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Sphere Visualiser</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }

    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }

    #togglePanel.shifted {
      left: 290px;
    }

    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .top-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    #fpsCounter {
      background: rgba(0,0,0,0.7);
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      min-width: 60px;
      text-align: center;
      pointer-events: none;
    }

    .top-btn.recording {
      background: rgba(200,0,0,0.7);
      border-color: rgba(255,100,100,0.5);
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<button id="togglePanel" class="shifted">☰ Hide Panel</button>

<div class="top-right-buttons">
  <div id="fpsCounter">-- fps</div>
  <button id="recordBtn" class="top-btn">⏺ Record</button>
  <button id="exportBtn" class="top-btn">⬇ Export</button>
  <button id="fullscreenBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<div id="exportOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; flex-direction:column; color:#fff; font-family:Arial,sans-serif;">
  <div style="font-size:18px; margin-bottom:16px;" id="exportStatus">Exporting...</div>
  <div style="width:400px; height:8px; background:#333; border-radius:4px; overflow:hidden;">
    <div id="exportProgressBar" style="width:0%; height:100%; background:#4af; transition:width 0.1s;"></div>
  </div>
  <div style="font-size:14px; margin-top:8px; color:#aaa;" id="exportPercent">0%</div>
  <button id="exportCancelBtn" style="margin-top:20px; padding:8px 20px; cursor:pointer; background:#c33; border:none; color:#fff; border-radius:4px; font-size:14px;">Cancel</button>
</div>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <!-- Sphere -->
  <div class="section-label">Sphere</div>

  <label>
    Detail: <span id="detailLabel">30</span>
  </label>
  <input type="range" id="detailSlider" min="5" max="60" step="1" value="30" />

  <label>
    Frequency Scale: <span id="freqScaleLabel">30</span>
  </label>
  <input type="range" id="freqScaleSlider" min="5" max="100" step="1" value="30" />

  <label>
    Noise Scale: <span id="noiseScaleLabel">3.0</span>
  </label>
  <input type="range" id="noiseScaleSlider" min="0.5" max="10" step="0.1" value="3.0" />

  <div class="checkbox-row">
    <input type="checkbox" id="wireframeToggle" checked />
    <span>Wireframe</span>
  </div>

  <!-- Color -->
  <div class="section-label">Color</div>

  <div class="color-row">
    <input type="color" id="sphereColor" value="#ffffff" />
    <span>Sphere Color</span>
  </div>

  <!-- Bloom -->
  <div class="section-label">Bloom</div>

  <label>
    Threshold: <span id="bloomThresholdLabel">0.5</span>
  </label>
  <input type="range" id="bloomThresholdSlider" min="0" max="1" step="0.01" value="0.5" />

  <label>
    Strength: <span id="bloomStrengthLabel">0.5</span>
  </label>
  <input type="range" id="bloomStrengthSlider" min="0" max="3" step="0.01" value="0.5" />

  <label>
    Radius: <span id="bloomRadiusLabel">0.8</span>
  </label>
  <input type="range" id="bloomRadiusSlider" min="0" max="1" step="0.01" value="0.8" />

  <!-- Camera -->
  <div class="section-label">Camera</div>

  <label>
    Mouse Follow Speed: <span id="mouseFollowLabel">0.05</span>
  </label>
  <input type="range" id="mouseFollowSlider" min="0.01" max="0.2" step="0.01" value="0.05" />

  <!-- Recording -->
  <div class="section-label">Recording</div>

  <div class="checkbox-row">
    <input type="checkbox" id="autoRecordToggle" />
    <span>Record on Play</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="autoExportToggle" />
    <span>Export on Play</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="lock60fpsToggle" />
    <span>Lock 60fps</span>
  </div>
</div>

<!-- Shaders -->
<script id="vertexshader" type="x-shader/x-vertex">
  uniform float u_time;
  uniform float u_frequency;
  uniform float u_noiseScale;
  uniform float u_freqScale;

  vec3 mod289(vec3 x) {
    return x - floor(x * (1.0 / 289.0)) * 289.0;
  }

  vec4 mod289(vec4 x) {
    return x - floor(x * (1.0 / 289.0)) * 289.0;
  }

  vec4 permute(vec4 x) {
    return mod289(((x*34.0)+10.0)*x);
  }

  vec4 taylorInvSqrt(vec4 r) {
    return 1.79284291400159 - 0.85373472095314 * r;
  }

  vec3 fade(vec3 t) {
    return t*t*t*(t*(t*6.0-15.0)+10.0);
  }

  float pnoise(vec3 P, vec3 rep) {
    vec3 Pi0 = mod(floor(P), rep);
    vec3 Pi1 = mod(Pi0 + vec3(1.0), rep);
    Pi0 = mod289(Pi0);
    Pi1 = mod289(Pi1);
    vec3 Pf0 = fract(P);
    vec3 Pf1 = Pf0 - vec3(1.0);
    vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
    vec4 iy = vec4(Pi0.yy, Pi1.yy);
    vec4 iz0 = Pi0.zzzz;
    vec4 iz1 = Pi1.zzzz;

    vec4 ixy = permute(permute(ix) + iy);
    vec4 ixy0 = permute(ixy + iz0);
    vec4 ixy1 = permute(ixy + iz1);

    vec4 gx0 = ixy0 * (1.0 / 7.0);
    vec4 gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
    gx0 = fract(gx0);
    vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
    vec4 sz0 = step(gz0, vec4(0.0));
    gx0 -= sz0 * (step(0.0, gx0) - 0.5);
    gy0 -= sz0 * (step(0.0, gy0) - 0.5);

    vec4 gx1 = ixy1 * (1.0 / 7.0);
    vec4 gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
    gx1 = fract(gx1);
    vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
    vec4 sz1 = step(gz1, vec4(0.0));
    gx1 -= sz1 * (step(0.0, gx1) - 0.5);
    gy1 -= sz1 * (step(0.0, gy1) - 0.5);

    vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
    vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
    vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
    vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
    vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
    vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
    vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
    vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

    vec4 norm0 = taylorInvSqrt(vec4(dot(g000,g000), dot(g010,g010), dot(g100,g100), dot(g110,g110)));
    g000 *= norm0.x; g010 *= norm0.y; g100 *= norm0.z; g110 *= norm0.w;
    vec4 norm1 = taylorInvSqrt(vec4(dot(g001,g001), dot(g011,g011), dot(g101,g101), dot(g111,g111)));
    g001 *= norm1.x; g011 *= norm1.y; g101 *= norm1.z; g111 *= norm1.w;

    float n000 = dot(g000, Pf0);
    float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
    float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
    float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
    float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
    float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
    float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
    float n111 = dot(g111, Pf1);

    vec3 fade_xyz = fade(Pf0);
    vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
    vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
    float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x);
    return 2.2 * n_xyz;
  }

  void main() {
    float noise = u_noiseScale * pnoise(position + u_time, vec3(10.0));
    float displacement = (u_frequency / u_freqScale) * (noise / 10.);
    vec3 newPosition = position + normal * displacement;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
  }
</script>

<script id="fragmentshader" type="x-shader/x-fragment">
  uniform float u_red;
  uniform float u_green;
  uniform float u_blue;
  void main() {
    gl_FragColor = vec4(vec3(u_red, u_green, u_blue), 1.0);
  }
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/examples/jsm/postprocessing/EffectComposer": "https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/EffectComposer.js",
    "three/examples/jsm/postprocessing/RenderPass": "https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/RenderPass.js",
    "three/examples/jsm/postprocessing/UnrealBloomPass": "https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/UnrealBloomPass.js",
    "three/examples/jsm/postprocessing/OutputPass": "https://unpkg.com/three@0.165.0/examples/jsm/postprocessing/OutputPass.js"
  }
}
</script>

<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>

<script type="module">

import * as THREE from 'three';
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass';
import { OutputPass } from 'three/examples/jsm/postprocessing/OutputPass';

// =====================================================
// Scene
// =====================================================

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, -2, 14);
camera.lookAt(0, 0, 0);

// Bloom
const bloomParams = {
  threshold: 0.5,
  strength: 0.5,
  radius: 0.8,
};

const renderScene = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight)
);
bloomPass.threshold = bloomParams.threshold;
bloomPass.strength = bloomParams.strength;
bloomPass.radius = bloomParams.radius;

const bloomComposer = new EffectComposer(renderer);
bloomComposer.addPass(renderScene);
bloomComposer.addPass(bloomPass);
bloomComposer.addPass(new OutputPass());

// =====================================================
// Sphere
// =====================================================

let sphereDetail = 30;
let freqScale = 30;
let noiseScale = 3.0;
let mouseFollowSpeed = 0.05;

const uniforms = {
  u_time: { type: 'f', value: 0.0 },
  u_frequency: { type: 'f', value: 0.0 },
  u_red: { type: 'f', value: 1.0 },
  u_green: { type: 'f', value: 1.0 },
  u_blue: { type: 'f', value: 1.0 },
  u_noiseScale: { type: 'f', value: noiseScale },
  u_freqScale: { type: 'f', value: freqScale },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: document.getElementById('vertexshader').textContent,
  fragmentShader: document.getElementById('fragmentshader').textContent,
  wireframe: true,
});

let geo = new THREE.IcosahedronGeometry(4, sphereDetail);
let mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

function rebuildSphere(detail) {
  sphereDetail = detail;
  scene.remove(mesh);
  geo.dispose();
  geo = new THREE.IcosahedronGeometry(4, sphereDetail);
  mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
}

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();
const analyser = audioContext.createAnalyser();
analyser.fftSize = 32;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);
let audioDestNode = null;
let audioStarted = false;
let audioBuffer = null;
let audioSource = null;
let lockRecordingFps = false;

// =====================================================
// Mouse
// =====================================================

let mouseX = 0;
let mouseY = 0;
document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX - window.innerWidth / 2) / 100;
  mouseY = (e.clientY - window.innerHeight / 2) / 100;
});

// =====================================================
// Recording
// =====================================================

let videoTrack = null;
let lastCaptureMs = 0;
let preRecordWidth = 0;
let preRecordHeight = 0;
let preRecordPixelRatio = 1;

const recorder = createRecorder({
  defaultFilename: 'sphere_1080p',
  onStart: (codec) => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '⏹ Stop';
    btn.classList.add('recording');
  },
  onStop: () => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '⏺ Record';
    btn.classList.remove('recording');
    try { analyser.disconnect(audioDestNode); } catch(e) {}
    audioDestNode = null;
    videoTrack = null;
    renderer.setPixelRatio(preRecordPixelRatio);
    renderer.setSize(preRecordWidth, preRecordHeight);
    bloomComposer.setSize(preRecordWidth, preRecordHeight);
    camera.aspect = preRecordWidth / preRecordHeight;
    camera.updateProjectionMatrix();
  },
});

function makeRecordingStream() {
  preRecordWidth = window.innerWidth;
  preRecordHeight = window.innerHeight;
  preRecordPixelRatio = renderer.getPixelRatio();

  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080);
  bloomComposer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();

  const canvas = renderer.domElement;
  const videoStream = canvas.captureStream(0);
  videoTrack = videoStream.getVideoTracks()[0];
  lastCaptureMs = 0;

  const audioStreamDest = audioContext.createMediaStreamDestination();
  audioDestNode = audioStreamDest;
  analyser.connect(audioStreamDest);

  const audioTrack = audioStreamDest.stream.getAudioTracks()[0];
  if (audioTrack) videoStream.addTrack(audioTrack);

  return videoStream;
}

// =====================================================
// Animation
// =====================================================

const clock = new THREE.Clock();
const glCtx = renderer.getContext();
let offlineExporting = false;

let fpsFrames = 0;
let fpsElapsed = 0;
let lastTickTime = performance.now();

function tickFrame(delta) {
  uniforms.u_time.value += delta;

  if (!offlineExporting) {
    analyser.getByteFrequencyData(frequencyData);
    let avg = 0;
    for (let i = 0; i < frequencyData.length; i++) avg += frequencyData[i];
    avg /= frequencyData.length;
    uniforms.u_frequency.value = avg;
  }

  camera.position.x += (mouseX - camera.position.x) * mouseFollowSpeed;
  camera.position.y += (-mouseY - camera.position.y) * 0.5;
  camera.lookAt(scene.position);

  bloomComposer.render();

  if (recorder.isRecording) glCtx.finish();

  const now = performance.now();
  fpsElapsed += now - lastTickTime;
  lastTickTime = now;
  fpsFrames++;
  if (fpsElapsed >= 500) {
    document.getElementById('fpsCounter').textContent = Math.round(fpsFrames / (fpsElapsed / 1000)) + ' fps';
    fpsFrames = 0;
    fpsElapsed = 0;
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (offlineExporting) { clock.getDelta(); return; }
  const now = performance.now();
  if (recorder.isRecording && lockRecordingFps && now - lastCaptureMs < 16.5) return;
  const delta = recorder.isRecording ? (1 / 60) : clock.getDelta();
  tickFrame(delta);
  if (recorder.isRecording && videoTrack) {
    videoTrack.requestFrame();
    lastCaptureMs = now;
  }
}

animate();

// =====================================================
// UI
// =====================================================

document.getElementById('togglePanel').addEventListener('click', (e) => {
  const ui = document.getElementById('ui');
  const btn = e.target;
  if (ui.classList.contains('hidden')) {
    ui.classList.remove('hidden');
    btn.classList.add('shifted');
    btn.textContent = '☰ Hide Panel';
  } else {
    ui.classList.add('hidden');
    btn.classList.remove('shifted');
    btn.textContent = '☰ Show Panel';
  }
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.getElementById('recordBtn').addEventListener('click', () => {
  recorder.toggle(makeRecordingStream);
});

document.getElementById('detailSlider').addEventListener('input', (e) => {
  const val = parseInt(e.target.value);
  document.getElementById('detailLabel').textContent = val;
  rebuildSphere(val);
});

document.getElementById('freqScaleSlider').addEventListener('input', (e) => {
  freqScale = parseFloat(e.target.value);
  document.getElementById('freqScaleLabel').textContent = freqScale;
  uniforms.u_freqScale.value = freqScale;
});

document.getElementById('noiseScaleSlider').addEventListener('input', (e) => {
  noiseScale = parseFloat(e.target.value);
  document.getElementById('noiseScaleLabel').textContent = noiseScale.toFixed(1);
  uniforms.u_noiseScale.value = noiseScale;
});

document.getElementById('wireframeToggle').addEventListener('change', (e) => {
  mat.wireframe = e.target.checked;
});

document.getElementById('sphereColor').addEventListener('input', (e) => {
  const c = new THREE.Color(e.target.value);
  uniforms.u_red.value = c.r;
  uniforms.u_green.value = c.g;
  uniforms.u_blue.value = c.b;
});

document.getElementById('bloomThresholdSlider').addEventListener('input', (e) => {
  bloomPass.threshold = parseFloat(e.target.value);
  document.getElementById('bloomThresholdLabel').textContent = bloomPass.threshold.toFixed(2);
});

document.getElementById('bloomStrengthSlider').addEventListener('input', (e) => {
  bloomPass.strength = parseFloat(e.target.value);
  document.getElementById('bloomStrengthLabel').textContent = bloomPass.strength.toFixed(2);
});

document.getElementById('bloomRadiusSlider').addEventListener('input', (e) => {
  bloomPass.radius = parseFloat(e.target.value);
  document.getElementById('bloomRadiusLabel').textContent = bloomPass.radius.toFixed(2);
});

document.getElementById('mouseFollowSlider').addEventListener('input', (e) => {
  mouseFollowSpeed = parseFloat(e.target.value);
  document.getElementById('mouseFollowLabel').textContent = mouseFollowSpeed.toFixed(2);
});

document.getElementById('lock60fpsToggle').addEventListener('change', (e) => {
  lockRecordingFps = e.target.checked;
});

// =====================================================
// Audio file import
// =====================================================

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const autoExport = document.getElementById('autoExportToggle').checked;
  const autoRecord = document.getElementById('autoRecordToggle').checked;

  let writable;
  if (autoExport) {
    if (offlineExporting) return;
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'sphere_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      writable = await handle.createWritable();
    } catch (err) { return; }
  }

  let prepared;
  if (autoRecord && !autoExport) {
    prepared = await recorder.prepareAutoRecord();
    if (!prepared) return;
  }

  await audioContext.resume();
  if (audioSource) { try { audioSource.stop(); } catch(e) {} }
  audioBuffer = await audioContext.decodeAudioData(await file.arrayBuffer());

  if (autoExport) {
    document.getElementById('exportBtn').writable = writable;
    document.getElementById('exportBtn').click();
    return;
  }

  audioSource = audioContext.createBufferSource();
  audioSource.buffer = audioBuffer;
  audioSource.connect(analyser);
  analyser.connect(audioContext.destination);
  audioSource.start();
  audioStarted = true;

  if (prepared && !recorder.isRecording) {
    recorder.startAutoRecord(prepared, makeRecordingStream);
  }
});

// =====================================================
// Resize
// =====================================================

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  bloomComposer.setSize(window.innerWidth, window.innerHeight);
});

// =====================================================
// Offline Export
// =====================================================

let exportCancelled = false;

document.getElementById('exportBtn').addEventListener('click', async () => {
  if (!audioBuffer) { alert('Load an audio file first.'); return; }
  if (offlineExporting) return;

  const btn = document.getElementById('exportBtn');
  const writable = btn.writable || await (async () => {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'sphere_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      return await handle.createWritable();
    } catch (e) { return null; }
  })();
  btn.writable = null;
  if (!writable) return;

  const overlay = document.getElementById('exportOverlay');
  const progressBar = document.getElementById('exportProgressBar');
  const percentText = document.getElementById('exportPercent');
  const statusText = document.getElementById('exportStatus');
  overlay.style.display = 'flex';
  exportCancelled = false;

  const savedWidth = renderer.domElement.width;
  const savedHeight = renderer.domElement.height;
  const savedAspect = camera.aspect;
  renderer.setSize(1920, 1080);
  bloomComposer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();

  const savedCamPos = camera.position.clone();
  const savedUTime = uniforms.u_time.value;
  const savedAudioStarted = audioStarted;

  camera.position.set(0, -2, 14);
  uniforms.u_time.value = 0;
  audioStarted = true;

  offlineExporting = true;
  await audioContext.suspend();

  try {
    await offlineExport({
      audioBuffer,
      fps: 60,
      width: 1920,
      height: 1080,
      fftSize: analyser.fftSize,
      smoothingTimeConstant: analyser.smoothingTimeConstant,
      minDecibels: analyser.minDecibels,
      maxDecibels: analyser.maxDecibels,
      writable,
      isCancelled: () => exportCancelled,
      renderFrame: (fftData, delta) => {
        let avg = 0;
        for (let i = 0; i < fftData.length; i++) avg += fftData[i];
        avg /= fftData.length;
        uniforms.u_frequency.value = avg;
        uniforms.u_time.value += delta;
        bloomComposer.render();
      },
      readCanvas: () => renderer.domElement,
      gpuFinish: () => glCtx.finish(),
      onProgress: (frac) => {
        const pct = Math.round(frac * 100);
        progressBar.style.width = pct + '%';
        percentText.textContent = pct + '%';
        const totalFrames = Math.ceil(audioBuffer.duration * 60);
        statusText.textContent = 'Exporting... frame ' + Math.round(frac * totalFrames) + '/' + totalFrames;
      },
      onDone: () => {
        statusText.textContent = 'Export complete!';
        setTimeout(() => { overlay.style.display = 'none'; }, 1500);
      },
    });
  } catch (e) {
    console.error('Export error:', e);
    statusText.textContent = 'Export failed: ' + e.message;
    setTimeout(() => { overlay.style.display = 'none'; }, 3000);
  }

  offlineExporting = false;
  await audioContext.resume();

  camera.position.copy(savedCamPos);
  uniforms.u_time.value = savedUTime;
  audioStarted = savedAudioStarted;

  renderer.setSize(savedWidth, savedHeight);
  bloomComposer.setSize(savedWidth, savedHeight);
  camera.aspect = savedAspect;
  camera.updateProjectionMatrix();
});

document.getElementById('exportCancelBtn').addEventListener('click', () => {
  exportCancelled = true;
  document.getElementById('exportStatus').textContent = 'Cancelling...';
});

</script>
</body>
</html>
