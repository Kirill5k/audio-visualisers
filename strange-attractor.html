<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strange Attractor</title>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>
<script src="audio-reactivity.js"></script>
<script src="viz-shell.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

// =====================================================
// Settings
// =====================================================
const TEX = 384;                 // 384 * 384 = 147,456 particles
const COUNT = TEX * TEX;

let mode = 0;                    // 0 = Aizawa, 1 = Lorenz
let flowSpeed = 1.0;
let life = 7.0;
let morphInfluence = 0.5;        // bass -> param morph
let pointSize = 1.4;
let glow = 1.0;
let hueDrift = 0.15;

let colorA = new THREE.Color(0x37e6c8);
let colorB = new THREE.Color(0x7a52ff);

const BG = new THREE.Color(0x04030a);
const SCALES = [26.0, 1.05];
const Z_OFFSET = [0.0, -26.0];

// =====================================================
// Shell
// =====================================================
const shell = createVizShell({
  title: 'Strange Attractor',
  defaultFilename: 'attractor',
  exportFilename: 'attractor_export.mp4',
  controls: [
    { type: 'section', label: 'Attractor' },
    { type: 'checkbox', id: 'lorenz', label: 'Lorenz (off = Aizawa)', value: false, onChange: (v) => { mode = v ? 1 : 0; reseed(); } },
    { type: 'slider', id: 'flow', label: 'Flow Speed', min: 0.2, max: 3, step: 0.05, value: flowSpeed,
      format: (v) => v.toFixed(2), onChange: (v) => flowSpeed = v },
    { type: 'slider', id: 'life', label: 'Trail Length', min: 2, max: 16, step: 0.5, value: life,
      format: (v) => v.toFixed(1), onChange: (v) => { life = v; posVar.material.uniforms.uLife.value = v; } },
    { type: 'slider', id: 'morph', label: 'Bass Morph', min: 0, max: 1.5, step: 0.05, value: morphInfluence,
      format: (v) => v.toFixed(2), onChange: (v) => morphInfluence = v },

    { type: 'section', label: 'Look' },
    { type: 'slider', id: 'size', label: 'Point Size', min: 0.4, max: 4, step: 0.1, value: pointSize,
      format: (v) => v.toFixed(1), onChange: (v) => pointSize = v },
    { type: 'slider', id: 'glow', label: 'Glow', min: 0.2, max: 2.5, step: 0.05, value: glow,
      format: (v) => v.toFixed(2), onChange: (v) => glow = v },

    { type: 'section', label: 'Color' },
    { type: 'color', id: 'colA', label: 'Color A', value: '#37e6c8', onChange: (v) => { colorA.set(v); pMat.uniforms.uColorA.value.copy(colorA); } },
    { type: 'color', id: 'colB', label: 'Color B', value: '#7a52ff', onChange: (v) => { colorB.set(v); pMat.uniforms.uColorB.value.copy(colorB); } },
    { type: 'slider', id: 'hue', label: 'Hue Drift', min: 0, max: 1, step: 0.05, value: hueDrift,
      format: (v) => v.toFixed(2), onChange: (v) => hueDrift = v },

    { type: 'section', label: 'Camera' },
    { type: 'checkbox', id: 'autoRotate', label: 'Camera Orbit', value: true, onChange: (v) => controls.autoRotate = v },
    { type: 'slider', id: 'driftSpeed', label: 'Orbit Speed', min: 0, max: 2, step: 0.05, value: 0.45,
      format: (v) => v.toFixed(2), onChange: (v) => controls.autoRotateSpeed = v },
  ],
});
const audio = shell.audio;

// =====================================================
// Scene
// =====================================================
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.FogExp2(BG, 0.0045);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 6, 78);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 15;
controls.maxDistance = 300;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.update();

// =====================================================
// GPU compute (attractor integration)
// =====================================================
const ATTRACTOR_GLSL = `
  uniform float uMode, uMorph;
  vec3 deriv(vec3 p){
    if (uMode < 0.5){
      // Aizawa
      float a = 0.95, b = 0.7, c = 0.6, d = 3.5, e = 0.25, f = 0.1;
      b += uMorph;
      float x = p.x, y = p.y, z = p.z;
      return vec3(
        (z - b) * x - d * y,
        d * x + (z - b) * y,
        c + a * z - (z*z*z)/3.0 - (x*x + y*y) * (1.0 + e*z) + f*z*x*x*x
      );
    } else {
      // Lorenz
      float s = 10.0, r = 28.0 + uMorph * 14.0, bb = 2.6667;
      float x = p.x, y = p.y, z = p.z;
      return vec3(s*(y-x), x*(r-z)-y, x*y - bb*z);
    }
  }
  float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
`;

const computeShader = `
  ${ATTRACTOR_GLSL}
  uniform float uDelta, uTime, uSpeed, uLife;
  void main(){
    vec2 uv = gl_FragCoord.xy / resolution.xy;
    vec4 data = texture2D(texturePosition, uv);
    vec3 p = data.xyz;
    float age = data.w;
    // RK2 integration with a clamped step
    float h = min(uDelta * uSpeed, 0.02);
    vec3 k1 = deriv(p);
    vec3 k2 = deriv(p + k1 * h * 0.5);
    p += k2 * h;
    age += h;
    bool bad = !(dot(p,p) < 1.0e8);
    if (age > uLife || bad){
      vec3 j = vec3(hash(vec3(uv, uTime)), hash(vec3(uv.yx, uTime*1.3)), hash(vec3(uv*3.1, uTime*0.7))) - 0.5;
      if (uMode < 0.5) p = vec3(0.1, 0.0, 0.0) + j * 0.25;
      else p = vec3(0.1, 0.0, 0.0) + j * 0.6;
      age = hash(vec3(uv * 7.0, uTime)) * uLife;
    }
    gl_FragColor = vec4(p, age);
  }
`;

const gpu = new GPUComputationRenderer(TEX, TEX, renderer);
const initTex = gpu.createTexture();
seedInitial(initTex);
const posVar = gpu.addVariable('texturePosition', computeShader, initTex);
gpu.setVariableDependencies(posVar, [posVar]);
posVar.material.uniforms.uDelta = { value: 0.016 };
posVar.material.uniforms.uTime = { value: 0.0 };
posVar.material.uniforms.uSpeed = { value: flowSpeed };
posVar.material.uniforms.uLife = { value: life };
posVar.material.uniforms.uMode = { value: mode };
posVar.material.uniforms.uMorph = { value: 0.0 };
const gpuErr = gpu.init();
if (gpuErr) console.error(gpuErr);

function seedInitial(tex) {
  const d = tex.image.data;
  for (let i = 0; i < COUNT; i++) {
    const jx = (Math.random() - 0.5) * (mode === 0 ? 0.25 : 0.6);
    const jy = (Math.random() - 0.5) * (mode === 0 ? 0.25 : 0.6);
    const jz = (Math.random() - 0.5) * (mode === 0 ? 0.25 : 0.6);
    d[i * 4] = 0.1 + jx;
    d[i * 4 + 1] = 0.0 + jy;
    d[i * 4 + 2] = 0.0 + jz;
    d[i * 4 + 3] = Math.random() * life;
  }
  tex.needsUpdate = true;
}

function reseed() {
  posVar.material.uniforms.uMode.value = mode;
  pMat.uniforms.uMode.value = mode;
  pMat.uniforms.uScale.value = SCALES[mode];
  pMat.uniforms.uZOffset.value = Z_OFFSET[mode];
  seedInitial(initTex);
  gpu.renderTexture(initTex, posVar.renderTargets[0]);
  gpu.renderTexture(initTex, posVar.renderTargets[1]);
}

// =====================================================
// Particle render material
// =====================================================
const refs = new Float32Array(COUNT * 2);
for (let i = 0; i < COUNT; i++) {
  refs[i * 2] = ((i % TEX) + 0.5) / TEX;
  refs[i * 2 + 1] = (Math.floor(i / TEX) + 0.5) / TEX;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT * 3), 3));
pGeo.setAttribute('aRef', new THREE.BufferAttribute(refs, 2));

const pMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uPosition: { value: null },
    uSize: { value: pointSize },
    uHue: { value: 0.0 },
    uGlow: { value: glow },
    uLife: { value: life },
    uScale: { value: SCALES[mode] },
    uZOffset: { value: Z_OFFSET[mode] },
    uMode: { value: mode },
    uColorA: { value: colorA.clone() },
    uColorB: { value: colorB.clone() },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  vertexShader: `
    uniform sampler2D uPosition;
    uniform float uSize, uHue, uGlow, uLife, uScale, uZOffset, uMode, uPixelRatio;
    uniform vec3 uColorA, uColorB;
    attribute vec2 aRef;
    varying vec3 vColor;
    varying float vAlpha;
    vec3 hueShift(vec3 c, float a){
      const vec3 k = vec3(0.57735);
      float cs = cos(a), sn = sin(a);
      return c * cs + cross(k, c) * sn + k * dot(k, c) * (1.0 - cs);
    }
    void main(){
      vec4 data = texture2D(uPosition, aRef);
      vec3 ap = data.xyz;
      float age = data.w;
      vec3 world = ap * uScale;
      world.z += uZOffset;
      float lifeT = clamp(age / uLife, 0.0, 1.0);
      float fade = sin(lifeT * 3.14159);            // brightest mid-life, comet fade at ends
      vec3 base = mix(uColorA, uColorB, clamp(world.y * 0.02 + 0.5, 0.0, 1.0));
      base = hueShift(base, uHue);
      vColor = base * uGlow * (0.4 + fade);
      vAlpha = 0.25 + 0.75 * fade;
      vec4 mv = modelViewMatrix * vec4(world, 1.0);
      gl_PointSize = uSize * uPixelRatio * (220.0 / max(1.0, -mv.z));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = smoothstep(0.25, 0.0, r);
      gl_FragColor = vec4(vColor, a * vAlpha);
    }
  `,
});

const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
scene.add(points);

// =====================================================
// Render loop
// =====================================================
let hue = 0;

function render(delta) {
  const d = Math.min(delta, 0.05);
  // Multiple substeps keep the integration stable at speed
  posVar.material.uniforms.uDelta.value = d;
  posVar.material.uniforms.uTime.value += d;
  posVar.material.uniforms.uSpeed.value = flowSpeed * (0.6 + 0.7 * audio.build);
  posVar.material.uniforms.uMorph.value = audio.bass * morphInfluence;
  gpu.compute();

  pMat.uniforms.uPosition.value = gpu.getCurrentRenderTarget(posVar).texture;
  pMat.uniforms.uSize.value = pointSize;
  pMat.uniforms.uGlow.value = glow * (0.7 + 0.6 * audio.build + 0.4 * audio.high);
  hue += d * hueDrift * (0.4 + audio.mid);
  pMat.uniforms.uHue.value = hue;

  controls.update();
  renderer.render(scene, camera);
}

function onResize(w, h) {
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  pMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
}

function onExportReset() {
  hue = 0;
  posVar.material.uniforms.uTime.value = 0;
  reseed();
}

shell.start({ renderer, camera, render, onResize, onExportReset });
</script>
</body>
</html>
