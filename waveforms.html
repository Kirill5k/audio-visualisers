<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Visualiser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}
.container {
  display: grid;
  grid-template-rows: 36px 1fr auto 1fr;
  height: 100vh;
  width: 100vw;
  gap: 1px;
  background: #222;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #000;
  border-bottom: 1px solid #333;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.upload-btn {
  background: none;
  border: 1px solid #555;
  color: #fff;
  font-family: inherit;
  font-size: 11px;
  padding: 4px 14px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.upload-btn:hover { border-color: #fff; }
.upload-btn.recording { border-color: #f44; color: #f44; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.track-name { color: #888; font-size: 11px; }
.header-right { color: #666; font-size: 10px; letter-spacing: 1px; }

.config-panel {
  display: none;
  position: absolute;
  top: 36px;
  left: 0;
  right: 0;
  background: #0a0a0a;
  border-bottom: 1px solid #333;
  padding: 16px 20px;
  z-index: 10;
  font-size: 11px;
}
.config-panel.visible { display: block; }
.config-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.config-row:last-child { margin-bottom: 0; }
.config-label {
  color: #888;
  width: 120px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 10px;
  flex-shrink: 0;
}
.config-input {
  background: #111;
  border: 1px solid #333;
  color: #fff;
  font-family: inherit;
  font-size: 11px;
  padding: 3px 8px;
  width: 70px;
  text-align: center;
}
.config-input:focus { border-color: #666; outline: none; }
.config-slider {
  -webkit-appearance: none;
  appearance: none;
  background: #222;
  height: 4px;
  border-radius: 2px;
  outline: none;
  width: 150px;
}
.config-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
.config-unit { color: #555; font-size: 10px; }

.main-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1px;
  background: #222;
  min-height: 0;
}
.main-panels .spectrum-area {
  grid-column: 1;
  grid-row: 1 / 4;
}
.main-panels .osc-stack {
  grid-column: 2;
  grid-row: 1 / 4;
  display: grid;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1px;
}
.osc-stack .panel {
  padding-bottom: 0;
}
.panel {
  background: #000;
  position: relative;
  overflow: hidden;
  padding: 4px 12px;
}
.panel-label {
  position: absolute;
  top: 4px;
  left: 12px;
  font-size: 9px;
  color: #555;
  letter-spacing: 1px;
  text-transform: uppercase;
  z-index: 2;
  pointer-events: none;
}
.panel canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.bottom-section {
  display: grid;
  grid-template-columns: 1fr 80px;
  grid-template-rows: 1fr 80px;
  gap: 1px;
  background: #222;
  height: 220px;
}
.bottom-section .meters-area {
  grid-column: 2;
  grid-row: 1 / 3;
}
.bottom-section .waveform-area {
  padding: 8px 12px;
}

.track-info-overlay {
  position: absolute;
  top: 4px;
  right: 8px;
  font-size: 9px;
  color: #555;
  text-align: right;
  z-index: 2;
  pointer-events: none;
  line-height: 1.5;
}
.track-info-bottom {
  background: #000;
  padding: 12px 16px;
  color: #555;
  font-size: 10px;
  line-height: 1.8;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div id="exportOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; flex-direction:column; color:#fff; font-family:Arial,sans-serif;">
  <div style="font-size:18px; margin-bottom:16px;" id="exportStatus">Exporting...</div>
  <div style="width:400px; height:8px; background:#333; border-radius:4px; overflow:hidden;">
    <div id="exportProgressBar" style="width:0%; height:100%; background:#4af; transition:width 0.1s;"></div>
  </div>
  <div style="font-size:14px; margin-top:8px; color:#aaa;" id="exportPercent">0%</div>
  <button id="exportCancelBtn" style="margin-top:20px; padding:8px 20px; cursor:pointer; background:#c33; border:none; color:#fff; border-radius:4px; font-size:14px;">Cancel</button>
</div>
<div class="container">
  <div class="header">
    <div class="header-left">
      <input type="file" id="file-input" accept="audio/*" style="display:none">
      <button class="upload-btn" id="upload-btn">LOAD AUDIO FILE</button>
      <button class="upload-btn" id="record-btn" disabled>⏺ RECORD</button>
      <button class="upload-btn" id="export-btn" disabled>⬇ EXPORT</button>
      <button class="upload-btn" id="config-btn">CONFIG</button>
      <span class="track-name" id="track-name">NO FILE LOADED</span>
    </div>
    <div class="header-right" id="header-info">48000 Hz &middot; 2ch &middot; 00:00 / 00:00</div>
  </div>

  <div class="config-panel" id="config-panel">
    <div class="config-row">
      <span class="config-label">BASS</span>
      <input class="config-input" id="cfg-kick-lo" type="number" value="20">
      <span class="config-unit">–</span>
      <input class="config-input" id="cfg-kick-hi" type="number" value="250">
      <span class="config-unit">Hz</span>
      <span class="config-unit" style="margin-left:12px">GAIN</span>
      <input class="config-slider" id="cfg-kick-gain" type="range" min="0.5" max="10" step="0.5" value="5.0">
      <span class="config-unit" id="cfg-kick-gain-val">5.0</span>
    </div>
    <div class="config-row">
      <span class="config-label">MIDS</span>
      <input class="config-input" id="cfg-snare-lo" type="number" value="250">
      <span class="config-unit">–</span>
      <input class="config-input" id="cfg-snare-hi" type="number" value="4000">
      <span class="config-unit">Hz</span>
      <span class="config-unit" style="margin-left:12px">GAIN</span>
      <input class="config-slider" id="cfg-snare-gain" type="range" min="0.5" max="10" step="0.5" value="1.0">
      <span class="config-unit" id="cfg-snare-gain-val">1.0</span>
    </div>
    <div class="config-row">
      <span class="config-label">HIGHS</span>
      <input class="config-input" id="cfg-hihat-lo" type="number" value="4000">
      <span class="config-unit">–</span>
      <input class="config-input" id="cfg-hihat-hi" type="number" value="20000">
      <span class="config-unit">Hz</span>
      <span class="config-unit" style="margin-left:12px">GAIN</span>
      <input class="config-slider" id="cfg-hihat-gain" type="range" min="0.5" max="10" step="0.5" value="0.5">
      <span class="config-unit" id="cfg-hihat-gain-val">0.5</span>
    </div>
    <div class="config-row">
      <span class="config-label">SPECTRUM BARS</span>
      <input class="config-slider" id="cfg-bars" type="range" min="20" max="256" value="200">
      <span class="config-unit" id="cfg-bars-val">200</span>
    </div>
    <div class="config-row">
      <span class="config-label">LABEL SIZE</span>
      <input class="config-slider" id="cfg-label-size" type="range" min="6" max="18" value="9">
      <span class="config-unit" id="cfg-label-size-val">9px</span>
    </div>
    <div class="config-row">
      <input type="checkbox" id="cfg-auto-record" style="margin-right:8px">
      <span class="config-label">RECORD ON PLAY</span>
    </div>
    <div class="config-row">
      <input type="checkbox" id="cfg-auto-export" style="margin-right:8px">
      <span class="config-label">EXPORT ON PLAY</span>
    </div>
    <div class="config-row">
      <input type="checkbox" id="cfg-lock-60fps" style="margin-right:8px">
      <span class="config-label">LOCK 60FPS RECORDING</span>
    </div>
  </div>

  <div class="main-panels">
    <div class="spectrum-area">
      <div class="panel" id="spectrum-panel" style="height:100%">
        <canvas id="spectrum-canvas"></canvas>
      </div>
    </div>
    <div class="osc-stack">
      <div class="panel">
        <span class="panel-label">HIGHS</span>
        <canvas id="osc-high"></canvas>
      </div>
      <div class="panel">
        <span class="panel-label">MIDS</span>
        <canvas id="osc-mid"></canvas>
      </div>
      <div class="panel">
        <span class="panel-label">BASS</span>
        <canvas id="osc-low"></canvas>
      </div>
    </div>
  </div>

  <div class="bottom-section">
    <div class="panel" id="spectrogram-panel">
      <canvas id="spectrogram-canvas"></canvas>
    </div>
    <div class="panel meters-area" id="meters-panel">
      <span class="panel-label" style="left:0;right:0;text-align:center">L &nbsp; R</span>
      <canvas id="meters-canvas"></canvas>
    </div>
    <div class="panel waveform-area" id="waveform-panel">
      <canvas id="waveform-canvas"></canvas>
    </div>
  </div>

  <div class="track-info-bottom" id="track-details"></div>
</div>

<audio id="audio-el" style="display:none"></audio>
<canvas id="record-canvas" style="display:none"></canvas>

<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>
<script>
(function() {
  const $ = id => document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;

  // DOM refs
  const fileInput = $('file-input');
  const uploadBtn = $('upload-btn');
  const recordBtn = $('record-btn');
  const exportBtn = $('export-btn');
  const trackNameEl = $('track-name');
  const headerInfo = $('header-info');
  const audioEl = $('audio-el');
  const trackDetails = $('track-details');
  const configPanel = $('config-panel');
  const configBtn = $('config-btn');

  // Config state
  var config = {
    kick: { lo: 20, hi: 250, gain: 5.0 },
    snare: { lo: 250, hi: 4000, gain: 1.0 },
    hihat: { lo: 4000, hi: 20000, gain: 0.5 },
    numBars: 200,
    labelSize: 9,
  };

  // Config toggle
  configBtn.addEventListener('click', () => {
    configPanel.classList.toggle('visible');
  });

  // Config inputs
  function bindCfg(id, obj, key, applyFn) {
    const el = $(id);
    el.addEventListener('change', () => {
      obj[key] = Number(el.value) || obj[key];
      if (applyFn) applyFn();
    });
  }
  bindCfg('cfg-kick-lo', config.kick, 'lo', applyFilters);
  bindCfg('cfg-kick-hi', config.kick, 'hi', applyFilters);
  bindCfg('cfg-snare-lo', config.snare, 'lo', applyFilters);
  bindCfg('cfg-snare-hi', config.snare, 'hi', applyFilters);
  bindCfg('cfg-hihat-lo', config.hihat, 'lo', applyFilters);
  bindCfg('cfg-hihat-hi', config.hihat, 'hi', applyFilters);
  function bindGain(id, obj, valId) {
    $(id).addEventListener('input', e => {
      obj.gain = Number(e.target.value);
      $(valId).textContent = obj.gain.toFixed(1);
    });
  }
  bindGain('cfg-kick-gain', config.kick, 'cfg-kick-gain-val');
  bindGain('cfg-snare-gain', config.snare, 'cfg-snare-gain-val');
  bindGain('cfg-hihat-gain', config.hihat, 'cfg-hihat-gain-val');
  $('cfg-bars').addEventListener('input', e => {
    config.numBars = Number(e.target.value);
    $('cfg-bars-val').textContent = config.numBars;
  });
  $('cfg-label-size').addEventListener('input', e => {
    config.labelSize = Number(e.target.value);
    $('cfg-label-size-val').textContent = config.labelSize + 'px';
    document.querySelectorAll('.panel-label').forEach(el => {
      el.style.fontSize = config.labelSize + 'px';
    });
  });

  // Canvases
  const spectrumC = $('spectrum-canvas');
  const spectrogramC = $('spectrogram-canvas');
  const metersC = $('meters-canvas');
  const oscLowC = $('osc-low');
  const oscMidC = $('osc-mid');
  const oscHighC = $('osc-high');
  const waveformC = $('waveform-canvas');

  const allCanvases = [spectrumC, spectrogramC, metersC, oscLowC, oscMidC, oscHighC, waveformC];
  const contexts = {};

  function sizeCanvas(c) {
    const r = c.parentElement.getBoundingClientRect();
    c.width = Math.round(r.width * dpr);
    c.height = Math.round(r.height * dpr);
  }
  function sizeAll() { allCanvases.forEach(sizeCanvas); spectrogramImg = null; }

  allCanvases.forEach(c => { contexts[c.id] = c.getContext('2d'); });
  sizeAll();
  window.addEventListener('resize', () => { sizeAll(); if (waveformData) drawWaveformStatic(0); });

  // Recording — composite canvas
  const recordCanvas = $('record-canvas');
  const recordCtx = recordCanvas.getContext('2d');
  let mediaStreamDest = null;

  const recorder = createRecorder({
    defaultFilename: 'waveforms',
    videoBitsPerSecond: 8_000_000,
    onStart: () => {
      recordBtn.textContent = '⏹ STOP';
      recordBtn.classList.add('recording');
    },
    onStop: () => {
      recordBtn.textContent = '⏺ RECORD';
      recordBtn.classList.remove('recording');
    },
  });

  function compositeFrame() {
    if (!recorder.isRecording && !offlineExporting) return;
    const container = document.querySelector('.container');
    const rect = container.getBoundingClientRect();
    if (recordCanvas.width !== rect.width || recordCanvas.height !== rect.height) {
      recordCanvas.width = rect.width;
      recordCanvas.height = rect.height;
    }
    recordCtx.fillStyle = '#222';
    recordCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);
    for (const c of allCanvases) {
      const panel = c.closest('.panel');
      if (panel) {
        const pr = panel.getBoundingClientRect();
        recordCtx.fillStyle = '#000';
        recordCtx.fillRect(pr.left - rect.left, pr.top - rect.top, pr.width, pr.height);
      }
      const cr = c.getBoundingClientRect();
      recordCtx.drawImage(c,
        cr.left - rect.left, cr.top - rect.top,
        cr.width, cr.height
      );
    }
  }

  function makeRecordingStream() {
    if (!actx) return null;
    if (!mediaStreamDest) {
      mediaStreamDest = actx.createMediaStreamDestination();
      source.connect(mediaStreamDest);
    }
    const canvasStream = recordCanvas.captureStream(30);
    const audioTrack = mediaStreamDest.stream.getAudioTracks()[0];
    if (audioTrack) canvasStream.addTrack(audioTrack);
    return canvasStream;
  }

  recordBtn.addEventListener('click', () => recorder.toggle(makeRecordingStream));

  // Audio state
  let actx, source, mainAnalyser, analyserL, analyserR, analyserLow, analyserMid, analyserHigh;
  let splitterNode, filterNodes;
  let freqData, timeData, freqDataL, freqDataR, timeLow, timeMid, timeHigh;
  var waveformData = null;
  var spectrogramImg = null;
  let peakL = 0, peakR = 0, peakDecay = 0.97;
  let peakHoldL = 0, peakHoldR = 0, peakHoldDecayCounter = 0;
  let animating = false;
  let fileInfo = {};
  let offlineExporting = false;
  let decodedAudioBuffer = null;

  // Upload
  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const autoExport = $('cfg-auto-export').checked;
    let writable;
    if (autoExport) {
      if (offlineExporting) return;
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'waveforms_export.mp4',
          types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
        });
        writable = await handle.createWritable();
      } catch (err) { return; }
    }

    let prepared;
    if ($('cfg-auto-record').checked && !autoExport) {
      prepared = await recorder.prepareAutoRecord();
      if (!prepared) return;
    }
    loadFile(file, prepared, writable);
  });

  function loadFile(file, prepared, writable) {
    fileInfo.name = file.name;
    trackNameEl.textContent = file.name;

    const reader = new FileReader();
    reader.onload = function(ev) {
      const arrayBuf = ev.target.result;

      // Init audio context on first load
      if (!actx) initAudioContext();

      let waveformReady = false;
      let audioReady = false;

      function tryPlay() {
        if (!waveformReady || !audioReady) return;
        connectSource();
        recordBtn.disabled = false;
        exportBtn.disabled = false;

        if (writable) {
          exportBtn.writable = writable;
          exportBtn.click();
          return;
        }

        audioEl.play();
        if (!animating) { animating = true; animate(); }
        if (prepared && !recorder.isRecording) {
          recorder.startAutoRecord(prepared, makeRecordingStream);
        }
      }

      // Decode for waveform overview
      actx.decodeAudioData(arrayBuf.slice(0), buf => {
        fileInfo.sampleRate = buf.sampleRate;
        fileInfo.channels = buf.numberOfChannels;
        fileInfo.duration = buf.duration;
        decodedAudioBuffer = buf;
        renderWaveformOverview(buf);
        waveformReady = true;
        tryPlay();
      });

      // Play via element
      const blob = new Blob([arrayBuf], { type: file.type || 'audio/mpeg' });
      const url = URL.createObjectURL(blob);
      audioEl.src = url;
      audioEl.onended = () => { if (recorder.isRecording) recorder.stop(); };
      audioEl.onloadeddata = () => {
        audioReady = true;
        tryPlay();
      };
    };
    reader.readAsArrayBuffer(file);
  }

  function initAudioContext() {
    actx = new (window.AudioContext || window.webkitAudioContext)();

    // Main analyser (spectrum + spectrogram)
    mainAnalyser = actx.createAnalyser();
    mainAnalyser.fftSize = 8192;
    mainAnalyser.smoothingTimeConstant = 0.8;
    freqData = new Uint8Array(mainAnalyser.frequencyBinCount);
    timeData = new Uint8Array(mainAnalyser.frequencyBinCount);

    // L/R splitter
    const splitter = actx.createChannelSplitter(2);
    analyserL = actx.createAnalyser(); analyserL.fftSize = 2048; analyserL.smoothingTimeConstant = 0.8;
    analyserR = actx.createAnalyser(); analyserR.fftSize = 2048; analyserR.smoothingTimeConstant = 0.8;
    freqDataL = new Uint8Array(analyserL.frequencyBinCount);
    freqDataR = new Uint8Array(analyserR.frequencyBinCount);

    // Band filters — each band uses highpass → lowpass pair
    var kickHP = actx.createBiquadFilter(); kickHP.type = 'highpass';
    var kickLP = actx.createBiquadFilter(); kickLP.type = 'lowpass';
    var snareHP = actx.createBiquadFilter(); snareHP.type = 'highpass';
    var snareLP = actx.createBiquadFilter(); snareLP.type = 'lowpass';
    var hihatHP = actx.createBiquadFilter(); hihatHP.type = 'highpass';
    var hihatLP = actx.createBiquadFilter(); hihatLP.type = 'lowpass';

    analyserLow = actx.createAnalyser(); analyserLow.fftSize = 2048; analyserLow.smoothingTimeConstant = 0.7;
    analyserMid = actx.createAnalyser(); analyserMid.fftSize = 2048; analyserMid.smoothingTimeConstant = 0.7;
    analyserHigh = actx.createAnalyser(); analyserHigh.fftSize = 2048; analyserHigh.smoothingTimeConstant = 0.7;
    timeLow = new Uint8Array(analyserLow.frequencyBinCount);
    timeMid = new Uint8Array(analyserMid.frequencyBinCount);
    timeHigh = new Uint8Array(analyserHigh.frequencyBinCount);

    // Store filter nodes
    splitterNode = splitter;
    filterNodes = { kickHP, kickLP, snareHP, snareLP, hihatHP, hihatLP };

    // Wire filters: HP → LP → analyser
    kickHP.connect(kickLP); kickLP.connect(analyserLow);
    snareHP.connect(snareLP); snareLP.connect(analyserMid);
    hihatHP.connect(hihatLP); hihatLP.connect(analyserHigh);

    splitter.connect(analyserL, 0);
    splitter.connect(analyserR, 1);
    mainAnalyser.connect(actx.destination);

    applyFilters();
  }

  function applyFilters() {
    if (!filterNodes) return;
    filterNodes.kickHP.frequency.value = config.kick.lo;
    filterNodes.kickLP.frequency.value = config.kick.hi;
    filterNodes.snareHP.frequency.value = config.snare.lo;
    filterNodes.snareLP.frequency.value = config.snare.hi;
    filterNodes.hihatHP.frequency.value = config.hihat.lo;
    filterNodes.hihatLP.frequency.value = config.hihat.hi;
  }

  function connectSource() {
    if (source) return;
    source = actx.createMediaElementSource(audioEl);
    source.connect(mainAnalyser);
    source.connect(splitterNode);
    source.connect(filterNodes.kickHP);
    source.connect(filterNodes.snareHP);
    source.connect(filterNodes.hihatHP);
  }

  // Waveform overview from AudioBuffer
  function renderWaveformOverview(buf) {
    const ch0 = buf.getChannelData(0);
    const c = waveformC;
    const w = c.width;
    const samplesPerPixel = Math.floor(ch0.length / w);
    const mins = new Float32Array(w);
    const maxs = new Float32Array(w);
    for (let i = 0; i < w; i++) {
      let min = 1, max = -1;
      const start = i * samplesPerPixel;
      for (let j = 0; j < samplesPerPixel; j++) {
        const s = ch0[start + j] || 0;
        if (s < min) min = s;
        if (s > max) max = s;
      }
      mins[i] = min;
      maxs[i] = max;
    }
    waveformData = { mins, maxs };
    drawWaveformStatic();
  }

  function drawWaveformStatic(playX) {
    if (!waveformData) return;
    const ctx = contexts['waveform-canvas'];
    const w = waveformC.width, h = waveformC.height;
    ctx.clearRect(0, 0, w, h);
    const { mins, maxs } = waveformData;
    const mid = h / 2;
    const len = Math.min(mins.length, w);
    const px = playX || 0;
    for (let i = 0; i < len; i++) {
      const top = mid + maxs[i] * mid;
      const bot = mid + mins[i] * mid;
      ctx.fillStyle = i < px ? '#aaa' : '#444';
      ctx.fillRect(i, top, 1, bot - top);
    }
  }

  // Format time
  function fmt(s) {
    if (!isFinite(s) || isNaN(s)) s = 0;
    const neg = s < 0; s = Math.abs(s);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    const str = (h > 0 ? String(h).padStart(2,'0') + ':' : '') + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    return neg ? '-' + str : str;
  }

  // Drawing functions
  function drawSpectrum() {
    if (!offlineExporting) mainAnalyser.getByteFrequencyData(freqData);
    const ctx = contexts['spectrum-canvas'];
    const w = spectrumC.width, h = spectrumC.height;
    ctx.clearRect(0, 0, w, h);

    const topPad = 12 * dpr;
    const baseline = h - 12 * dpr;
    const drawH = baseline - topPad;

    // Grid
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    const gridFreqs = [60, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
    const nyquist = (fileInfo.sampleRate || 48000) / 2;
    const binCount = mainAnalyser.frequencyBinCount;
    for (const f of gridFreqs) {
      const x = freqToX(f, nyquist, binCount, w);
      ctx.beginPath(); ctx.moveTo(x, topPad); ctx.lineTo(x, baseline); ctx.stroke();
      ctx.fillStyle = '#666';
      ctx.font = `${config.labelSize * dpr}px Inter, sans-serif`;
      ctx.fillText(f >= 1000 ? (f/1000) + 'k' : f + '', x + 2, topPad - 3 * dpr);
    }
    // dB grid lines
    for (let i = 1; i <= 4; i++) {
      const y = topPad + drawH * i / 5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Bars with log frequency mapping
    const numBars = config.numBars;
    for (let i = 0; i < numBars; i++) {
      const fLow = nyquist * Math.pow(i / numBars, 2);
      const fHigh = nyquist * Math.pow((i + 1) / numBars, 2);
      const binLow = Math.floor(fLow / nyquist * binCount);
      const binHigh = Math.max(binLow + 1, Math.floor(fHigh / nyquist * binCount));
      let sum = 0, count = 0;
      for (let b = binLow; b < binHigh && b < binCount; b++) { sum += freqData[b]; count++; }
      const val = count > 0 ? sum / count / 255 : 0;
      const barH = val * drawH;
      const x = (i / numBars) * w;
      const bw = w / numBars;
      if (barH > 0) {
        const grad = ctx.createLinearGradient(0, baseline, 0, baseline - barH);
        grad.addColorStop(0, '#222');
        grad.addColorStop(0.4, '#666');
        grad.addColorStop(0.7, '#aaa');
        grad.addColorStop(1, '#fff');
        ctx.fillStyle = grad;
        ctx.fillRect(x, baseline - barH, bw - (bw > 2 ? 1 : 0), barH);
      }
    }
  }

  function freqToX(freq, nyquist, binCount, w) {
    const ratio = freq / nyquist;
    const logPos = Math.sqrt(ratio);
    return logPos * w;
  }

  function drawSpectrogram() {
    if (!offlineExporting) mainAnalyser.getByteFrequencyData(freqData);
    const ctx = contexts['spectrogram-canvas'];
    const w = spectrogramC.width, h = spectrogramC.height;

    if (!spectrogramImg || spectrogramImg.width !== w || spectrogramImg.height !== h) {
      spectrogramImg = ctx.createImageData(w, h);
      for (let i = 3; i < spectrogramImg.data.length; i += 4) spectrogramImg.data[i] = 255;
    }

    // Shift left by 1 pixel
    const d = spectrogramImg.data;
    for (let y = 0; y < h; y++) {
      const row = y * w * 4;
      for (let x = 0; x < (w - 1); x++) {
        const dst = row + x * 4;
        const src = row + (x + 1) * 4;
        d[dst] = d[src]; d[dst+1] = d[src+1]; d[dst+2] = d[src+2];
      }
    }

    // Draw new column at right edge
    const binCount = mainAnalyser.frequencyBinCount;
    const col = (w - 1) * 4;
    for (let y = 0; y < h; y++) {
      const freqRatio = 1 - y / h;
      const bin = Math.floor(freqRatio * freqRatio * binCount);
      const val = bin < binCount ? freqData[bin] : 0;
      const idx = y * w * 4 + col;
      d[idx] = val; d[idx+1] = val; d[idx+2] = val;
    }

    ctx.putImageData(spectrogramImg, 0, 0);
  }

  function drawMeters() {
    if (!offlineExporting) {
      analyserL.getByteFrequencyData(freqDataL);
      analyserR.getByteFrequencyData(freqDataR);
    }
    const ctx = contexts['meters-canvas'];
    const w = metersC.width, h = metersC.height;
    ctx.clearRect(0, 0, w, h);

    // RMS levels
    let sumL = 0, sumR = 0;
    for (let i = 0; i < freqDataL.length; i++) sumL += freqDataL[i];
    for (let i = 0; i < freqDataR.length; i++) sumR += freqDataR[i];
    let lvlL = sumL / (freqDataL.length * 255);
    let lvlR = sumR / (freqDataR.length * 255);

    // Peak hold
    if (lvlL > peakHoldL) { peakHoldL = lvlL; peakHoldDecayCounter = 0; }
    if (lvlR > peakHoldR) { peakHoldR = lvlR; peakHoldDecayCounter = 0; }
    peakHoldDecayCounter++;
    if (peakHoldDecayCounter > 30) { peakHoldL *= 0.995; peakHoldR *= 0.995; }

    const meterW = w * 0.25;
    const gap = w * 0.1;
    const xL = w / 2 - meterW - gap / 2;
    const xR = w / 2 + gap / 2;
    const topPad = 18 * dpr;
    const botPad = 30 * dpr;
    const meterH = h - topPad - botPad;

    // Meter backgrounds
    ctx.fillStyle = '#111';
    ctx.fillRect(xL, topPad, meterW, meterH);
    ctx.fillRect(xR, topPad, meterW, meterH);

    // Meter fills
    const hL = lvlL * meterH;
    const hR = lvlR * meterH;
    ctx.fillStyle = '#fff';
    ctx.fillRect(xL, topPad + meterH - hL, meterW, hL);
    ctx.fillRect(xR, topPad + meterH - hR, meterW, hR);

    // Peak hold lines
    ctx.fillStyle = '#888';
    const phL = peakHoldL * meterH;
    const phR = peakHoldR * meterH;
    ctx.fillRect(xL, topPad + meterH - phL, meterW, 1 * dpr);
    ctx.fillRect(xR, topPad + meterH - phR, meterW, 1 * dpr);

    // dB scale
    ctx.fillStyle = '#444';
    ctx.font = `${8 * dpr}px monospace`;
    ctx.textAlign = 'center';
    const dbMarks = [0, -6, -12, -24, -48];
    for (const db of dbMarks) {
      const ratio = Math.pow(10, db / 20);
      const y = topPad + meterH - ratio * meterH;
      if (y >= topPad && y <= topPad + meterH) {
        ctx.fillText(db + '', w / 2, y + 3 * dpr);
        ctx.fillStyle = '#222';
        ctx.fillRect(xL, y, meterW, 1);
        ctx.fillRect(xR, y, meterW, 1);
        ctx.fillStyle = '#444';
      }
    }

    // dB readout
    const dbL = lvlL > 0 ? (20 * Math.log10(lvlL)).toFixed(1) : '-inf';
    const dbR = lvlR > 0 ? (20 * Math.log10(lvlR)).toFixed(1) : '-inf';
    ctx.fillStyle = '#888';
    ctx.font = `${10 * dpr}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(dbL, xL + meterW / 2, h - 8 * dpr);
    ctx.fillText(dbR, xR + meterW / 2, h - 8 * dpr);
  }

  // Heartbeat ECG state per channel
  const ecgBufferSize = 600;
  const ecgState = {
    'osc-low':  { buffer: new Float32Array(ecgBufferSize), pos: 0, avg: 0, peak: 0 },
    'osc-mid':  { buffer: new Float32Array(ecgBufferSize), pos: 0, avg: 0, peak: 0 },
    'osc-high': { buffer: new Float32Array(ecgBufferSize), pos: 0, avg: 0, peak: 0 },
  };

  const ecgGainMap = { 'osc-low': 'kick', 'osc-mid': 'snare', 'osc-high': 'hihat' };

  function drawOscilloscope(canvas, analyser, dataArr) {
    if (!offlineExporting) analyser.getByteFrequencyData(dataArr);
    const ctx = contexts[canvas.id];
    const w = canvas.width, h = canvas.height;
    const state = ecgState[canvas.id];
    const gain = config[ecgGainMap[canvas.id]].gain;

    // Compute current energy (RMS of frequency data)
    let sum = 0;
    for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
    const energy = sum / (dataArr.length * 255);

    // Onset detection: compare to running average
    const alpha = 0.95;
    state.avg = state.avg * alpha + energy * (1 - alpha);
    const onset = Math.max(0, energy - state.avg);
    const spike = Math.pow(onset * 8 * gain, 1.5);
    const val = Math.min(1, spike);

    // Peak decay for sharper spikes
    if (val > state.peak) state.peak = val;
    else state.peak *= 0.92;

    // Write to circular buffer
    state.buffer[state.pos % ecgBufferSize] = state.peak;
    state.pos++;

    // Draw
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    // Grid lines
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const y = h * i / 4;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // ECG trace
    const baseline = h * 0.75 + 10 * dpr;
    const amplitude = h * 0.65;
    const len = Math.min(state.pos, ecgBufferSize);
    const startIdx = state.pos - len;

    // Glow
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8 * dpr;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2 * dpr;
    ctx.beginPath();
    for (let i = 0; i < len; i++) {
      const bufIdx = (startIdx + i) % ecgBufferSize;
      const x = (i / ecgBufferSize) * w;
      const v = state.buffer[bufIdx];
      const y = baseline - v * amplitude;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Core line
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    for (let i = 0; i < len; i++) {
      const bufIdx = (startIdx + i) % ecgBufferSize;
      const x = (i / ecgBufferSize) * w;
      const v = state.buffer[bufIdx];
      const y = baseline - v * amplitude;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Scanning dot at the write head
    if (len > 0) {
      const dotIdx = (state.pos - 1) % ecgBufferSize;
      const dotX = ((len - 1) / ecgBufferSize) * w;
      const dotY = baseline - state.buffer[dotIdx] * amplitude;
      ctx.beginPath();
      ctx.arc(dotX, dotY, 3 * dpr, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 12 * dpr;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawPlayhead() {
    if (!waveformData) return;
    drawWaveformStatic();
    const ctx = contexts['waveform-canvas'];
    const w = waveformC.width, h = waveformC.height;
    const dur = audioEl.duration || 1;
    const cur = audioEl.currentTime || 0;
    const x = (cur / dur) * w;

    drawWaveformStatic(x);

    // Playhead line
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();

    // Header info
    const sr = fileInfo.sampleRate || 48000;
    const ch = fileInfo.channels || 2;
    headerInfo.textContent = `${sr} Hz \u00b7 ${ch}ch \u00b7 ${fmt(cur)} / ${fmt(dur)}`;

    // Track details
    trackDetails.innerHTML = `${fileInfo.name || ''}<br>${sr} Hz &middot; ${ch} channels &middot; ${fmt(dur)} duration`;
  }

  // Click on waveform to seek
  $('waveform-panel').addEventListener('click', e => {
    if (!audioEl.duration) return;
    const rect = waveformC.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audioEl.currentTime = ratio * audioEl.duration;
  });

  // Animation loop
  let lastRenderMs = 0;
  function animate() {
    if (!mainAnalyser) { requestAnimationFrame(animate); return; }
    if (offlineExporting) { requestAnimationFrame(animate); return; }
    if (recorder.isRecording && $('cfg-lock-60fps').checked) {
      const now = performance.now();
      if (now - lastRenderMs < 16.5) { requestAnimationFrame(animate); return; }
      lastRenderMs = now;
    }
    drawSpectrum();
    drawSpectrogram();
    drawMeters();
    drawOscilloscope(oscLowC, analyserLow, timeLow);
    drawOscilloscope(oscMidC, analyserMid, timeMid);
    drawOscilloscope(oscHighC, analyserHigh, timeHigh);
    drawPlayhead();
    compositeFrame();
    requestAnimationFrame(animate);
  }
  // Export
  let exportCancelled = false;

  exportBtn.addEventListener('click', async () => {
    if (!decodedAudioBuffer) { alert('Load an audio file first.'); return; }
    if (offlineExporting) return;

    const writable = exportBtn.writable || await (async () => {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'waveforms_export.mp4',
          types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
        });
        return await handle.createWritable();
      } catch (e) { return null; }
    })();
    exportBtn.writable = null;
    if (!writable) return;

    const overlay = $('exportOverlay');
    const progressBar = $('exportProgressBar');
    const percentText = $('exportPercent');
    const statusText = $('exportStatus');
    overlay.style.display = 'flex';
    exportCancelled = false;

    // Size the record canvas to 1920x1080
    recordCanvas.width = 1920;
    recordCanvas.height = 1080;

    // Reset spectrogram and ECG state for clean export
    spectrogramImg = null;
    for (const key of Object.keys(ecgState)) {
      ecgState[key].buffer.fill(0);
      ecgState[key].pos = 0;
      ecgState[key].avg = 0;
      ecgState[key].peak = 0;
    }
    peakHoldL = 0; peakHoldR = 0; peakHoldDecayCounter = 0;

    offlineExporting = true;

    // Helper: split full-spectrum FFT data into band-filtered oscilloscope data
    // Apply temporal smoothing between frames to match live analyser behavior
    const prevBandLow = new Float32Array(timeLow.length);
    const prevBandMid = new Float32Array(timeMid.length);
    const prevBandHigh = new Float32Array(timeHigh.length);
    const bandSmoothing = 0.7;

    function fillBandData(fullFreqData, bandArr, prevBand, loHz, hiHz, sampleRate, binCount) {
      const nyquist = sampleRate / 2;
      const loBin = Math.floor(loHz / nyquist * binCount);
      const hiBin = Math.min(Math.floor(hiHz / nyquist * binCount), binCount);
      bandArr.fill(0);
      const len = Math.min(hiBin - loBin, bandArr.length);
      for (let i = 0; i < len; i++) {
        const raw = fullFreqData[loBin + i] || 0;
        const smoothed = prevBand[i] * bandSmoothing + raw * (1 - bandSmoothing);
        prevBand[i] = smoothed;
        bandArr[i] = smoothed;
      }
      bandArr._activeBins = len;
    }

    // Helper: compute per-channel RMS energy from raw samples for L/R meters
    function computeChannelLevels(frameIndex) {
      const samplesPerFrame = decodedAudioBuffer.sampleRate / 60;
      const start = Math.round(frameIndex * samplesPerFrame);
      const end = Math.min(start + Math.ceil(samplesPerFrame), decodedAudioBuffer.length);
      const numCh = decodedAudioBuffer.numberOfChannels;
      const chData = [];
      for (let ch = 0; ch < numCh; ch++) chData.push(decodedAudioBuffer.getChannelData(ch));

      let sumL = 0, sumR = 0;
      const count = end - start;
      for (let i = start; i < end; i++) {
        const sL = chData[0][i] || 0;
        sumL += sL * sL;
        const sR = numCh > 1 ? (chData[1][i] || 0) : sL;
        sumR += sR * sR;
      }
      const rmsL = count > 0 ? Math.sqrt(sumL / count) : 0;
      const rmsR = count > 0 ? Math.sqrt(sumR / count) : 0;

      // Convert RMS to byte frequency-like levels (0-255 range spread across bins)
      const lvlL = Math.min(1, rmsL * 2.5);
      const lvlR = Math.min(1, rmsR * 2.5);
      const valL = Math.round(lvlL * 255);
      const valR = Math.round(lvlR * 255);
      for (let i = 0; i < freqDataL.length; i++) freqDataL[i] = valL;
      for (let i = 0; i < freqDataR.length; i++) freqDataR[i] = valR;
    }

    let exportFrame = 0;
    const totalExportFrames = Math.ceil(decodedAudioBuffer.duration * 60);

    try {
      await offlineExport({
        audioBuffer: decodedAudioBuffer,
        fps: 60,
        width: 1920,
        height: 1080,
        fftSize: mainAnalyser.fftSize,
        smoothingTimeConstant: mainAnalyser.smoothingTimeConstant,
        minDecibels: mainAnalyser.minDecibels,
        maxDecibels: mainAnalyser.maxDecibels,
        writable,
        isCancelled: () => exportCancelled,
        renderFrame: (fftData, delta) => {
          // Populate freqData from offline FFT
          const copyLen = Math.min(fftData.length, freqData.length);
          for (let i = 0; i < copyLen; i++) freqData[i] = fftData[i];

          // Populate L/R meter data from per-channel raw samples
          computeChannelLevels(exportFrame);

          // Populate band oscilloscope data (spread across full array so energy calc works)
          const sr = decodedAudioBuffer.sampleRate;
          const bins = fftData.length;
          fillBandData(fftData, timeLow, prevBandLow, config.kick.lo, config.kick.hi, sr, bins);
          fillBandData(fftData, timeMid, prevBandMid, config.snare.lo, config.snare.hi, sr, bins);
          fillBandData(fftData, timeHigh, prevBandHigh, config.hihat.lo, config.hihat.hi, sr, bins);

          drawSpectrum();
          drawSpectrogram();
          drawMeters();
          drawOscilloscope(oscLowC, analyserLow, timeLow);
          drawOscilloscope(oscMidC, analyserMid, timeMid);
          drawOscilloscope(oscHighC, analyserHigh, timeHigh);

          // Waveform with progressing playhead
          if (waveformData) {
            const playX = (exportFrame / totalExportFrames) * waveformC.width;
            drawWaveformStatic(playX);
            // Draw playhead line
            const wCtx = contexts['waveform-canvas'];
            wCtx.strokeStyle = '#fff';
            wCtx.lineWidth = 1 * dpr;
            wCtx.beginPath();
            wCtx.moveTo(playX, 0);
            wCtx.lineTo(playX, waveformC.height);
            wCtx.stroke();
          }

          compositeFrame();
          exportFrame++;
        },
        readCanvas: () => recordCanvas,
        gpuFinish: () => {},
        onProgress: (frac) => {
          const pct = Math.round(frac * 100);
          progressBar.style.width = pct + '%';
          percentText.textContent = pct + '%';
          const totalFrames = Math.ceil(decodedAudioBuffer.duration * 60);
          statusText.textContent = 'Exporting... frame ' + Math.round(frac * totalFrames) + '/' + totalFrames;
        },
        onDone: () => {
          statusText.textContent = 'Export complete!';
          setTimeout(() => { overlay.style.display = 'none'; }, 1500);
        },
      });
    } catch (e) {
      console.error('Export error:', e);
      statusText.textContent = 'Export failed: ' + e.message;
      setTimeout(() => { overlay.style.display = 'none'; }, 3000);
    }

    offlineExporting = false;
  });

  $('exportCancelBtn').addEventListener('click', () => {
    exportCancelled = true;
    $('exportStatus').textContent = 'Cancelling...';
  });

})();
</script>
</body>
</html>
