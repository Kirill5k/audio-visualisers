<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Terrain Flythrough</title>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>
<script src="audio-reactivity.js"></script>
<script src="viz-shell.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================
// Settings
// =====================================================
const FFT_BINS = 1024;
let HISTORY = 320;
const LOW_BIN_SKIP = 10;
const PLANE_W = 130;
const PLANE_D = 230;

let scrollSpeed = 1.0;
let heightScale = 28.0;
let gain = 1.5;
let emissive = 1.0;
let fogClarity = 0.55;     // how much "build" clears the haze
let sunWarmth = 0.6;       // how much "build" warms the sun
let energyBrightness = 0.8;
let filmGrain = false;

let colorLow  = new THREE.Color(0x05060f);
let colorMid  = new THREE.Color(0x2a6f8e);
let colorHigh = new THREE.Color(0xe7f0ea);

let hueShiftEnabled = true;
let hueShiftOffset = 0;
let lastHueUpdateOffset = -1;

const BG = new THREE.Color(0x05070d);

// =====================================================
// Shell
// =====================================================
const shell = createVizShell({
  title: 'Audio Terrain Flythrough',
  defaultFilename: 'terrain',
  exportFilename: 'terrain_export.mp4',
  controls: [
    { type: 'section', label: 'Flight' },
    { type: 'slider', id: 'speed', label: 'Flight Speed', min: 0.2, max: 4, step: 0.1, value: scrollSpeed,
      format: (v) => v.toFixed(1), onChange: (v) => scrollSpeed = v },
    { type: 'slider', id: 'history', label: 'History Rows', min: 120, max: 500, step: 20, value: HISTORY,
      format: (v) => String(Math.round(v)), onChange: (v) => rebuildHistory(Math.round(v)) },
    { type: 'checkbox', id: 'autoRotate', label: 'Camera Drift', value: false,
      onChange: (v) => controls.autoRotate = v },
    { type: 'slider', id: 'driftSpeed', label: 'Drift Speed', min: 0, max: 2, step: 0.05, value: 0.3,
      format: (v) => v.toFixed(2), onChange: (v) => controls.autoRotateSpeed = v },

    { type: 'section', label: 'Terrain' },
    { type: 'slider', id: 'height', label: 'Ridge Height', min: 8, max: 50, step: 1, value: heightScale,
      format: (v) => String(Math.round(v)), onChange: (v) => { heightScale = v; mat.uniforms.uHeightScale.value = v; } },
    { type: 'slider', id: 'gain', label: 'Gain', min: 0.5, max: 4, step: 0.1, value: gain,
      format: (v) => v.toFixed(1), onChange: (v) => { gain = v; mat.uniforms.uGain.value = v; } },

    { type: 'section', label: 'Color Gradient' },
    { type: 'color', id: 'low', label: 'Low (valleys)', value: '#05060f', onChange: (v) => { colorLow.set(v); refreshLUT(); } },
    { type: 'color', id: 'mid', label: 'Mid', value: '#2a6f8e', onChange: (v) => { colorMid.set(v); refreshLUT(); } },
    { type: 'color', id: 'high', label: 'High (peaks)', value: '#e7f0ea', onChange: (v) => { colorHigh.set(v); refreshLUT(); } },
    { type: 'checkbox', id: 'hue', label: 'Hue Shift Over Time', value: true, onChange: (v) => {
        hueShiftEnabled = v; if (!v) { hueShiftOffset = 0; refreshLUT(); } } },

    { type: 'section', label: 'Atmosphere' },
    { type: 'slider', id: 'fogClarity', label: 'Drop Clarity', min: 0, max: 1, step: 0.05, value: fogClarity,
      format: (v) => v.toFixed(2), onChange: (v) => fogClarity = v },
    { type: 'slider', id: 'warmth', label: 'Sun Warmth', min: 0, max: 1, step: 0.05, value: sunWarmth,
      format: (v) => v.toFixed(2), onChange: (v) => sunWarmth = v },
    { type: 'slider', id: 'bright', label: 'Energy Glow', min: 0, max: 2, step: 0.05, value: energyBrightness,
      format: (v) => v.toFixed(2), onChange: (v) => energyBrightness = v },
    { type: 'checkbox', id: 'grain', label: 'Film Grain', value: false, onChange: (v) => {
        filmGrain = v; mat.uniforms.uFilmGrain.value = v ? 1.0 : 0.0; } },
  ],
});
const audio = shell.audio;

// =====================================================
// Scene
// =====================================================
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 40, 210);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.position.set(0, 17, 98);
camera.lookAt(0, 7, -40);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, -30);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 320;
controls.maxPolarAngle = Math.PI * 0.92;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.3;
controls.update();

// =====================================================
// Color LUT (low / mid / high with hue shift)
// =====================================================
const LUT_SIZE = 256;
const lutData = new Uint8Array(LUT_SIZE * 4);
const sLow = new THREE.Color(), sMid = new THREE.Color(), sHigh = new THREE.Color();
const tmpC = new THREE.Color();
const tmpHSL = { h: 0, s: 0, l: 0 };

function buildLUT() {
  sLow.copy(colorLow); sMid.copy(colorMid); sHigh.copy(colorHigh);
  if (hueShiftEnabled && hueShiftOffset > 0) {
    [sLow, sMid, sHigh].forEach((c) => {
      c.getHSL(tmpHSL);
      c.setHSL((tmpHSL.h + hueShiftOffset) % 1, tmpHSL.s, tmpHSL.l);
    });
  }
  for (let i = 0; i < LUT_SIZE; i++) {
    const t = i / (LUT_SIZE - 1);
    if (t <= 0.5) tmpC.lerpColors(sLow, sMid, t * 2);
    else tmpC.lerpColors(sMid, sHigh, (t - 0.5) * 2);
    lutData[i * 4]     = Math.round(tmpC.r * 255);
    lutData[i * 4 + 1] = Math.round(tmpC.g * 255);
    lutData[i * 4 + 2] = Math.round(tmpC.b * 255);
    lutData[i * 4 + 3] = 255;
  }
}
buildLUT();

const lutTexture = new THREE.DataTexture(lutData, LUT_SIZE, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
lutTexture.minFilter = THREE.LinearFilter;
lutTexture.magFilter = THREE.LinearFilter;
lutTexture.needsUpdate = true;

function refreshLUT() {
  buildLUT();
  lutTexture.image.data.set(lutData);
  lutTexture.needsUpdate = true;
}

// =====================================================
// Spectrogram history texture
// =====================================================
let dataArray = new Uint8Array(FFT_BINS * HISTORY);
let dataTexture = makeDataTexture();
let historyHead = 0;

function makeDataTexture() {
  const t = new THREE.DataTexture(dataArray, FFT_BINS, HISTORY, THREE.RedFormat, THREE.UnsignedByteType);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}

// =====================================================
// Material
// =====================================================
const mat = new THREE.ShaderMaterial({
  uniforms: {
    uDataTexture: { value: dataTexture },
    uColorLUT: { value: lutTexture },
    uHistoryHead: { value: 0.0 },
    uHistorySize: { value: HISTORY },
    uHeightScale: { value: heightScale },
    uGain: { value: gain },
    uLowBinSkip: { value: LOW_BIN_SKIP / FFT_BINS },
    uDX: { value: PLANE_W / (FFT_BINS - 1) },
    uDZ: { value: PLANE_D / (HISTORY - 1) },
    uEmissive: { value: emissive },
    uEnergy: { value: 0.0 },
    uSunDir: { value: new THREE.Vector3(-0.25, 0.32, 0.62).normalize() },
    uSunCold: { value: new THREE.Color(0x6f8fd6) },
    uSunWarm: { value: new THREE.Color(0xffb37a) },
    uSunMix: { value: 0.0 },
    uAmbient: { value: 0.28 },
    uFogColor: { value: BG.clone() },
    uFogNear: { value: 40.0 },
    uFogFar: { value: 210.0 },
    uTime: { value: 0.0 },
    uFilmGrain: { value: 0.0 },
  },
  vertexShader: `
    uniform sampler2D uDataTexture;
    uniform sampler2D uColorLUT;
    uniform float uHistoryHead, uHistorySize, uHeightScale, uGain, uLowBinSkip, uDX, uDZ;
    uniform float uEmissive, uEnergy, uSunMix, uAmbient;
    uniform vec3 uSunDir, uSunCold, uSunWarm;
    uniform vec3 uFogColor; uniform float uFogNear, uFogFar;
    varying vec3 vColor; varying vec2 vUv;

    float sampleAmp(vec2 g) {
      float usable = 1.0 - uLowBinSkip;
      float logX = uLowBinSkip + pow(clamp(g.x, 0.0, 1.0), 2.2) * usable;
      float row = (1.0 - clamp(g.y, 0.0, 1.0)) * (uHistorySize - 1.0);
      float texRow = mod(uHistoryHead - 1.0 - row + uHistorySize, uHistorySize);
      float texV = (texRow + 0.5) / uHistorySize;
      float a = texture2D(uDataTexture, vec2(logX, texV)).r;
      return clamp(a * a * uGain, 0.0, 1.0);
    }
    float sampleHeight(vec2 g) { return pow(sampleAmp(g), 1.7) * uHeightScale; }

    void main() {
      vUv = uv;
      float amp = sampleAmp(uv);
      float h = pow(amp, 1.7) * uHeightScale;

      float du = 1.0 / 1023.0;
      float dv = 1.0 / (uHistorySize - 1.0);
      float hR = sampleHeight(uv + vec2(du, 0.0));
      float hL = sampleHeight(uv - vec2(du, 0.0));
      float hU = sampleHeight(uv + vec2(0.0, dv));
      float hD = sampleHeight(uv - vec2(0.0, dv));
      vec3 N = normalize(vec3(-(hR - hL) / (2.0 * uDX), 1.0, -(hU - hD) / (2.0 * uDZ)));

      vec3 displaced = position;
      displaced.y = h;

      vec3 sunColor = mix(uSunCold, uSunWarm, uSunMix);
      float diff = max(dot(N, normalize(uSunDir)), 0.0);
      vec3 baseColor = texture2D(uColorLUT, vec2(amp, 0.5)).rgb;
      vec3 lit = baseColor * (uAmbient + diff * sunColor);
      float glow = pow(amp, 2.4) * uEmissive * (1.0 + uEnergy);
      vec3 finalColor = lit + baseColor * glow;

      vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
      float fogFactor = smoothstep(uFogNear, uFogFar, -mvPosition.z);
      vColor = mix(finalColor, uFogColor, fogFactor);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime, uFilmGrain;
    varying vec3 vColor; varying vec2 vUv;
    float noise(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 color = vColor;
      if (uFilmGrain > 0.0) color += (noise(vUv * 10.0 + uTime) - 0.5) * 0.07 * uFilmGrain;
      gl_FragColor = vec4(color, 1.0);
    }
  `,
});

let geometry = makeGeometry();
let mesh = new THREE.Mesh(geometry, mat);
mesh.frustumCulled = false;
scene.add(mesh);

function makeGeometry() {
  const g = new THREE.PlaneGeometry(PLANE_W, PLANE_D, FFT_BINS - 1, HISTORY - 1);
  g.rotateX(-Math.PI / 2);
  return g;
}

function rebuildHistory(newSize) {
  HISTORY = newSize;
  historyHead = 0;
  accumulator = 0;
  dataTexture.dispose();
  dataArray = new Uint8Array(FFT_BINS * HISTORY);
  dataTexture = makeDataTexture();
  mat.uniforms.uDataTexture.value = dataTexture;
  mat.uniforms.uHistorySize.value = HISTORY;
  mat.uniforms.uHistoryHead.value = 0;
  mat.uniforms.uDZ.value = PLANE_D / (HISTORY - 1);

  scene.remove(mesh);
  geometry.dispose();
  geometry = makeGeometry();
  mesh = new THREE.Mesh(geometry, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
}

function pushNewRow() {
  dataArray.set(shell.frequencyData, historyHead * FFT_BINS);
  const gl = renderer.getContext();
  const texProps = renderer.properties.get(dataTexture);
  if (texProps.__webglTexture) {
    const active = gl.getParameter(gl.TEXTURE_BINDING_2D);
    gl.bindTexture(gl.TEXTURE_2D, texProps.__webglTexture);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, historyHead, FFT_BINS, 1, gl.RED, gl.UNSIGNED_BYTE, shell.frequencyData);
    gl.bindTexture(gl.TEXTURE_2D, active);
  } else {
    dataTexture.needsUpdate = true;
  }
  historyHead = (historyHead + 1) % HISTORY;
  mat.uniforms.uHistoryHead.value = historyHead;
}

// =====================================================
// Render loop
// =====================================================
let accumulator = 0;

function render(delta) {
  mat.uniforms.uTime.value += delta;

  if (hueShiftEnabled) {
    hueShiftOffset += delta * 0.02;
    if (hueShiftOffset > 1) hueShiftOffset -= 1;
    if (Math.abs(hueShiftOffset - lastHueUpdateOffset) > 0.002) {
      lastHueUpdateOffset = hueShiftOffset;
      refreshLUT();
    }
  }

  // Energy-driven atmosphere (smooth, no camera punches)
  const build = audio.build;
  mat.uniforms.uEnergy.value = build * energyBrightness;
  mat.uniforms.uSunMix.value = Math.min(1.0, build * sunWarmth * 1.6);
  mat.uniforms.uFogFar.value = 200.0 + build * fogClarity * 220.0;
  scene.fog.far = mat.uniforms.uFogFar.value;

  // Forward flight: ramp scroll gently with the long-term energy
  const speed = scrollSpeed * (0.6 + 0.7 * audio.build + 0.25 * audio.rms);
  accumulator += delta * speed * 60 * (HISTORY / 320);
  while (accumulator >= 1) { accumulator -= 1; pushNewRow(); }

  controls.update();
  renderer.render(scene, camera);
}

function onResize(w, h) {
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function onExportReset() {
  historyHead = 0;
  accumulator = 0;
  mat.uniforms.uHistoryHead.value = 0;
  mat.uniforms.uTime.value = 0;
  hueShiftOffset = 0;
  lastHueUpdateOffset = -1;
  dataArray.fill(0);
  dataTexture.needsUpdate = true;
  refreshLUT();
}

shell.start({ renderer, camera, render, onResize, onExportReset });
</script>
</body>
</html>
