            position: relative;
            width: 40px;

            transition: background 0.3s;

<script type="x-shader/x-vertex" id="vertexshader">
    attribute float displacement;
    uniform vec3 vLut[256];
    uniform float uHueShift;
    uniform int uDynamicColor;
    varying vec3 vColor;

    vec3 hsv2rgb(vec3 c) {
        vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }

    vec3 rgb2hsv(vec3 c) {
        vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
        vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
        vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
        float d = q.x - min(q.w, q.y);
        float e = 1.0e-10;
        return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
    }

    void main() {
        int index = int(displacement);
        vec3 color = vLut[index];

        if (uDynamicColor == 1) {
            vec3 hsv = rgb2hsv(color);
            hsv.x = fract(hsv.x + uHueShift);
            color = hsv2rgb(hsv);
        }

        vColor = color;
        vec3 newPosition = position + normal * displacement / 25.5;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
</script>

<script type="x-shader/x-fragment" id="fragmentshader">
    varying vec3 vColor;
    void main() {
        gl_FragColor = vec4(vColor, 1.0);
    }
</script>

<script type="x-shader/x-fragment" id="fragmentshader-reflection">
    varying vec3 vColor;
    void main() {
        gl_FragColor = vec4(vColor * 0.3, 0.45);
    }
</script>

<script type="x-shader/x-vertex" id="vignette-vs">
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
</script>

<script type="x-shader/x-fragment" id="vignette-fs">
    uniform sampler2D tDiffuse;
    uniform float uVignetteIntensity;
    uniform float uChromaticAberration;
    varying vec2 vUv;

    void main() {
        vec2 uv = vUv;
        vec2 center = uv - 0.5;
        float dist = length(center);

        float r = texture2D(tDiffuse, uv + center * uChromaticAberration).r;
        float g = texture2D(tDiffuse, uv).g;
        float b = texture2D(tDiffuse, uv - center * uChromaticAberration).b;
        vec3 color = vec3(r, g, b);

        float vignette = 1.0 - dist * uVignetteIntensity;
        vignette = clamp(vignette, 0.0, 1.0);
        vignette = smoothstep(0.0, 1.0, vignette);
        color *= vignette;

        gl_FragColor = vec4(color, 1.0);
    }
</script>

<script>
"use strict";

// ============ EFFECT STATE ============
let fx = {
    bloom: false,
    colorShift: true,
    wireframe: false,
    smoothing: false,
    reflection: false,
    vignette: true,
    autoRecord: false
};

// ============ STATE ============
let ACTX, ANALYSER, SOURCE, audioElement, mediaStreamDest;
let frequency_samples = 1024;
let DATA;
let isPlaying = false;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];

// Three.js state
let camera, scene, renderer, mesh, wireframeMesh, reflectionMesh, heights;
let time_samples = 1200;
let n_vertices = (frequency_samples + 1) * (time_samples + 1);
let animationId;
let composer, bloomPass, vignettePass;
let clock = new THREE.Clock();
let prevData, smoothedData, dispAttr;

// ============ DOM ELEMENTS ============
const fileInput = document.getElementById('fileInput');
const recordBtn = document.getElementById('recordBtn');
const effectsBtn = document.getElementById('effectsBtn');
const effectsPanel = document.getElementById('effectsPanel');
const statusEl = document.getElementById('status');
const audioNameEl = document.getElementById('audioName');

// Toggle panel visibility
effectsBtn.addEventListener('click', () => {
    effectsPanel.classList.toggle('visible');
});

// Toggle switches
function setupToggle(id, key) {
    const el = document.getElementById(id);
    el.addEventListener('click', () => {
        fx[key] = !fx[key];
        el.classList.toggle('active', fx[key]);
        applyEffectChanges();
    });
}
setupToggle('toggleAutoRecord', 'autoRecord');
setupToggle('toggleBloom', 'bloom');
setupToggle('toggleColorShift', 'colorShift');
setupToggle('toggleWireframe', 'wireframe');
setupToggle('toggleSmoothing', 'smoothing');
setupToggle('toggleReflection', 'reflection');
setupToggle('toggleVignette', 'vignette');

function applyEffectChanges() {
    if (wireframeMesh) wireframeMesh.visible = fx.wireframe;
    if (reflectionMesh) reflectionMesh.visible = fx.reflection;
    if (bloomPass) { bloomPass.enabled = fx.bloom; bloomPass.strength = 1.5; }
    if (vignettePass) vignettePass.enabled = fx.vignette;
}

// ============ AUDIO SETUP ============
function initAudio() {
    if (ACTX) return;
    ACTX = new AudioContext();
    ANALYSER = ACTX.createAnalyser();
    ANALYSER.fftSize = 4 * frequency_samples;
    ANALYSER.smoothingTimeConstant = 0.5;
    DATA = new Uint8Array(ANALYSER.frequencyBinCount);
    prevData = new Float32Array(ANALYSER.frequencyBinCount);
    smoothedData = new Uint8Array(ANALYSER.frequencyBinCount);
    mediaStreamDest = ACTX.createMediaStreamDestination();
}

async function loadAudioFile(file, writable) {
    initAudio();
    const url = URL.createObjectURL(file);
    if (SOURCE) { SOURCE.disconnect(); SOURCE = null; }
    if (audioElement) { audioElement.pause(); audioElement.src = ''; }

    audioElement = new Audio();
    audioElement.crossOrigin = "anonymous";
    audioElement.src = url;
    audioElement.addEventListener('ended', () => {
        isPlaying = false;
        statusEl.textContent = 'Playback ended';
        if (isRecording) stopRecording();
    });

    SOURCE = ACTX.createMediaElementSource(audioElement);
    SOURCE.connect(ANALYSER);
    SOURCE.connect(ACTX.destination);
    SOURCE.connect(mediaStreamDest);

    recordBtn.disabled = false;
    audioNameEl.textContent = '\u266B ' + file.name;
    audioNameEl.style.display = 'block';

    if (!renderer) initVisualizer();

    // Auto-play
    audioElement.play();
    isPlaying = true;
    statusEl.textContent = 'Playing...';

    // Auto-record if enabled (writable already obtained from user gesture)
    if (writable !== undefined && !isRecording) {
        const mimeType = getRecordingMime();
        if (mimeType) beginRecording(mimeType, writable);
    }
}

// ============ RECORDING ============
let fileWritable = null;

async function pickSaveFile(ext) {
    if (!window.showSaveFilePicker) return null;
    try {
        const handle = await window.showSaveFilePicker({
            suggestedName: `dj_visualizer.${ext}`,
            types: [{ description: 'Video', accept: { ['video/' + ext]: ['.' + ext] } }]
        });
        return await handle.createWritable();
    } catch (e) {
        if (e.name !== 'AbortError') statusEl.textContent = 'Error: ' + e.message;
        return null;
    }
}

function getRecordingMime() {
    const types = [
        'video/webm;codecs=h264,opus','video/webm;codecs=h264',
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'
    ];
    for (const type of types) { if (MediaRecorder.isTypeSupported(type)) return type; }
    return '';
}

function getRecordingExt(mimeType) {
    return mimeType.includes('mp4') ? 'mp4' : 'webm';
}

async function toggleRecord() {
    if (isRecording) { stopRecording(); return; }
    const mimeType = getRecordingMime();
    if (!mimeType) { statusEl.textContent = 'Error: No supported codec.'; return; }
    const writable = await pickSaveFile(getRecordingExt(mimeType));
    if (!writable && window.showSaveFilePicker) return;
    beginRecording(mimeType, writable);
}

function beginRecording(mimeType, writable) {
    if (!renderer) return;
    fileWritable = writable;

    const canvasStream = renderer.domElement.captureStream(30);
    const videoTrack = canvasStream.getVideoTracks()[0];
    const audioTrack = mediaStreamDest.stream.getAudioTracks()[0];
    const combinedStream = new MediaStream();
    if (videoTrack) combinedStream.addTrack(videoTrack);
    if (audioTrack) combinedStream.addTrack(audioTrack);

    recordedChunks = [];
    try {
        mediaRecorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 8000000 });
    } catch (e) { statusEl.textContent = 'Error: ' + e.message; return; }

    mediaRecorder.ondataavailable = async (e) => {
        if (e.data.size > 0) {
            if (fileWritable) {
                await fileWritable.write(e.data);
            } else {
                recordedChunks.push(e.data);
            }
        }
    };
    mediaRecorder.onstop = async () => {
        if (fileWritable) {
            await fileWritable.close();
            fileWritable = null;
            statusEl.textContent = 'Recording saved to disk!';
        } else {
            const blob = new Blob(recordedChunks, { type: mimeType });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'dj_visualizer.' + getRecordingExt(mimeType);
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            statusEl.textContent = 'Recording saved!';
        }
    };

    mediaRecorder.start(1000);
    isRecording = true;
    recordBtn.textContent = '\u23F9 Stop Recording';
    recordBtn.classList.add('recording');
    statusEl.textContent = 'Recording... (' + mimeType + ')';
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = '\u26AB Record Video';
    recordBtn.classList.remove('recording');
}

// ============ THREE.JS VISUALIZER ============
function initVisualizer() {
    let xsegments = time_samples;
    let ysegments = frequency_samples;
    let xsize = 35;
    let ysize = 20;
    let xhalfSize = xsize / 2;
    let yhalfSize = ysize / 2;
    let xsegmentSize = xsize / xsegments;

    camera = new THREE.PerspectiveCamera(27, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 64;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);

    let geometry = new THREE.BufferGeometry();
    let indices = [];
    let heightsArr = [];
    let vertices = [];

    // Logarithmic y-axis
    let ypow_max = Math.log(ysize);
    let ybase = Math.E;

    for (let i = 0; i <= xsegments; i++) {
        let x = (i * xsegmentSize) - xhalfSize;
        for (let j = 0; j <= ysegments; j++) {
            let powr = (ysegments - j) / ysegments * ypow_max;
            let y = -Math.pow(ybase, powr) + yhalfSize + 1;
            vertices.push(x, y, 0);
            heightsArr.push(0);
        }
    }

    for (let i = 0; i < xsegments; i++) {
        for (let j = 0; j < ysegments; j++) {
            let a = i * (ysegments + 1) + (j + 1);
            let b = i * (ysegments + 1) + j;
            let c = (i + 1) * (ysegments + 1) + j;
            let d = (i + 1) * (ysegments + 1) + (j + 1);
            indices.push(a, b, d);
            indices.push(b, c, d);
        }
    }

    };
    vignettePass = new THREE.ShaderPass(vignetteShader);

    composer.addPass(vignettePass);

    animate();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    animationId = requestAnimationFrame(animate);
    render();
}

function render() {
    updateGeometry();

    // Update dynamic color shift
    let elapsed = clock.getElapsedTime();
    let dynVal = fx.colorShift ? 1 : 0;
    let hueVal = elapsed * 0.05;

    mesh.material.uniforms.uDynamicColor.value = dynVal;
    mesh.material.uniforms.uHueShift.value = hueVal;
    if (fx.wireframe) {
        wireframeMesh.material.uniforms.uDynamicColor.value = dynVal;
        wireframeMesh.material.uniforms.uHueShift.value = hueVal;
    }
    if (fx.reflection) {
        reflectionMesh.material.uniforms.uDynamicColor.value = dynVal;
        reflectionMesh.material.uniforms.uHueShift.value = hueVal;
    }

    composer.render();
}

function updateGeometry() {
    if (!ANALYSER || !DATA) return;

    ANALYSER.getByteFrequencyData(DATA);

    let src;
    if (fx.smoothing) {
        let smoothFactor = 0.35;
        for (let i = 0; i < DATA.length; i++) {
            prevData[i] = prevData[i] + (DATA[i] - prevData[i]) * smoothFactor;
            smoothedData[i] = Math.round(prevData[i]);
        }
        src = smoothedData;
    } else {
        src = DATA;
    }

    let buf = dispAttr.array;
    let start_val = frequency_samples + 1;
    let end_val = n_vertices - start_val;

    buf.copyWithin(0, start_val, n_vertices + 1);
    buf.set(src, end_val - start_val);

    dispAttr.needsUpdate = true;
}

// ============ EVENT LISTENERS ============
fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    let writable;
    if (fx.autoRecord) {
        const mimeType = getRecordingMime();
        writable = await pickSaveFile(getRecordingExt(mimeType));
        if (!writable && window.showSaveFilePicker) return;
    }
    loadAudioFile(file, writable);
});
recordBtn.addEventListener('click', toggleRecord);
