<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Spectrogram — Audio Visualiser</title>
  <link rel="stylesheet" href="css/visualiser-ui.css">
</head>
<body>
  <div id="stage"></div>

  <button id="panelToggle" class="glass" aria-label="Hide settings" title="Hide settings">×</button>

  <aside id="panel" class="glass">
    <div class="brand">
      <div>
        <div class="eyebrow">Audio reactive study</div>
        <h1>2D Spectrogram</h1>
      </div>
    </div>

    <label class="file-picker" for="fileInput">Choose an audio file</label>
    <input id="fileInput" type="file" accept="audio/*">

    <section class="section">
      <div class="section-title">Visualiser</div>

      <div class="control">
        <div class="control-head"><span>Scroll speed</span><span class="value" id="scrollSpeedValue">0.5</span></div>
        <input id="scrollSpeed" type="range" min="0.1" max="3.0" step="0.1" value="0.5">
      </div>

      <label class="toggle-row">
        <span>Displacement smoothing</span>
        <input id="smoothing" type="checkbox">
      </label>
    </section>

    <section class="section">
      <div class="section-title">Effects</div>
      <label class="toggle-row">
        <span>Bloom / Glow</span>
        <input id="bloom" type="checkbox">
      </label>
      <label class="toggle-row">
        <span>Dynamic colour shift</span>
        <input id="colorShift" type="checkbox">
      </label>
      <label class="toggle-row">
        <span>Wireframe overlay</span>
        <input id="wireframe" type="checkbox">
      </label>
      <label class="toggle-row">
        <span>Reflective ground</span>
        <input id="reflection" type="checkbox">
      </label>
      <label class="toggle-row">
        <span>Vignette + aberration</span>
        <input id="vignette" type="checkbox" checked>
      </label>
    </section>

    <section class="section">
      <div class="section-title">Capture</div>
      <label class="toggle-row">
        <span>Record on load</span>
        <input id="autoRecord" type="checkbox">
      </label>
      <label class="toggle-row">
        <span>Export on load</span>
        <input id="autoExport" type="checkbox">
      </label>
      <label class="toggle-row">
        <span>Lock recording to 60 fps</span>
        <input id="lock60" type="checkbox">
      </label>
    </section>
  </aside>

  <nav id="actions">
    <button id="playPauseBtn" class="action glass" disabled title="Play">▶ <span class="action-label">Play</span></button>
    <button id="replayBtn" class="action glass" disabled title="Replay">↺ <span class="action-label">Replay</span></button>
    <button id="unloadBtn" class="action glass" disabled title="Unload">⊘ <span class="action-label">Unload</span></button>
    <button id="recordBtn" class="action glass" disabled><span class="record-dot"></span><span class="action-label">Record</span></button>
    <button id="exportBtn" class="action glass" disabled>↓ <span class="action-label">Export</span></button>
    <button id="fullscreenBtn" class="action glass" title="Fullscreen">⛶</button>
  </nav>

  <div id="readout" class="glass">
    <span id="statusLight"></span>
    <span id="statusText">Choose an audio file to begin</span>
    <span id="fps">— fps</span>
  </div>

  <div id="exportOverlay">
    <div class="export-card glass">
      <div id="exportStatus">Rendering the spectrogram…</div>
      <div class="progress"><div id="exportProgressBar"></div></div>
      <div id="exportPercent">0%</div>
      <button id="exportCancelBtn" class="action glass">Cancel export</button>
    </div>
  </div>

  <div id="fatal">WebGL is unavailable in this browser.</div>

    const VERTEX_SHADER = /* glsl */ `
      attribute float displacement;
      uniform vec3 vLut[256];
      uniform float uHueShift;
      uniform int uDynamicColor;
      varying vec3 vColor;

      vec3 hsv2rgb(vec3 c) {
        vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
      }

      vec3 rgb2hsv(vec3 c) {
        vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
        vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
        vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
        float d = q.x - min(q.w, q.y);
        float e = 1.0e-10;
        return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
      }

      void main() {
        int index = int(displacement);
        vec3 color = vLut[index];

        if (uDynamicColor == 1) {
          vec3 hsv = rgb2hsv(color);
          hsv.x = fract(hsv.x + uHueShift);
          color = hsv2rgb(hsv);
        }

        vColor = color;
        vec3 newPosition = position + normal * displacement / 25.5;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
      }
    `;

    const FRAGMENT_SHADER = /* glsl */ `
      varying vec3 vColor;
      void main() {
        gl_FragColor = vec4(vColor, 1.0);
      }
    `;

      varying vec3 vColor;
      void main() {
        gl_FragColor = vec4(vColor * 0.3, 0.45);
      }
    `;

    const VIGNETTE_VERTEX = /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const VIGNETTE_FRAGMENT = /* glsl */ `
      uniform sampler2D tDiffuse;
      uniform float uVignetteIntensity;
      uniform float uChromaticAberration;
      varying vec2 vUv;

      void main() {
        vec2 uv = vUv;
        vec2 center = uv - 0.5;
        float dist = length(center);

        float r = texture2D(tDiffuse, uv + center * uChromaticAberration).r;
        float g = texture2D(tDiffuse, uv).g;
        float b = texture2D(tDiffuse, uv - center * uChromaticAberration).b;
        vec3 color = vec3(r, g, b);

        float vignette = 1.0 - dist * uVignetteIntensity;
        vignette = clamp(vignette, 0.0, 1.0);
        vignette = smoothstep(0.0, 1.0, vignette);
        color *= vignette;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    function buildLutVectors() {
      const lut = [];
      for (let n = 0; n < 256; n++) {
        lut.push(new THREE.Vector3(
          (MAGMA_LUT[n][0] * 255 - 49) / 206.0,
          (MAGMA_LUT[n][1] * 255 - 19) / 236.0,
          (MAGMA_LUT[n][2] * 255 - 50) / 190.0,
        ));
      }
      return lut;
    }

    function makeShaderUniforms() {
      return {
        vLut: { value: lutVectors },
        uHueShift: { value: 0.0 },
        uDynamicColor: { value: 0 },
      };
    }

    function initScene() {
      lutVectors = buildLutVectors();

      const xsegments = TIME_SAMPLES;
      const ysegments = FREQUENCY_SAMPLES;
      const xsize = 38.5;
      const ysize = 20;
      const xhalfSize = xsize / 2;
      const yhalfSize = ysize / 2;
      const xsegmentSize = xsize / xsegments;
      const ypowMax = Math.log(ysize);
      const ybase = Math.E;

      const indices = [];
      const heightsArr = [];
      const vertices = [];

      for (let i = 0; i <= xsegments; i++) {
        const x = (i * xsegmentSize) - xhalfSize;
        for (let j = 0; j <= ysegments; j++) {
          const powr = (ysegments - j) / ysegments * ypowMax;
          const y = -Math.pow(ybase, powr) + yhalfSize + 1;
          vertices.push(x, y, 0);
          heightsArr.push(0);
        }
      }

      for (let i = 0; i < xsegments; i++) {
        for (let j = 0; j < ysegments; j++) {
          const a = i * (ysegments + 1) + (j + 1);
          const b = i * (ysegments + 1) + j;
          const c = (i + 1) * (ysegments + 1) + j;
          const d = (i + 1) * (ysegments + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      geometry = new THREE.BufferGeometry();
      geometry.setIndex(indices);
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      dispAttr = new THREE.Uint8BufferAttribute(new Uint8Array(heightsArr), 1);
      geometry.setAttribute("displacement", dispAttr);
      geometry.computeVertexNormals();

      camera = new THREE.PerspectiveCamera(27, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.z = 64;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050510);

      const material = new THREE.ShaderMaterial({
        uniforms: makeShaderUniforms(),
        vertexShader: VERTEX_SHADER,
        fragmentShader: FRAGMENT_SHADER,
      });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      const wireframeMat = new THREE.ShaderMaterial({
        uniforms: makeShaderUniforms(),
        vertexShader: VERTEX_SHADER,
        fragmentShader: FRAGMENT_SHADER,
        wireframe: true,
        transparent: true,
        opacity: 0.35,
      });
      wireframeMesh = new THREE.Mesh(geometry, wireframeMat);
      wireframeMesh.visible = settings.wireframe;
      scene.add(wireframeMesh);

      const reflectionMat = new THREE.ShaderMaterial({
        uniforms: makeShaderUniforms(),
        vertexShader: VERTEX_SHADER,
        fragmentShader: REFLECTION_FRAGMENT_SHADER,
        transparent: true,
      });
      reflectionMesh = new THREE.Mesh(geometry, reflectionMat);
      reflectionMesh.scale.z = -1;
      reflectionMesh.position.z = -0.5;
      reflectionMesh.visible = settings.reflection;
      scene.add(reflectionMesh);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ReinhardToneMapping;
      renderer.toneMappingExposure = 1.0;
      $("stage").appendChild(renderer.domElement);

      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.5,
        0.4,
        0.85,
      );
      bloomPass.enabled = settings.bloom;
      composer.addPass(bloomPass);

      vignettePass = new ShaderPass({
        uniforms: {
          tDiffuse: { value: null },
          uVignetteIntensity: { value: 1.3 },
          uChromaticAberration: { value: 0.003 },
        },
        vertexShader: VIGNETTE_VERTEX,
        fragmentShader: VIGNETTE_FRAGMENT,
      });
      vignettePass.enabled = settings.vignette;
      composer.addPass(vignettePass);
    }

    function applyEffectChanges() {
      if (wireframeMesh) wireframeMesh.visible = settings.wireframe;
      if (reflectionMesh) reflectionMesh.visible = settings.reflection;
      if (bloomPass) {
        bloomPass.enabled = settings.bloom;
        bloomPass.strength = 1.5;
      }
      if (vignettePass) vignettePass.enabled = settings.vignette;
    }

    function syncHueUniforms(dynVal, hueVal) {
      mesh.material.uniforms.uDynamicColor.value = dynVal;
      mesh.material.uniforms.uHueShift.value = hueVal;
      if (settings.wireframe) {
        wireframeMesh.material.uniforms.uDynamicColor.value = dynVal;
        wireframeMesh.material.uniforms.uHueShift.value = hueVal;
      }
      if (settings.reflection) {
        reflectionMesh.material.uniforms.uDynamicColor.value = dynVal;
        reflectionMesh.material.uniforms.uHueShift.value = hueVal;
      }
    }

    function updateGeometry(externalData) {
      if (!externalData && !audio.hasAudio) return;

      scrollAccumulator += settings.scrollSpeed;
      if (scrollAccumulator < 1) return;
      const steps = Math.floor(scrollAccumulator);
      scrollAccumulator -= steps;

      const rawSrc = externalData || frequencyData;
      let src;
      if (settings.smoothing) {
        const smoothFactor = 0.35;
        for (let i = 0; i < rawSrc.length; i++) {
          prevData[i] = prevData[i] + (rawSrc[i] - prevData[i]) * smoothFactor;
          smoothedData[i] = Math.round(prevData[i]);
        }
        src = smoothedData;
      } else {
        src = rawSrc;
      }

      const buf = dispAttr.array;
      const startVal = FREQUENCY_SAMPLES + 1;
      const endVal = nVertices - startVal;

      for (let s = 0; s < steps; s++) {
        buf.copyWithin(0, startVal, nVertices + 1);
      }
      buf.set(src, endVal - startVal);
      dispAttr.needsUpdate = true;
    }

    function resetGeometry() {
      scrollAccumulator = 0;
      dispAttr.array.fill(0);
      prevData.fill(0);
      dispAttr.needsUpdate = true;
    }

    function renderVisual() {
      const dynVal = settings.colorShift ? 1 : 0;
      const hueVal = clock.getElapsedTime() * 0.05;
      syncHueUniforms(dynVal, hueVal);
      composer.render();
    }

    function tickFrame(externalFrequencyData = null) {
      if (externalFrequencyData) {
        frequencyData.set(externalFrequencyData.subarray(0, frequencyData.length));
        updateGeometry(frequencyData);
      } else {
        if (!capture.isExporting) audio.pullFrequencyData();
        if (audio.isPlaying || capture.isExporting) updateGeometry();
      }
      renderVisual();
    }

    const capture = createCaptureSession({
      width: EXPORT_WIDTH,
      height: EXPORT_HEIGHT,
      fps: EXPORT_FPS,
      getCanvas: () => renderer.domElement,
      getAudioTrack: () => audio.getRecordingAudioTrack(),
      saveViewport: () => ({
        width: window.innerWidth,
        height: window.innerHeight,
        pixelRatio: renderer.getPixelRatio(),
        aspect: camera.aspect,
      }),
      applyViewport: (width, height) => {
        renderer.setPixelRatio(1);
        renderer.setSize(width, height);
        composer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      },
      restoreViewport: (state) => {
        renderer.setPixelRatio(state.pixelRatio);
        renderer.setSize(state.width, state.height);
        composer.setSize(state.width, state.height);
        camera.aspect = state.aspect;
        camera.updateProjectionMatrix();
      },
      overlay: {
        root: $("exportOverlay"),
        status: $("exportStatus"),
        progress: $("exportProgressBar"),
        percent: $("exportPercent"),
        cancelBtn: $("exportCancelBtn"),
      },
    });

    const recorder = createRecorder({
      defaultFilename: "spectrogram_2d_1080p",
      videoBitsPerSecond: 8_000_000,
      onStatus: (message) => setStatus(message),
      onStart: () => {
        recordBtn.classList.add("recording");
        recordBtn.innerHTML = '■ <span class="action-label">Stop</span>';
        setStatus("Recording · " + (audio.fileName || "canvas"), true);
      },
      onStop: () => {
        recordBtn.classList.remove("recording");
        recordBtn.innerHTML = '<span class="record-dot"></span><span class="action-label">Record</span>';
        capture.onRecordingStopped();
        setStatus(audio.fileName ? "Recording saved · " + audio.fileName : "Recording saved");
      },
    });

    let fpsFrames = 0;
    let fpsElapsed = 0;
    let lastTickTime = performance.now();
    const glCtx = () => renderer.getContext();

    function animate() {
      requestAnimationFrame(animate);
      if (capture.isExporting) {
        clock.getDelta();
        return;
      }
      const now = performance.now();
      if (recorder.isRecording && capture.shouldSkipRecordingFrame(now, settings.lock60)) return;
      tickFrame();
      if (recorder.isRecording) {
        glCtx().finish();
        capture.requestRecordingFrame(now);
      }

      fpsElapsed += now - lastTickTime;
      lastTickTime = now;
      fpsFrames++;
      if (fpsElapsed >= 500) {
        fpsEl.textContent = Math.round(fpsFrames / (fpsElapsed / 1000)) + " fps";
        fpsFrames = 0;
        fpsElapsed = 0;
      }
    }

    function updatePlayPauseUI() {
      if (!audio.hasAudio) {
        playPauseBtn.disabled = true;
        playPauseBtn.innerHTML = '▶ <span class="action-label">Play</span>';
        playPauseBtn.title = "Play";
        return;
      }
      playPauseBtn.disabled = false;
      if (audio.isPlaying) {
        playPauseBtn.innerHTML = '⏸ <span class="action-label">Pause</span>';
        playPauseBtn.title = "Pause";
      } else {
        playPauseBtn.innerHTML = '▶ <span class="action-label">Play</span>';
        playPauseBtn.title = "Play";
      }
    }

    function setButtonsEnabled(enabled) {
      replayBtn.disabled = !enabled;
      unloadBtn.disabled = !enabled;
      recordBtn.disabled = !enabled;
      const exportSupported = Boolean(window.showSaveFilePicker && window.VideoEncoder && window.AudioEncoder);
      exportBtn.disabled = !enabled || !exportSupported;
      if (enabled && !exportSupported) exportBtn.title = "Offline export requires Chromium with WebCodecs";
      updatePlayPauseUI();
    }

    async function pausePlayback() {
      if (!audio.isPlaying) return;
      await audio.pause();
      updatePlayPauseUI();
      setStatus("Paused · " + audio.fileName);
    }

    async function resumePlayback() {
      if (audio.isPlaying) return;
      await audio.resume();
      updatePlayPauseUI();
      setStatus("Playing · " + audio.fileName, true);
    }

    function startPlayback(preparedRecording = null) {
      if (!audio.hasAudio || capture.isExporting) return;

      if (preparedRecording && !recorder.isRecording) {
        recorder.startAutoRecord(preparedRecording, () => capture.makeRecordingStream());
      }

      audio.play({
        onEnded: () => {
          updatePlayPauseUI();
          setStatus("Playback finished · " + audio.fileName);
          if (recorder.isRecording) recorder.stop();
        },
      });
      updatePlayPauseUI();
      setStatus("Playing · " + audio.fileName, true);
    }

    async function loadAudio(file, preparedRecording, exportWritable) {
      setStatus("Decoding · " + file.name);
      await audio.load(file);
      resetGeometry();
      setButtonsEnabled(true);

      if (exportWritable) {
        exportBtn.pendingWritable = exportWritable;
        exportBtn.click();
        return;
      }

      startPlayback(preparedRecording);
    }

    function unloadAudio() {
      if (capture.isExporting || recorder.isRecording) return;
      audio.unload();
      $("fileInput").value = "";
      resetGeometry();
      setButtonsEnabled(false);
      setStatus("Choose an audio file to begin");
    }

    async function exportVideo() {
      if (!audio.hasAudio || capture.isExporting || recorder.isRecording) return;

      const pendingWritable = exportBtn.pendingWritable || null;
      exportBtn.pendingWritable = null;

      await capture.runOfflineExport({
        audio,
        suggestedName: "spectrogram_2d_export.mp4",
        pendingWritable,
        onStatus: setStatus,
        labels: {
          rendering: "Rendering the spectrogram…",
          progress: "Exporting... frame {frame}/{total}",
          complete: "Export complete!",
          completeDelayMs: 1500,
          cancelled: "Export cancelled",
          saved: "Export saved · spectrogram_2d_export.mp4",
          failed: "Export failed: {message}",
          failedDelayMs: 3000,
        },
        prepare: () => {
          const saved = {
            scrollAccumulator,
            dispArray: new Uint8Array(dispAttr.array),
            prevData: new Float32Array(prevData),
          };
          scrollAccumulator = 0;
          dispAttr.array.fill(0);
          prevData.fill(0);
          dispAttr.needsUpdate = true;
          return saved;
        },
        restore: (saved) => {
          if (!saved) return;
          scrollAccumulator = saved.scrollAccumulator;
          dispAttr.array.set(saved.dispArray);
          prevData.set(saved.prevData);
          dispAttr.needsUpdate = true;
          updatePlayPauseUI();
        },
        renderFrame: (fftData) => {
          tickFrame(fftData);
        },
        readCanvas: () => renderer.domElement,
        gpuFinish: () => glCtx().finish(),
      });
    }

    $("scrollSpeed").addEventListener("input", (event) => {
      settings.scrollSpeed = parseFloat(event.target.value);
      $("scrollSpeedValue").textContent = settings.scrollSpeed.toFixed(1);
    });

    $("smoothing").addEventListener("change", (event) => {
      settings.smoothing = event.target.checked;
    });
    $("bloom").addEventListener("change", (event) => {
      settings.bloom = event.target.checked;
      applyEffectChanges();
    });
    $("colorShift").addEventListener("change", (event) => {
      settings.colorShift = event.target.checked;
    });
    $("wireframe").addEventListener("change", (event) => {
      settings.wireframe = event.target.checked;
      applyEffectChanges();
    });
    $("reflection").addEventListener("change", (event) => {
      settings.reflection = event.target.checked;
      applyEffectChanges();
    });
    $("vignette").addEventListener("change", (event) => {
      settings.vignette = event.target.checked;
      applyEffectChanges();
    });
    $("lock60").addEventListener("change", (event) => {
      settings.lock60 = event.target.checked;
    });

    $("autoRecord").addEventListener("change", (event) => {
      if (event.target.checked) $("autoExport").checked = false;
    });
    $("autoExport").addEventListener("change", (event) => {
      if (event.target.checked) $("autoRecord").checked = false;
    });

    $("panelToggle").addEventListener("click", () => {
      const hidden = $("panel").classList.toggle("hidden");
      $("panelToggle").classList.toggle("closed", hidden);
      $("panelToggle").textContent = hidden ? "☰" : "×";
      $("panelToggle").title = hidden ? "Show settings" : "Hide settings";
      $("panelToggle").setAttribute("aria-label", hidden ? "Show settings" : "Hide settings");
    });

    $("fileInput").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      let preparedRecording = null;
      let exportWritable = null;

      if ($("autoRecord").checked) {
        preparedRecording = await recorder.prepareAutoRecord();
        if (!preparedRecording) {
          event.target.value = "";
          return;
        }
      }

      if ($("autoExport").checked) {
        if (capture.isExporting) return;
        exportWritable = await capture.pickWritable("spectrogram_2d_export.mp4");
        if (!exportWritable) {
          event.target.value = "";
          return;
        }
      }

      try {
        await loadAudio(file, preparedRecording, exportWritable);
      } catch (error) {
        console.error(error);
        setStatus("Could not load audio · " + error.message);
        event.target.value = "";
      }
    });

    recordBtn.addEventListener("click", () => {
      if (!audio.hasAudio || capture.isExporting) return;
      if (audio.isPaused) resumePlayback();
      recorder.toggle(() => capture.makeRecordingStream());
    });

    exportBtn.addEventListener("click", exportVideo);

    playPauseBtn.addEventListener("click", async () => {
      if (capture.isExporting) return;
      if (audio.isPlaying) {
        await pausePlayback();
      } else if (audio.isPaused) {
        await resumePlayback();
      } else {
        await audio.resumeContext();
        startPlayback();
      }
    });

    replayBtn.addEventListener("click", async () => {
      if (!audio.hasAudio || capture.isExporting || recorder.isRecording) return;
      await audio.resumeContext();
      resetGeometry();
      startPlayback();
    });

    unloadBtn.addEventListener("click", unloadAudio);

    $("fullscreenBtn").addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    window.addEventListener("resize", () => {
      if (capture.isExporting || recorder.isRecording) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    try {
      initScene();
      setButtonsEnabled(false);
      animate();
    } catch (error) {
      console.error(error);
      $("fatal").style.display = "flex";
      $("fatal").textContent = "WebGL failed to start · " + error.message;
    }
  </script>
</body>
</html>
