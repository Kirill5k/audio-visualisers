<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Spectrogram</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020305;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }

    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }

    #togglePanel.shifted {
      left: 290px;
    }

    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .top-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .top-btn.recording {
      background: rgba(200,0,0,0.7);
      border-color: rgba(255,100,100,0.5);
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<button id="togglePanel" class="shifted">☰ Hide Panel</button>

<div class="top-right-buttons">
  <button id="recordBtn" class="top-btn">⏺ Record</button>
  <button id="fullscreenBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <!-- Movement -->
  <div class="section-label">Movement</div>

  <label>
    Scroll Speed: <span id="speedLabel">0.8</span>
  </label>
  <input
    type="range"
    id="speedSlider"
    min="0.2"
    max="4"
    step="0.1"
    value="0.8"
  />

  <div class="checkbox-row">
    <input type="checkbox" id="rotateToggle" checked />
    <span>Rotate</span>
  </div>

  <label>
    Rotation Speed: <span id="rotSpeedLabel">0.02</span>
  </label>
  <input
    type="range"
    id="rotSpeedSlider"
    min="0"
    max="0.3"
    step="0.01"
    value="0.02"
  />

  <!-- Camera -->
  <div class="section-label">Camera</div>

  <div class="checkbox-row">
    <input type="checkbox" id="lowAngleToggle" />
    <span>Low Angle</span>
  </div>

  <!-- Color Gradient Section -->
  <div class="section-label">Color Gradient</div>

  <div class="color-row">
    <input type="color" id="colorLow" value="#000033" />
    <span>Low (quiet)</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorMid" value="#39a7c0" />
    <span>Mid</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorHigh" value="#d6eae8" />
    <span>High (loud)</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="hueShiftToggle" checked />
    <span>Hue Shift Over Time</span>
  </div>

  <!-- Rendering -->
  <div class="section-label">Rendering</div>

  <label>
    Wireframe Width: <span id="wireWidthLabel">0.5</span>
  </label>
  <input
    type="range"
    id="wireWidthSlider"
    min="0.5"
    max="5"
    step="0.5"
    value="0.5"
  />

  <!-- Effects -->
  <div class="section-label">Effects</div>

  <div class="checkbox-row">
    <input type="checkbox" id="filmGrainToggle" />
    <span>Film Grain</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="emissiveGlowToggle" checked />
    <span>Emissive Glow</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from 'three';

// =====================================================
// Scene
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020305);
scene.fog = new THREE.Fog(0x020305, 30, 160);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const CAM_HIGH = { x: 0, y: 32, z: -80 };
const CAM_LOW  = { x: 0, y: 12, z: -70 };
let lowAngle = false;

// #6: Smooth Camera Transition
const targetCamPos = new THREE.Vector3(CAM_HIGH.x, CAM_HIGH.y, CAM_HIGH.z);
camera.position.copy(targetCamPos);
camera.lookAt(0, 0, 0);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();
const analyser = audioContext.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);
let audioDestNode = null;

// =====================================================
// Settings (Restored 1:1 fidelity)
// =====================================================

const FFT_BINS = analyser.frequencyBinCount; // 1024
const HISTORY = 400;
const LOW_BIN_SKIP = 10;

let scrollSpeed = 0.8;
let rotationEnabled = true;
let rotationSpeed = 0.02;
let audioStarted = false;

let colorLow  = new THREE.Color(0x000020);
let colorMid  = new THREE.Color(0x39a7c0);
let colorHigh = new THREE.Color(0xd6eae8);

let hueShiftEnabled = true;
let hueShiftOffset = 0;
let lastHueUpdateOffset = -1;

let wireframeWidth = 0.5;
let filmGrainEnabled = false;
let emissiveGlowEnabled = true;

// =====================================================
// Memory & LUT
// =====================================================

const COLOR_LUT_SIZE = 256;
const colorLUTData = new Uint8Array(COLOR_LUT_SIZE * 4);

const shiftedLow = new THREE.Color();
const shiftedMid = new THREE.Color();
const shiftedHigh = new THREE.Color();
const tmpColor = new THREE.Color();
const tempHSL = { h: 0, s: 0, l: 0 }; 

function rebuildColorLUT() {
  for (let i = 0; i < COLOR_LUT_SIZE; i++) {
    const t = i / (COLOR_LUT_SIZE - 1);
    if (t <= 0.5) {
      tmpColor.lerpColors(shiftedLow, shiftedMid, t * 2);
    } else {
      tmpColor.lerpColors(shiftedMid, shiftedHigh, (t - 0.5) * 2);
    }
    colorLUTData[i * 4]     = Math.round(tmpColor.r * 255);
    colorLUTData[i * 4 + 1] = Math.round(tmpColor.g * 255);
    colorLUTData[i * 4 + 2] = Math.round(tmpColor.b * 255);
    colorLUTData[i * 4 + 3] = 255;
  }
}

function updateShiftedColors() {
  shiftedLow.copy(colorLow);
  shiftedMid.copy(colorMid);
  shiftedHigh.copy(colorHigh);
  if (hueShiftEnabled && hueShiftOffset > 0) {
    shiftedLow.getHSL(tempHSL);
    shiftedLow.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
    shiftedMid.getHSL(tempHSL);
    shiftedMid.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
    shiftedHigh.getHSL(tempHSL);
    shiftedHigh.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
  }
  rebuildColorLUT();
}
updateShiftedColors();

// #1: Data Texture (Direct RedFormat for zero CPU loops)
const dataTextureArray = new Uint8Array(FFT_BINS * HISTORY);
const dataTexture = new THREE.DataTexture(
  dataTextureArray,
  FFT_BINS,
  HISTORY,
  THREE.RedFormat,
  THREE.UnsignedByteType
);
dataTexture.minFilter = THREE.NearestFilter;
dataTexture.magFilter = THREE.NearestFilter;
dataTexture.needsUpdate = true;

const colorLUTTexture = new THREE.DataTexture(
  colorLUTData, COLOR_LUT_SIZE, 1, THREE.RGBAFormat, THREE.UnsignedByteType
);
colorLUTTexture.minFilter = THREE.LinearFilter;
colorLUTTexture.magFilter = THREE.LinearFilter;
colorLUTTexture.needsUpdate = true;

function updateColorLUTTexture() {
  colorLUTTexture.image.data.set(colorLUTData);
  colorLUTTexture.needsUpdate = true;
}

let historyHead = 0;

// =====================================================
// Shader
// =====================================================

const spectrogramMaterial = new THREE.ShaderMaterial({
  wireframe: true,
  transparent: true,
  uniforms: {
    uDataTexture: { value: dataTexture },
    uColorLUT: { value: colorLUTTexture },
    uHistoryHead: { value: 0.0 },
    uHistorySize: { value: HISTORY },
    uHeightScale: { value: 22.0 },
    uEmissiveGlow: { value: 1.0 },
    uFogColor: { value: new THREE.Color(0x020305) },
    uFogNear: { value: 30.0 },
    uFogFar: { value: 160.0 },
    uTime: { value: 0.0 },
    uFilmGrain: { value: 0.0 },
    uLowBinSkip: { value: LOW_BIN_SKIP / FFT_BINS }
  },
  vertexShader: `
    uniform sampler2D uDataTexture;
    uniform sampler2D uColorLUT;
    uniform float uHistoryHead;
    uniform float uHistorySize;
    uniform float uHeightScale;
    uniform float uEmissiveGlow;
    uniform float uLowBinSkip;

    varying vec3 vColor;
    varying float vFogDepth;
    varying vec2 vUv;

    void main() {
      vUv = uv;
      vec2 gridUV = uv;

      float usableRange = 1.0 - uLowBinSkip;
      float logX = uLowBinSkip + pow(gridUV.x, 2.2) * usableRange;

      float row = gridUV.y * (uHistorySize - 1.0);
      float texRow = mod(uHistoryHead - 1.0 - row + uHistorySize, uHistorySize);
      float texV = (texRow + 0.5) / uHistorySize;
      
      float amplitude = texture2D(uDataTexture, vec2(logX, texV)).r;
      float height = pow(amplitude, 1.7) * uHeightScale;

      vec3 displaced = position;
      displaced.y = height;

      vec3 baseColor = texture2D(uColorLUT, vec2(amplitude, 0.5)).rgb;
      float glow = pow(amplitude, 2.5) * uEmissiveGlow;
      vColor = baseColor + baseColor * glow;

      vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
      vFogDepth = -mvPosition.z;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform vec3 uFogColor;
    uniform float uFogNear;
    uniform float uFogFar;
    uniform float uTime;
    uniform float uFilmGrain;

    varying vec3 vColor;
    varying float vFogDepth;
    varying vec2 vUv;

    float noise(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
      float fogFactor = smoothstep(uFogNear, uFogFar, vFogDepth);
      vec3 color = mix(vColor, uFogColor, fogFactor);
      if (uFilmGrain > 0.0) {
        float grain = noise(vUv * 10.0 + uTime) - 0.5;
        color += grain * 0.08 * uFilmGrain;
      }
      gl_FragColor = vec4(color, 0.95);
    }
  `
});

// =====================================================
// Geometry (Restored 1:1)
// =====================================================

const geometry = new THREE.PlaneGeometry(110, 160, FFT_BINS - 1, HISTORY - 1);
geometry.rotateX(-Math.PI / 2);
const mesh = new THREE.Mesh(geometry, spectrogramMaterial);
scene.add(mesh);

function pushNewRow() {
  const offset = historyHead * FFT_BINS;
  dataTextureArray.set(frequencyData, offset);

  const gl = renderer.getContext();
  const texProps = renderer.properties.get(dataTexture);

  if (texProps.__webglTexture) {
    const activeTexture = gl.getParameter(gl.TEXTURE_BINDING_2D);
    gl.bindTexture(gl.TEXTURE_2D, texProps.__webglTexture);
    gl.texSubImage2D(
      gl.TEXTURE_2D, 0, 0, historyHead, FFT_BINS, 1,
      gl.RED, gl.UNSIGNED_BYTE, frequencyData
    );
    gl.bindTexture(gl.TEXTURE_2D, activeTexture);
  } else {
    dataTexture.needsUpdate = true;
  }

  historyHead = (historyHead + 1) % HISTORY;
  spectrogramMaterial.uniforms.uHistoryHead.value = historyHead;
}

// =====================================================
// Recording
// =====================================================

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let preRecordWidth = 0;
let preRecordHeight = 0;
let preRecordPixelRatio = 1;

function startRecording() {
  recreateRenderer(true);

  preRecordWidth = window.innerWidth;
  preRecordHeight = window.innerHeight;
  preRecordPixelRatio = renderer.getPixelRatio();

  // Force 1080p for recording
  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();

  const canvas = renderer.domElement;
  const videoStream = canvas.captureStream(60);

  // Capture Audio
  const audioStreamDest = audioContext.createMediaStreamDestination();
  audioDestNode = audioStreamDest;
  analyser.connect(audioStreamDest);

  const audioTrack = audioStreamDest.stream.getAudioTracks()[0];
  if (audioTrack) {
    videoStream.addTrack(audioTrack);
  }

  recordedChunks = [];
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
    ? 'video/webm;codecs=vp9,opus'
    : MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
    ? 'video/webm;codecs=vp8,opus'
    : 'video/webm';

  mediaRecorder = new MediaRecorder(videoStream, {
    mimeType: mimeType,
    videoBitsPerSecond: 16000000
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spectrogram_1080p.webm';
    a.click();
    URL.revokeObjectURL(url);

    try { analyser.disconnect(audioDestNode); } catch(e) {}
    audioDestNode = null;

    recreateRenderer(false);
    renderer.setPixelRatio(preRecordPixelRatio);
    renderer.setSize(preRecordWidth, preRecordHeight);
    camera.aspect = preRecordWidth / preRecordHeight;
    camera.updateProjectionMatrix();
  };

  mediaRecorder.start(100);
  isRecording = true;
  const btn = document.getElementById('recordBtn');
  btn.textContent = '⏹ Stop';
  btn.classList.add('recording');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  const btn = document.getElementById('recordBtn');
  btn.textContent = '⏺ Record';
  btn.classList.remove('recording');
}

// =====================================================
// UI & Animation
// =====================================================

function recreateRenderer(preserveBuffer) {
  const oldCanvas = renderer.domElement;
  const parent = oldCanvas.parentElement;
  renderer.dispose();
  parent.removeChild(oldCanvas);
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: preserveBuffer });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  parent.appendChild(renderer.domElement);
  dataTexture.needsUpdate = true;
  colorLUTTexture.needsUpdate = true;
}

document.getElementById('recordBtn').addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});

const clock = new THREE.Clock();
let accumulator = 0;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  spectrogramMaterial.uniforms.uTime.value += delta;
  analyser.getByteFrequencyData(frequencyData);

  if (hueShiftEnabled) {
    hueShiftOffset += delta * 0.03;
    if (hueShiftOffset > 1) hueShiftOffset -= 1;
    if (Math.abs(hueShiftOffset - lastHueUpdateOffset) > 0.001) {
      lastHueUpdateOffset = hueShiftOffset;
      updateShiftedColors();
      updateColorLUTTexture();
    }
  }

  accumulator += delta * scrollSpeed * 60;
  if (accumulator >= 1) {
    accumulator = 0;
    pushNewRow();
  }
  if (rotationEnabled && audioStarted) {
    mesh.rotation.y += delta * rotationSpeed;
  }

  // Smooth camera transition
  camera.position.lerp(targetCamPos, 0.001);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

// UI Listeners
document.getElementById('togglePanel').addEventListener('click', (e) => {
  const ui = document.getElementById('ui');
  const btn = e.target;
  if (ui.classList.contains('hidden')) {
    ui.classList.remove('hidden');
    btn.classList.add('shifted');
    btn.textContent = '☰ Hide Panel';
  } else {
    ui.classList.add('hidden');
    btn.classList.remove('shifted');
    btn.textContent = '☰ Show Panel';
  }
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.getElementById('speedSlider').addEventListener('input', (e) => {
  scrollSpeed = parseFloat(e.target.value);
  document.getElementById('speedLabel').textContent = scrollSpeed.toFixed(1);
});

document.getElementById('rotateToggle').addEventListener('change', (e) => rotationEnabled = e.target.checked);

document.getElementById('rotSpeedSlider').addEventListener('input', (e) => {
  rotationSpeed = parseFloat(e.target.value);
  document.getElementById('rotSpeedLabel').textContent = rotationSpeed.toFixed(2);
});

document.getElementById('lowAngleToggle').addEventListener('change', (e) => {
  lowAngle = e.target.checked;
  const cam = lowAngle ? CAM_LOW : CAM_HIGH;
  targetCamPos.set(cam.x, cam.y, cam.z);
});

document.getElementById('colorLow').addEventListener('input', (e) => {
  colorLow.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorMid').addEventListener('input', (e) => {
  colorMid.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorHigh').addEventListener('input', (e) => {
  colorHigh.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});

document.getElementById('hueShiftToggle').addEventListener('change', (e) => {
  hueShiftEnabled = e.target.checked;
  if (!hueShiftEnabled) {
    hueShiftOffset = 0;
    updateShiftedColors();
    updateColorLUTTexture();
  }
});

document.getElementById('wireWidthSlider').addEventListener('input', (e) => {
  wireframeWidth = parseFloat(e.target.value);
  document.getElementById('wireWidthLabel').textContent = wireframeWidth.toFixed(1);
});

document.getElementById('filmGrainToggle').addEventListener('change', (e) => {
  filmGrainEnabled = e.target.checked;
  spectrogramMaterial.uniforms.uFilmGrain.value = filmGrainEnabled ? 1.0 : 0.0;
});

document.getElementById('emissiveGlowToggle').addEventListener('change', (e) => {
  emissiveGlowEnabled = e.target.checked;
  spectrogramMaterial.uniforms.uEmissiveGlow.value = emissiveGlowEnabled ? 1.0 : 0.0;
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  await audioContext.resume();
  const buffer = await audioContext.decodeAudioData(await file.arrayBuffer());
  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(analyser);
  analyser.connect(audioContext.destination);
  source.start();
  audioStarted = true;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
