<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Spectrogram</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020305;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }

    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }

    #togglePanel.shifted {
      left: 290px;
    }

    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .top-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .top-btn.recording {
      background: rgba(200,0,0,0.7);
      border-color: rgba(255,100,100,0.5);
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<button id="togglePanel" class="shifted">☰ Hide Panel</button>

<div class="top-right-buttons">
  <button id="recordBtn" class="top-btn">⏺ Record</button>
  <button id="fullscreenBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <!-- Movement -->
  <div class="section-label">Movement</div>

  <label>
    Scroll Speed: <span id="speedLabel">0.8</span>
  </label>
  <input
    type="range"
    id="speedSlider"
    min="0.2"
    max="4"
    step="0.1"
    value="0.8"
  />

  <div class="checkbox-row">
    <input type="checkbox" id="rotateToggle" checked />
    <span>Rotate</span>
  </div>

  <label>
    Rotation Speed: <span id="rotSpeedLabel">0.02</span>
  </label>
  <input
    type="range"
    id="rotSpeedSlider"
    min="0"
    max="0.3"
    step="0.01"
    value="0.02"
  />

  <!-- Camera -->
  <div class="section-label">Camera</div>

  <div class="checkbox-row">
    <input type="checkbox" id="lowAngleToggle" />
    <span>Low Angle</span>
  </div>

  <!-- Color Gradient Section -->
  <div class="section-label">Color Gradient</div>

  <div class="color-row">
    <input type="color" id="colorLow" value="#000033" />
    <span>Low (quiet)</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorMid" value="#39a7c0" />
    <span>Mid</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorHigh" value="#d6eae8" />
    <span>High (loud)</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="hueShiftToggle" checked />
    <span>Hue Shift Over Time</span>
  </div>

  <!-- Rendering -->
  <div class="section-label">Rendering</div>

  <label>
    Wireframe Width: <span id="wireWidthLabel">0.5</span>
  </label>
  <input
    type="range"
    id="wireWidthSlider"
    min="0.5"
    max="5"
    step="0.5"
    value="0.5"
  />

  <!-- Effects -->
  <div class="section-label">Effects</div>

  <div class="checkbox-row">
    <input type="checkbox" id="filmGrainToggle" />
    <span>Film Grain</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="emissiveGlowToggle" checked />
    <span>Emissive Glow</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';

// =====================================================
// Scene
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020305);
scene.fog = new THREE.Fog(0x020305, 30, 160);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

// Camera positions — matching the working version
const CAM_HIGH = { x: 0, y: 32, z: -80 };
const CAM_LOW  = { x: 0, y: 12, z: -70 };
let lowAngle = false;

camera.position.set(CAM_HIGH.x, CAM_HIGH.y, CAM_HIGH.z);
camera.lookAt(0, 0, 0);

// #6: Create renderer WITHOUT preserveDrawingBuffer initially
let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// =====================================================
// Postprocessing
// =====================================================

let composer = new EffectComposer(renderer);
let renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

let filmPass = new FilmPass(0.35);
filmPass.enabled = false;
composer.addPass(filmPass);

// =====================================================
// Lights
// =====================================================

scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();

const analyser = audioContext.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);

let audioDestNode = null;

// =====================================================
// Spectrogram Settings
// =====================================================

const FFT_BINS = analyser.frequencyBinCount; // 1024
const HISTORY = 500;
const LOW_BIN_SKIP = 10;

let scrollSpeed = 0.8;
let rotationEnabled = true;
let rotationSpeed = 0.02;
let audioStarted = false;

// Gradient colors
let colorLow  = new THREE.Color(0x000020);
let colorMid  = new THREE.Color(0x39a7c0);
let colorHigh = new THREE.Color(0xd6eae8);

// Hue shift
let hueShiftEnabled = true;
let hueShiftOffset = 0;
let lastHueUpdateOffset = -1;

// Rendering options
let wireframeWidth = 0.5;
let filmGrainEnabled = false;
let emissiveGlowEnabled = true;

// =====================================================
// #3: Pre-compute Color LUT (256 entries, RGBA for compatibility)
// =====================================================

const COLOR_LUT_SIZE = 256;
const colorLUTData = new Uint8Array(COLOR_LUT_SIZE * 4); // RGBA

const shiftedLow = new THREE.Color();
const shiftedMid = new THREE.Color();
const shiftedHigh = new THREE.Color();
const tmpColor = new THREE.Color();

function rebuildColorLUT() {
  for (let i = 0; i < COLOR_LUT_SIZE; i++) {
    const t = i / (COLOR_LUT_SIZE - 1);
    if (t <= 0.5) {
      tmpColor.lerpColors(shiftedLow, shiftedMid, t * 2);
    } else {
      tmpColor.lerpColors(shiftedMid, shiftedHigh, (t - 0.5) * 2);
    }
    colorLUTData[i * 4]     = Math.round(tmpColor.r * 255);
    colorLUTData[i * 4 + 1] = Math.round(tmpColor.g * 255);
    colorLUTData[i * 4 + 2] = Math.round(tmpColor.b * 255);
    colorLUTData[i * 4 + 3] = 255;
  }
}

function updateShiftedColors() {
  shiftedLow.copy(colorLow);
  shiftedMid.copy(colorMid);
  shiftedHigh.copy(colorHigh);

  if (hueShiftEnabled && hueShiftOffset > 0) {
    const hsl = {};
    shiftedLow.getHSL(hsl);
    shiftedLow.setHSL((hsl.h + hueShiftOffset) % 1, hsl.s, hsl.l);
    shiftedMid.getHSL(hsl);
    shiftedMid.setHSL((hsl.h + hueShiftOffset) % 1, hsl.s, hsl.l);
    shiftedHigh.getHSL(hsl);
    shiftedHigh.setHSL((hsl.h + hueShiftOffset) % 1, hsl.s, hsl.l);
  }

  rebuildColorLUT();
}

// Initial build
updateShiftedColors();

// =====================================================
// Pre-built log index lookup table
// =====================================================

const logIndexTable = new Uint16Array(FFT_BINS);
for (let i = 0; i < FFT_BINS; i++) {
  const normalized = i / FFT_BINS;
  const usableRange = FFT_BINS - 1 - LOW_BIN_SKIP;
  logIndexTable[i] = LOW_BIN_SKIP + Math.floor(Math.pow(normalized, 2.2) * usableRange);
}

// =====================================================
// #2: Data Texture (frequency history) — RGBA format for compatibility
// =====================================================

// Store amplitude in R channel, use RGBA format for broad WebGL support
const dataTextureArray = new Uint8Array(FFT_BINS * HISTORY * 4);
const dataTexture = new THREE.DataTexture(
  dataTextureArray,
  FFT_BINS,
  HISTORY,
  THREE.RGBAFormat,
  THREE.UnsignedByteType
);
dataTexture.minFilter = THREE.NearestFilter;
dataTexture.magFilter = THREE.NearestFilter;
dataTexture.needsUpdate = true;

// Color LUT texture: 256 x 1, RGBA
const colorLUTTexture = new THREE.DataTexture(
  colorLUTData,
  COLOR_LUT_SIZE,
  1,
  THREE.RGBAFormat,
  THREE.UnsignedByteType
);
colorLUTTexture.minFilter = THREE.LinearFilter;
colorLUTTexture.magFilter = THREE.LinearFilter;
colorLUTTexture.needsUpdate = true;

function updateColorLUTTexture() {
  colorLUTTexture.image.data.set(colorLUTData);
  colorLUTTexture.needsUpdate = true;
}

// Ring buffer head
let historyHead = 0;

// =====================================================
// Custom ShaderMaterial
// =====================================================

const spectrogramMaterial = new THREE.ShaderMaterial({
  wireframe: true,
  transparent: true,
  uniforms: {
    uDataTexture: { value: dataTexture },
    uColorLUT: { value: colorLUTTexture },
    uHistoryHead: { value: 0.0 },
    uHistorySize: { value: HISTORY },
    uHeightScale: { value: 22.0 },
    uEmissiveGlow: { value: 1.0 },
    uFogColor: { value: new THREE.Color(0x020305) },
    uFogNear: { value: 30.0 },
    uFogFar: { value: 160.0 },
  },
  vertexShader: `
    uniform sampler2D uDataTexture;
    uniform sampler2D uColorLUT;
    uniform float uHistoryHead;
    uniform float uHistorySize;
    uniform float uHeightScale;
    uniform float uEmissiveGlow;

    varying vec3 vColor;
    varying float vFogDepth;

    void main() {
      vec2 gridUV = uv;

      // gridUV.x = frequency position (0..1)
      // gridUV.y = row position in geometry (0..1)
      // After rotateX(-PI/2), UV.y corresponds to the Z axis (depth/time)

      // Map geometry row to the ring buffer position
      // UV.y=0 is the "front" of the geometry (closest to negative Z),
      // UV.y=1 is the "back"
      // We want UV.y=0 to show the NEWEST data (historyHead - 1)
      // and UV.y=1 to show the OLDEST data

      float row = gridUV.y * (uHistorySize - 1.0);
      float texRow = mod(uHistoryHead - 1.0 - row + uHistorySize, uHistorySize);
      float texV = (texRow + 0.5) / uHistorySize;
      float texU = gridUV.x;

      // Sample amplitude from data texture (stored in R channel)
      float amplitude = texture2D(uDataTexture, vec2(texU, texV)).r;

      // Compute height: pow(amplitude, 1.7) * heightScale
      float height = pow(amplitude, 1.7) * uHeightScale;

      // Displace Y position
      vec3 displaced = position;
      displaced.y = height;

      // Sample color from LUT using amplitude
      vec3 baseColor = texture2D(uColorLUT, vec2(amplitude, 0.5)).rgb;

      // Emissive glow on peaks
      float glow = pow(amplitude, 2.5) * uEmissiveGlow;
      vColor = baseColor + baseColor * glow;

      vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
      vFogDepth = -mvPosition.z;

      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor;
    uniform float uFogNear;
    uniform float uFogFar;

    varying vec3 vColor;
    varying float vFogDepth;

    void main() {
      // Apply fog
      float fogFactor = smoothstep(uFogNear, uFogFar, vFogDepth);
      vec3 color = mix(vColor, uFogColor, fogFactor);

      gl_FragColor = vec4(color, 0.95);
    }
  `
});

// =====================================================
// Geometry
// =====================================================

const geometry = new THREE.PlaneGeometry(
  110,
  160,
  FFT_BINS - 1,
  HISTORY - 1
);
geometry.rotateX(-Math.PI / 2);

const mesh = new THREE.Mesh(geometry, spectrogramMaterial);
scene.add(mesh);

// =====================================================
// #4: Line Segments — persistent with in-place updates
// =====================================================

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  linewidth: wireframeWidth
});

let lineSegments = null;
let useLineSegments = false;

function buildLineSegments() {
  if (lineSegments) {
    scene.remove(lineSegments);
    lineSegments.geometry.dispose();
  }
  const wireGeo = new THREE.WireframeGeometry(geometry);
  wireGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);

  const posCount = wireGeo.attributes.position.count;
  const colorArr = new Float32Array(posCount * 3);
  wireGeo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
  wireGeo.attributes.color.setUsage(THREE.DynamicDrawUsage);

  lineSegments = new THREE.LineSegments(wireGeo, lineMat);
  lineSegments.rotation.y = mesh.rotation.y;
  lineSegments.visible = useLineSegments;
  scene.add(lineSegments);
}

function updateLineSegmentsInPlace() {
  if (!lineSegments || !useLineSegments) return;

  // Rebuild wireframe positions from current geometry state
  // Since shader displaces on GPU, we need to compute positions on CPU for lines
  // This is the tradeoff when using thick lines
  const newWire = new THREE.WireframeGeometry(geometry);
  const srcArr = newWire.attributes.position.array;
  const dstArr = lineSegments.geometry.attributes.position.array;

  if (srcArr.length === dstArr.length) {
    dstArr.set(srcArr);
    lineSegments.geometry.attributes.position.needsUpdate = true;
  }
  newWire.dispose();
}

// =====================================================
// #1: Ring buffer — single row update
// =====================================================

const rowBuffer = new Uint8Array(FFT_BINS * 4); // RGBA per pixel

function pushNewRow() {
  // Fill row buffer from frequency data
  for (let i = 0; i < FFT_BINS; i++) {
    const val = frequencyData[logIndexTable[i]];
    rowBuffer[i * 4]     = val;   // R = amplitude
    rowBuffer[i * 4 + 1] = 0;    // G
    rowBuffer[i * 4 + 2] = 0;    // B
    rowBuffer[i * 4 + 3] = 255;  // A
  }

  // Write into flat array
  const offset = historyHead * FFT_BINS * 4;
  dataTextureArray.set(rowBuffer, offset);

  // Partial GPU upload via texSubImage2D
  const gl = renderer.getContext();
  const texProps = renderer.properties.get(dataTexture);

  if (texProps.__webglTexture) {
    const activeTexture = gl.getParameter(gl.TEXTURE_BINDING_2D);
    gl.bindTexture(gl.TEXTURE_2D, texProps.__webglTexture);
    gl.texSubImage2D(
      gl.TEXTURE_2D,
      0,
      0,
      historyHead,
      FFT_BINS,
      1,
      gl.RGBA,
      gl.UNSIGNED_BYTE,
      rowBuffer
    );
    // Restore previous binding
    gl.bindTexture(gl.TEXTURE_2D, activeTexture);
  } else {
    // First frame fallback
    dataTexture.needsUpdate = true;
  }

  // Advance ring buffer
  historyHead = (historyHead + 1) % HISTORY;

  // Update uniform
  spectrogramMaterial.uniforms.uHistoryHead.value = historyHead;
}

// =====================================================
// #6 & #8: Recording
// =====================================================

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let preRecordWidth = 0;
let preRecordHeight = 0;
let preRecordPixelRatio = 1;

function recreateRenderer(preserveBuffer) {
  const oldCanvas = renderer.domElement;
  const parent = oldCanvas.parentElement;

  renderer.dispose();
  parent.removeChild(oldCanvas);

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    preserveDrawingBuffer: preserveBuffer
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  parent.appendChild(renderer.domElement);

  // Rebuild composer
  composer.dispose();
  renderPass = new RenderPass(scene, camera);
  filmPass = new FilmPass(0.35);
  filmPass.enabled = filmGrainEnabled;

  composer = new EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(filmPass);

  // Force texture re-upload
  dataTexture.needsUpdate = true;
  colorLUTTexture.needsUpdate = true;
}

function startRecording() {
  recreateRenderer(true);

  preRecordWidth = window.innerWidth;
  preRecordHeight = window.innerHeight;
  preRecordPixelRatio = renderer.getPixelRatio();

  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080);
  composer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();

  const canvas = renderer.domElement;
  const videoStream = canvas.captureStream(60);

  // #8: Record audio
  const audioStreamDest = audioContext.createMediaStreamDestination();
  audioDestNode = audioStreamDest;
  analyser.connect(audioStreamDest);

  const audioTrack = audioStreamDest.stream.getAudioTracks()[0];
  if (audioTrack) {
    videoStream.addTrack(audioTrack);
  }

  recordedChunks = [];

  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
    ? 'video/webm;codecs=vp9,opus'
    : MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
    ? 'video/webm;codecs=vp8,opus'
    : 'video/webm';

  mediaRecorder = new MediaRecorder(videoStream, {
    mimeType: mimeType,
    videoBitsPerSecond: 16000000
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spectrogram_1080p60.webm';
    a.click();
    URL.revokeObjectURL(url);

    try { analyser.disconnect(audioDestNode); } catch(e) {}
    audioDestNode = null;

    recreateRenderer(false);
    renderer.setPixelRatio(preRecordPixelRatio);
    renderer.setSize(preRecordWidth, preRecordHeight);
    composer.setSize(preRecordWidth, preRecordHeight);
    camera.aspect = preRecordWidth / preRecordHeight;
    camera.updateProjectionMatrix();
  };

  mediaRecorder.start(100);
  isRecording = true;

  const btn = document.getElementById('recordBtn');
  btn.textContent = '⏹ Stop';
  btn.classList.add('recording');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;

  const btn = document.getElementById('recordBtn');
  btn.textContent = '⏺ Record';
  btn.classList.remove('recording');
}

// =====================================================
// UI
// =====================================================

const toggleBtn = document.getElementById('togglePanel');
const uiPanel = document.getElementById('ui');
let panelVisible = true;

toggleBtn.addEventListener('click', () => {
  panelVisible = !panelVisible;
  if (panelVisible) {
    uiPanel.classList.remove('hidden');
    toggleBtn.classList.add('shifted');
    toggleBtn.textContent = '☰ Hide Panel';
  } else {
    uiPanel.classList.add('hidden');
    toggleBtn.classList.remove('shifted');
    toggleBtn.textContent = '☰ Show Panel';
  }
});

document.getElementById('recordBtn').addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fullscreenBtn');
  btn.textContent = document.fullscreenElement ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
});

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
speedSlider.addEventListener('input', (e) => {
  scrollSpeed = parseFloat(e.target.value);
  speedLabel.textContent = scrollSpeed.toFixed(1);
});

document.getElementById('rotateToggle').addEventListener('change', (e) => {
  rotationEnabled = e.target.checked;
});

const rotSpeedSlider = document.getElementById('rotSpeedSlider');
const rotSpeedLabel = document.getElementById('rotSpeedLabel');
rotSpeedSlider.addEventListener('input', (e) => {
  rotationSpeed = parseFloat(e.target.value);
  rotSpeedLabel.textContent = rotationSpeed.toFixed(2);
});

document.getElementById('lowAngleToggle').addEventListener('change', (e) => {
  lowAngle = e.target.checked;
  const cam = lowAngle ? CAM_LOW : CAM_HIGH;
  camera.position.set(cam.x, cam.y, cam.z);
  camera.lookAt(0, 0, 0);
});

// Color pickers — rebuild LUT when changed
document.getElementById('colorLow').addEventListener('input', (e) => {
  colorLow.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorMid').addEventListener('input', (e) => {
  colorMid.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorHigh').addEventListener('input', (e) => {
  colorHigh.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});

document.getElementById('hueShiftToggle').addEventListener('change', (e) => {
  hueShiftEnabled = e.target.checked;
  if (!hueShiftEnabled) {
    hueShiftOffset = 0;
    lastHueUpdateOffset = -1;
    updateShiftedColors();
    updateColorLUTTexture();
  }
});

const wireWidthSlider = document.getElementById('wireWidthSlider');
const wireWidthLabel = document.getElementById('wireWidthLabel');
wireWidthSlider.addEventListener('input', (e) => {
  wireframeWidth = parseFloat(e.target.value);
  wireWidthLabel.textContent = wireframeWidth.toFixed(1);
  lineMat.linewidth = wireframeWidth;

  if (wireframeWidth > 1 && !useLineSegments) {
    useLineSegments = true;
    mesh.visible = false;
    buildLineSegments();
    if (lineSegments) lineSegments.visible = true;
  } else if (wireframeWidth <= 1 && useLineSegments) {
    useLineSegments = false;
    mesh.visible = true;
    if (lineSegments) lineSegments.visible = false;
  }
});

document.getElementById('filmGrainToggle').addEventListener('change', (e) => {
  filmGrainEnabled = e.target.checked;
  filmPass.enabled = filmGrainEnabled;
});

document.getElementById('emissiveGlowToggle').addEventListener('change', (e) => {
  emissiveGlowEnabled = e.target.checked;
  spectrogramMaterial.uniforms.uEmissiveGlow.value = emissiveGlowEnabled ? 1.0 : 0.0;
});

// =====================================================
// Audio File
// =====================================================

const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  await audioContext.resume();

  const arrayBuffer = await file.arrayBuffer();
  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

  const source = audioContext.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(analyser);
  analyser.connect(audioContext.destination);
  source.start();

  audioStarted = true;
});

// =====================================================
// Animation Loop
// =====================================================

const clock = new THREE.Clock();
let accumulator = 0;

// Initialize
updateColorLUTTexture();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  // Get frequency data
  analyser.getByteFrequencyData(frequencyData);

  // #7: Throttle hue shift — only rebuild LUT if offset changed visibly
  if (hueShiftEnabled) {
    hueShiftOffset += delta * 0.03;
    if (hueShiftOffset > 1) hueShiftOffset -= 1;

    if (Math.abs(hueShiftOffset - lastHueUpdateOffset) > 0.001) {
      lastHueUpdateOffset = hueShiftOffset;
      updateShiftedColors();
      updateColorLUTTexture();
    }
  }

  // Scroll accumulation
  accumulator += delta * scrollSpeed * 60;

  if (accumulator >= 1) {
    accumulator = 0;
    // #1: Push only one new row to GPU
    pushNewRow();
  }

  // Rotation only after audio starts
  if (rotationEnabled && audioStarted) {
    mesh.rotation.y += delta * rotationSpeed;
    if (lineSegments) lineSegments.rotation.y = mesh.rotation.y;
  }

  // #5: Bypass EffectComposer when film grain is off
  if (!filmGrainEnabled) {
    renderer.render(scene, camera);
  } else {
    composer.render();
  }
}

animate();

// =====================================================
// Resize
// =====================================================

window.addEventListener('resize', () => {
  if (isRecording) return;

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

</script>
