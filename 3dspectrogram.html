<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Spectrogram</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020305;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }

    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }

    #togglePanel.shifted {
      left: 290px;
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<button id="togglePanel" class="shifted">☰ Hide Panel</button>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <!-- Movement -->
  <div class="section-label">Movement</div>

  <label>
    Scroll Speed: <span id="speedLabel">0.8</span>
  </label>
  <input
    type="range"
    id="speedSlider"
    min="0.2"
    max="4"
    step="0.1"
    value="0.8"
  />

  <div class="checkbox-row">
    <input type="checkbox" id="rotateToggle" checked />
    <span>Rotate</span>
  </div>

  <label>
    Rotation Speed: <span id="rotSpeedLabel">0.02</span>
  </label>
  <input
    type="range"
    id="rotSpeedSlider"
    min="0"
    max="0.3"
    step="0.01"
    value="0.02"
  />

  <!-- Color Gradient Section -->
  <div class="section-label">Color Gradient</div>

  <div class="color-row">
    <input type="color" id="colorLow" value="#000033" />
    <span>Low (quiet)</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorMid" value="#00d0ff" />
    <span>Mid</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorHigh" value="#00ff14" />
    <span>High (loud)</span>
  </div>

  <!-- Depth Fade Section -->
  <div class="section-label">Depth Fade</div>

  <label>
    Fade Amount: <span id="fadeLabel">0.1</span>
  </label>
  <input
    type="range"
    id="fadeSlider"
    min="0"
    max="1"
    step="0.05"
    value="0.1"
  />
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// =====================================================
// Scene
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020305);
scene.fog = new THREE.Fog(0x020305, 30, 160);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

// Camera now on the opposite side (negative Z)
camera.position.set(0, 32, -80);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// =====================================================
// Postprocessing
// =====================================================

const composer = new EffectComposer(renderer);

composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.4,
  0.4,
  0.85
);

composer.addPass(bloomPass);

// =====================================================
// Lights
// =====================================================

scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();

const analyser = audioContext.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);

// =====================================================
// Spectrogram Settings
// =====================================================

const FFT_BINS = analyser.frequencyBinCount;
const HISTORY = 400;

const LOW_BIN_SKIP = 10;

let scrollSpeed = 0.8;
let rotationEnabled = true;
let rotationSpeed = 0.02;
let fadeAmount = 0.1;

// Gradient colors
let colorLow  = new THREE.Color(0x000020);
let colorMid  = new THREE.Color(0x00d0ff);
let colorHigh = new THREE.Color(0x00ff14);

// =====================================================
// Geometry
// =====================================================

const geometry = new THREE.PlaneGeometry(
  110,
  160,
  FFT_BINS - 1,
  HISTORY - 1
);

geometry.rotateX(-Math.PI / 2);

// Add vertex color attribute
const vertexCount = geometry.attributes.position.count;
const colors = new Float32Array(vertexCount * 3);
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.MeshStandardMaterial({
  vertexColors: true,
  emissive: 0x000000,
  emissiveIntensity: 0.5,
  wireframe: true,
  transparent: true,
  opacity: 0.95
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// =====================================================
// History Buffer
// =====================================================

const history = [];

for (let i = 0; i < HISTORY; i++) {
  history.push(new Array(FFT_BINS).fill(0));
}

// =====================================================
// Log Frequency Mapping (skips low bins)
// =====================================================

function getLogIndex(i) {
  const normalized = i / FFT_BINS;
  const usableRange = FFT_BINS - 1 - LOW_BIN_SKIP;
  return LOW_BIN_SKIP + Math.floor(Math.pow(normalized, 2.2) * usableRange);
}

// =====================================================
// Color Interpolation Helper
// =====================================================

const tmpColor = new THREE.Color();

function getGradientColor(t) {
  if (t <= 0.5) {
    tmpColor.lerpColors(colorLow, colorMid, t * 2);
  } else {
    tmpColor.lerpColors(colorMid, colorHigh, (t - 0.5) * 2);
  }
  return tmpColor;
}

// =====================================================
// UI
// =====================================================

// Panel toggle
const toggleBtn = document.getElementById('togglePanel');
const uiPanel = document.getElementById('ui');
let panelVisible = true;

toggleBtn.addEventListener('click', () => {
  panelVisible = !panelVisible;
  if (panelVisible) {
    uiPanel.classList.remove('hidden');
    toggleBtn.classList.add('shifted');
    toggleBtn.textContent = '☰ Hide Panel';
  } else {
    uiPanel.classList.add('hidden');
    toggleBtn.classList.remove('shifted');
    toggleBtn.textContent = '☰ Show Panel';
  }
});

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');

speedSlider.addEventListener('input', (e) => {
  scrollSpeed = parseFloat(e.target.value);
  speedLabel.textContent = scrollSpeed.toFixed(1);
});

const rotateToggle = document.getElementById('rotateToggle');
rotateToggle.addEventListener('change', (e) => {
  rotationEnabled = e.target.checked;
});

const rotSpeedSlider = document.getElementById('rotSpeedSlider');
const rotSpeedLabel = document.getElementById('rotSpeedLabel');

rotSpeedSlider.addEventListener('input', (e) => {
  rotationSpeed = parseFloat(e.target.value);
  rotSpeedLabel.textContent = rotationSpeed.toFixed(2);
});

// Color pickers
document.getElementById('colorLow').addEventListener('input', (e) => {
  colorLow.set(e.target.value);
});
document.getElementById('colorMid').addEventListener('input', (e) => {
  colorMid.set(e.target.value);
});
document.getElementById('colorHigh').addEventListener('input', (e) => {
  colorHigh.set(e.target.value);
});

// Fade slider
const fadeSlider = document.getElementById('fadeSlider');
const fadeLabel = document.getElementById('fadeLabel');

fadeSlider.addEventListener('input', (e) => {
  fadeAmount = parseFloat(e.target.value);
  fadeLabel.textContent = fadeAmount.toFixed(2);
});

// =====================================================
// Audio File
// =====================================================

const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', async (e) => {

  const file = e.target.files[0];

  if (!file) return;

  await audioContext.resume();

  const arrayBuffer = await file.arrayBuffer();

  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

  const source = audioContext.createBufferSource();

  source.buffer = audioBuffer;

  source.connect(analyser);
  analyser.connect(audioContext.destination);

  source.start();
});

// =====================================================
// Animation
// =====================================================

const positions = geometry.attributes.position.array;
const colorArray = geometry.attributes.color.array;

const clock = new THREE.Clock();

let accumulator = 0;

function updateSpectrogram(delta) {

  analyser.getByteFrequencyData(frequencyData);

  accumulator += delta * scrollSpeed * 60;

  if (accumulator < 1) return;

  accumulator = 0;

  const frame = [];

  for (let i = 0; i < FFT_BINS; i++) {

    const logIndex = getLogIndex(i);

    frame.push(frequencyData[logIndex]);
  }

  history.unshift(frame);
  history.pop();

  let ptr = 0;

  for (let z = 0; z < HISTORY; z++) {

    const depthRatio = z / (HISTORY - 1);
    const depthMultiplier = 1.0 - (depthRatio * fadeAmount);

    for (let x = 0; x < FFT_BINS; x++) {

      const value = history[z][x] / 255;

      const amplified = Math.pow(value, 1.7) * 22;

      positions[ptr + 1] = amplified;

      // Get gradient color based on amplitude
      const color = getGradientColor(value);

      // Apply depth fade
      colorArray[ptr]     = color.r * depthMultiplier;
      colorArray[ptr + 1] = color.g * depthMultiplier;
      colorArray[ptr + 2] = color.b * depthMultiplier;

      ptr += 3;
    }
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;
}

function animate() {

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  updateSpectrogram(delta);

  if (rotationEnabled) {
    mesh.rotation.y += delta * rotationSpeed;
  }

  composer.render();
}

animate();

// =====================================================
// Resize
// =====================================================

window.addEventListener('resize', () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
