<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Spectrogram</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020305;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }

    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }

    #togglePanel.shifted {
      left: 290px;
    }

    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .top-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    #fpsCounter {
      background: rgba(0,0,0,0.7);
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      min-width: 60px;
      text-align: center;
      pointer-events: none;
    }

    .top-btn.recording {
      background: rgba(200,0,0,0.7);
      border-color: rgba(255,100,100,0.5);
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    canvas {
      display: block;
    }

  </style>
</head>
<body>

<button id="togglePanel" class="shifted">☰ Hide Panel</button>

<div class="top-right-buttons">
  <div id="fpsCounter">-- fps</div>
  <button id="recordBtn" class="top-btn">⏺ Record</button>
  <button id="exportBtn" class="top-btn">⬇ Export</button>
  <button id="fullscreenBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<div id="exportOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; font-family:Arial,sans-serif;">
  <div style="font-size:18px; margin-bottom:16px;" id="exportStatus">Exporting...</div>
  <div style="width:400px; height:8px; background:#333; border-radius:4px; overflow:hidden;">
    <div id="exportProgressBar" style="width:0%; height:100%; background:#4af; transition:width 0.1s;"></div>
  </div>
  <div style="font-size:14px; margin-top:8px; color:#aaa;" id="exportPercent">0%</div>
  <button id="exportCancelBtn" style="margin-top:20px; padding:8px 20px; cursor:pointer; background:#c33; border:none; color:#fff; border-radius:4px; font-size:14px;">Cancel</button>
</div>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <!-- Movement -->
  <div class="section-label">Movement</div>

  <label>
    Scroll Speed: <span id="speedLabel">0.8</span>
  </label>
  <input
    type="range"
    id="speedSlider"
    min="0.2"
    max="4"
    step="0.1"
    value="0.8"
  />

  <div class="checkbox-row">
    <input type="checkbox" id="rotateToggle" checked />
    <span>Rotate</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="driftToggle" />
    <span>Drift</span>
  </div>

  <label>
    Camera Speed: <span id="rotSpeedLabel">0.02</span>
  </label>
  <input
    type="range"
    id="rotSpeedSlider"
    min="0"
    max="0.3"
    step="0.01"
    value="0.02"
  />

  <!-- Camera -->
  <div class="section-label">Camera</div>

  <div class="checkbox-row">
    <input type="checkbox" id="lowAngleToggle" />
    <span>Low Angle</span>
  </div>

  <!-- Color Gradient Section -->
  <div class="section-label">Color Gradient</div>

  <div class="color-row">
    <input type="color" id="colorLow" value="#000033" />
    <span>Low (quiet)</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorMid" value="#39a7c0" />
    <span>Mid</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorHigh" value="#d6eae8" />
    <span>High (loud)</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="hueShiftToggle" checked />
    <span>Hue Shift Over Time</span>
  </div>

  <!-- Rendering -->
  <div class="section-label">Rendering</div>

  <label>
    Wireframe Width: <span id="wireWidthLabel">0.5</span>
  </label>
  <input
    type="range"
    id="wireWidthSlider"
    min="0.5"
    max="5"
    step="0.5"
    value="0.5"
  />

  <!-- Effects -->
  <div class="section-label">Effects</div>

  <div class="checkbox-row">
    <input type="checkbox" id="filmGrainToggle" />
    <span>Film Grain</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="emissiveGlowToggle" checked />
    <span>Emissive Glow</span>
  </div>

  <!-- Recording -->
  <div class="section-label">Recording</div>

  <div class="checkbox-row">
    <input type="checkbox" id="autoRecordToggle" />
    <span>Record on Play</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="autoExportToggle" />
    <span>Export on Play</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="lock60fpsToggle" />
    <span>Lock 60fps</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
  }
}
</script>

<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>

<script type="module">

import * as THREE from 'three';

// =====================================================
// Scene
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020305);
scene.fog = new THREE.Fog(0x020305, 30, 160);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const CAM_HIGH = { x: 0, y: 32, z: -80 };
const CAM_LOW  = { x: 0, y: 12, z: -70 };
let lowAngle = false;

// #6: Smooth Camera Transition
const targetCamPos = new THREE.Vector3(CAM_HIGH.x, CAM_HIGH.y, CAM_HIGH.z);
camera.position.copy(targetCamPos);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();
const analyser = audioContext.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);
let audioDestNode = null;

// =====================================================
// Settings (Restored 1:1 fidelity)
// =====================================================

const FFT_BINS = analyser.frequencyBinCount; // 1024
const HISTORY = 300;
const LOW_BIN_SKIP = 10;

let scrollSpeed = 0.8;
let rotationEnabled = true;
let rotationSpeed = 0.02;
let driftEnabled = false;
let driftAngle = 0;
let driftRadius = Math.sqrt(CAM_HIGH.z * CAM_HIGH.z + CAM_HIGH.x * CAM_HIGH.x);
let audioStarted = false;
let audioBuffer = null;
let audioSource = null;
let lockRecordingFps = false;

let colorLow  = new THREE.Color(0x000020);
let colorMid  = new THREE.Color(0x39a7c0);
let colorHigh = new THREE.Color(0xd6eae8);

let hueShiftEnabled = true;
let hueShiftOffset = 0;
let lastHueUpdateOffset = -1;

let wireframeWidth = 0.5;
let filmGrainEnabled = false;
let emissiveGlowEnabled = true;

// =====================================================
// Memory & LUT
// =====================================================

const COLOR_LUT_SIZE = 256;
const colorLUTData = new Uint8Array(COLOR_LUT_SIZE * 4);

const shiftedLow = new THREE.Color();
const shiftedMid = new THREE.Color();
const shiftedHigh = new THREE.Color();
const tmpColor = new THREE.Color();
const tempHSL = { h: 0, s: 0, l: 0 }; 

function rebuildColorLUT() {
  for (let i = 0; i < COLOR_LUT_SIZE; i++) {
    const t = i / (COLOR_LUT_SIZE - 1);
    if (t <= 0.5) {
      tmpColor.lerpColors(shiftedLow, shiftedMid, t * 2);
    } else {
      tmpColor.lerpColors(shiftedMid, shiftedHigh, (t - 0.5) * 2);
    }
    colorLUTData[i * 4]     = Math.round(tmpColor.r * 255);
    colorLUTData[i * 4 + 1] = Math.round(tmpColor.g * 255);
    colorLUTData[i * 4 + 2] = Math.round(tmpColor.b * 255);
    colorLUTData[i * 4 + 3] = 255;
  }
}

function updateShiftedColors() {
  shiftedLow.copy(colorLow);
  shiftedMid.copy(colorMid);
  shiftedHigh.copy(colorHigh);
  if (hueShiftEnabled && hueShiftOffset > 0) {
    shiftedLow.getHSL(tempHSL);
    shiftedLow.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
    shiftedMid.getHSL(tempHSL);
    shiftedMid.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
    shiftedHigh.getHSL(tempHSL);
    shiftedHigh.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
  }
  rebuildColorLUT();
}
updateShiftedColors();

// #1: Data Texture (Direct RedFormat for zero CPU loops)
const dataTextureArray = new Uint8Array(FFT_BINS * HISTORY);
const dataTexture = new THREE.DataTexture(
  dataTextureArray,
  FFT_BINS,
  HISTORY,
  THREE.RedFormat,
  THREE.UnsignedByteType
);
dataTexture.minFilter = THREE.NearestFilter;
dataTexture.magFilter = THREE.NearestFilter;
dataTexture.needsUpdate = true;

const colorLUTTexture = new THREE.DataTexture(
  colorLUTData, COLOR_LUT_SIZE, 1, THREE.RGBAFormat, THREE.UnsignedByteType
);
colorLUTTexture.minFilter = THREE.LinearFilter;
colorLUTTexture.magFilter = THREE.LinearFilter;
colorLUTTexture.needsUpdate = true;

function updateColorLUTTexture() {
  colorLUTTexture.image.data.set(colorLUTData);
  colorLUTTexture.needsUpdate = true;
}

let historyHead = 0;

// =====================================================
// Shader
// =====================================================

const spectrogramMaterial = new THREE.ShaderMaterial({
  wireframe: true,
  transparent: true,
  uniforms: {
    uDataTexture: { value: dataTexture },
    uColorLUT: { value: colorLUTTexture },
    uHistoryHead: { value: 0.0 },
    uHistorySize: { value: HISTORY },
    uHeightScale: { value: 22.0 },
    uEmissiveGlow: { value: 1.0 },
    uFogColor: { value: new THREE.Color(0x020305) },
    uFogNear: { value: 30.0 },
    uFogFar: { value: 160.0 },
    uTime: { value: 0.0 },
    uFilmGrain: { value: 0.0 },
    uLowBinSkip: { value: LOW_BIN_SKIP / FFT_BINS }
  },
  vertexShader: `
    uniform sampler2D uDataTexture;
    uniform sampler2D uColorLUT;
    uniform float uHistoryHead;
    uniform float uHistorySize;
    uniform float uHeightScale;
    uniform float uEmissiveGlow;
    uniform float uLowBinSkip;
    uniform vec3 uFogColor;
    uniform float uFogNear;
    uniform float uFogFar;

    varying vec3 vColor;
    varying vec2 vUv;

    void main() {
      vUv = uv;
      vec2 gridUV = uv;

      float usableRange = 1.0 - uLowBinSkip;
      float logX = uLowBinSkip + pow(gridUV.x, 2.2) * usableRange;

      float row = gridUV.y * (uHistorySize - 1.0);
      float texRow = mod(uHistoryHead - 1.0 - row + uHistorySize, uHistorySize);
      float texV = (texRow + 0.5) / uHistorySize;
      
      float amplitude = texture2D(uDataTexture, vec2(logX, texV)).r;
      float height = pow(amplitude, 1.7) * uHeightScale;

      vec3 displaced = position;
      displaced.y = height;

      vec3 baseColor = texture2D(uColorLUT, vec2(amplitude, 0.5)).rgb;
      float glow = pow(amplitude, 2.5) * uEmissiveGlow;
      vec3 finalColor = baseColor + baseColor * glow;

      vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
      float fogDepth = -mvPosition.z;

      // Calculate fog in vertex shader for better performance
      float fogFactor = smoothstep(uFogNear, uFogFar, fogDepth);
      vColor = mix(finalColor, uFogColor, fogFactor);

      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform float uFilmGrain;

    varying vec3 vColor;
    varying vec2 vUv;

    float noise(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
      vec3 color = vColor;
      if (uFilmGrain > 0.0) {
        float grain = noise(vUv * 10.0 + uTime) - 0.5;
        color += grain * 0.08 * uFilmGrain;
      }
      gl_FragColor = vec4(color, 0.95);
    }
  `
});

// =====================================================
// Geometry (Restored 1:1)
// =====================================================

const geometry = new THREE.PlaneGeometry(110, 160, FFT_BINS - 1, HISTORY - 1);
geometry.rotateX(-Math.PI / 2);

// #4: Static Bounding Box & Frustum Culling Optimization
// Pre-computing a fixed box prevents Three.js from re-scanning vertices every frame.
// We expand it by 50 to safely encompass the maximum possible peak heights (uHeightScale = 22).
geometry.computeBoundingBox();
geometry.boundingBox.expandByScalar(50);

const mesh = new THREE.Mesh(geometry, spectrogramMaterial);
mesh.frustumCulled = true; // Explicitly enable efficient culling
scene.add(mesh);

function pushNewRow() {
  const offset = historyHead * FFT_BINS;
  dataTextureArray.set(frequencyData, offset);

  const gl = renderer.getContext();
  const texProps = renderer.properties.get(dataTexture);

  if (texProps.__webglTexture) {
    const activeTexture = gl.getParameter(gl.TEXTURE_BINDING_2D);
    gl.bindTexture(gl.TEXTURE_2D, texProps.__webglTexture);
    gl.texSubImage2D(
      gl.TEXTURE_2D, 0, 0, historyHead, FFT_BINS, 1,
      gl.RED, gl.UNSIGNED_BYTE, frequencyData
    );
    gl.bindTexture(gl.TEXTURE_2D, activeTexture);
  } else {
    dataTexture.needsUpdate = true;
  }

  historyHead = (historyHead + 1) % HISTORY;
  spectrogramMaterial.uniforms.uHistoryHead.value = historyHead;
}

// =====================================================
// Recording
// =====================================================

let videoTrack = null;
let lastCaptureMs = 0;
let preRecordWidth = 0;
let preRecordHeight = 0;
let preRecordPixelRatio = 1;

const recorder = createRecorder({
  defaultFilename: 'spectrogram_1080p',
  onStart: (codec) => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '⏹ Stop';
    btn.classList.add('recording');
  },
  onStop: () => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '⏺ Record';
    btn.classList.remove('recording');

    try { analyser.disconnect(audioDestNode); } catch(e) {}
    audioDestNode = null;
    videoTrack = null;

    renderer.setPixelRatio(preRecordPixelRatio);
    renderer.setSize(preRecordWidth, preRecordHeight);
    camera.aspect = preRecordWidth / preRecordHeight;
    camera.updateProjectionMatrix();
  },
});

function makeRecordingStream() {
  preRecordWidth = window.innerWidth;
  preRecordHeight = window.innerHeight;
  preRecordPixelRatio = renderer.getPixelRatio();

  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();

  const canvas = renderer.domElement;
  const videoStream = canvas.captureStream(0);
  videoTrack = videoStream.getVideoTracks()[0];
  lastCaptureMs = 0;

  const audioStreamDest = audioContext.createMediaStreamDestination();
  audioDestNode = audioStreamDest;
  analyser.connect(audioStreamDest);

  const audioTrack = audioStreamDest.stream.getAudioTracks()[0];
  if (audioTrack) videoStream.addTrack(audioTrack);

  return videoStream;
}

// =====================================================
// UI & Animation
// =====================================================

document.getElementById('recordBtn').addEventListener('click', () => {
  recorder.toggle(makeRecordingStream);
});

const clock = new THREE.Clock();
let accumulator = 0;

const fpsCounter = document.getElementById('fpsCounter');
const glCtx = renderer.getContext();
let fpsFrames = 0;
let fpsElapsed = 0;
let lastTickTime = performance.now();
let offlineExporting = false;

function tickFrame(delta) {
  spectrogramMaterial.uniforms.uTime.value += delta;
  if (!offlineExporting) analyser.getByteFrequencyData(frequencyData);

  if (hueShiftEnabled) {
    hueShiftOffset += delta * 0.03;
    if (hueShiftOffset > 1) hueShiftOffset -= 1;
    if (Math.abs(hueShiftOffset - lastHueUpdateOffset) > 0.002) {
      lastHueUpdateOffset = hueShiftOffset;
      updateShiftedColors();
      updateColorLUTTexture();
    }
  }

  accumulator += delta * scrollSpeed * 60;
  if (accumulator >= 1) {
    accumulator -= 1;
    pushNewRow();
  }
  if (rotationEnabled && audioStarted) {
    mesh.rotation.y += delta * rotationSpeed;
  }
  if (driftEnabled && audioStarted) {
    driftAngle += delta * rotationSpeed * 0.5;
    const baseCam = lowAngle ? CAM_LOW : CAM_HIGH;
    const targetRadius = Math.sqrt(baseCam.x * baseCam.x + baseCam.z * baseCam.z);
    driftRadius += (targetRadius - driftRadius) * 0.001;
    const baseAngle = Math.atan2(baseCam.x, baseCam.z);
    const orbitAngle = baseAngle + Math.sin(driftAngle) * (Math.PI * 75 / 180);
    targetCamPos.x = Math.sin(orbitAngle) * driftRadius;
    targetCamPos.z = Math.cos(orbitAngle) * driftRadius;
    targetCamPos.y = baseCam.y;
  } else if (!driftEnabled) {
    const baseCam = lowAngle ? CAM_LOW : CAM_HIGH;
    targetCamPos.x = baseCam.x;
    targetCamPos.z = baseCam.z;
    driftRadius = Math.sqrt(baseCam.z * baseCam.z + baseCam.x * baseCam.x);
  }

  const lerpXZ = driftEnabled ? 0.05 : 0.001;
  camera.position.x += (targetCamPos.x - camera.position.x) * lerpXZ;
  camera.position.z += (targetCamPos.z - camera.position.z) * lerpXZ;
  camera.position.y += (targetCamPos.y - camera.position.y) * 0.001;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  // Stall until the GPU has finished this frame during recording/export
  // to ensure captureStream always captures a fully-rendered frame.
  // Skip during normal playback to avoid unnecessary GPU pipeline stalls.
  if (recorder.isRecording || offlineExporting) glCtx.finish();

  const now = performance.now();
  fpsElapsed += now - lastTickTime;
  lastTickTime = now;
  fpsFrames++;
  if (fpsElapsed >= 500) {
    fpsCounter.textContent = Math.round(fpsFrames / (fpsElapsed / 1000)) + ' fps';
    fpsFrames = 0;
    fpsElapsed = 0;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  if (recorder.isRecording && lockRecordingFps && now - lastCaptureMs < 16.5) return;
  tickFrame(clock.getDelta());
  if (recorder.isRecording && videoTrack) {
    videoTrack.requestFrame();
    lastCaptureMs = now;
  }
}

animate();

// UI Listeners
document.getElementById('togglePanel').addEventListener('click', (e) => {
  const ui = document.getElementById('ui');
  const btn = e.target;
  if (ui.classList.contains('hidden')) {
    ui.classList.remove('hidden');
    btn.classList.add('shifted');
    btn.textContent = '☰ Hide Panel';
  } else {
    ui.classList.add('hidden');
    btn.classList.remove('shifted');
    btn.textContent = '☰ Show Panel';
  }
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.getElementById('speedSlider').addEventListener('input', (e) => {
  scrollSpeed = parseFloat(e.target.value);
  document.getElementById('speedLabel').textContent = scrollSpeed.toFixed(1);
});

const rotateToggle = document.getElementById('rotateToggle');
const driftToggle = document.getElementById('driftToggle');
rotateToggle.addEventListener('change', (e) => {
  rotationEnabled = e.target.checked;
  if (rotationEnabled) { driftEnabled = false; driftToggle.checked = false; }
});
driftToggle.addEventListener('change', (e) => {
  driftEnabled = e.target.checked;
  if (driftEnabled) { rotationEnabled = false; rotateToggle.checked = false; }
});

document.getElementById('rotSpeedSlider').addEventListener('input', (e) => {
  rotationSpeed = parseFloat(e.target.value);
  document.getElementById('rotSpeedLabel').textContent = rotationSpeed.toFixed(2);
});

document.getElementById('lowAngleToggle').addEventListener('change', (e) => {
  lowAngle = e.target.checked;
  const cam = lowAngle ? CAM_LOW : CAM_HIGH;
  targetCamPos.set(cam.x, cam.y, cam.z);
});

document.getElementById('colorLow').addEventListener('input', (e) => {
  colorLow.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorMid').addEventListener('input', (e) => {
  colorMid.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorHigh').addEventListener('input', (e) => {
  colorHigh.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});

document.getElementById('hueShiftToggle').addEventListener('change', (e) => {
  hueShiftEnabled = e.target.checked;
  if (!hueShiftEnabled) {
    hueShiftOffset = 0;
    updateShiftedColors();
    updateColorLUTTexture();
  }
});

document.getElementById('wireWidthSlider').addEventListener('input', (e) => {
  wireframeWidth = parseFloat(e.target.value);
  document.getElementById('wireWidthLabel').textContent = wireframeWidth.toFixed(1);
});

document.getElementById('filmGrainToggle').addEventListener('change', (e) => {
  filmGrainEnabled = e.target.checked;
  spectrogramMaterial.uniforms.uFilmGrain.value = filmGrainEnabled ? 1.0 : 0.0;
});

document.getElementById('emissiveGlowToggle').addEventListener('change', (e) => {
  emissiveGlowEnabled = e.target.checked;
  spectrogramMaterial.uniforms.uEmissiveGlow.value = emissiveGlowEnabled ? 1.0 : 0.0;
});

document.getElementById('lock60fpsToggle').addEventListener('change', (e) => {
  lockRecordingFps = e.target.checked;
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const autoExport = document.getElementById('autoExportToggle').checked;
  const autoRecord = document.getElementById('autoRecordToggle').checked;

  let writable;
  if (autoExport) {
    if (offlineExporting) return;
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'spectrogram_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      writable = await handle.createWritable();
    } catch (err) { return; }
  }

  let prepared;
  if (autoRecord && !autoExport) {
    prepared = await recorder.prepareAutoRecord();
    if (!prepared) return;
  }

  await audioContext.resume();
  audioBuffer = await audioContext.decodeAudioData(await file.arrayBuffer());

  if (autoExport) {
    document.getElementById('exportBtn').writable = writable;
    document.getElementById('exportBtn').click();
    return;
  }

  audioSource = audioContext.createBufferSource();
  audioSource.buffer = audioBuffer;
  audioSource.connect(analyser);
  analyser.connect(audioContext.destination);
  audioSource.start();
  audioStarted = true;

  if (prepared && !recorder.isRecording) {
    recorder.startAutoRecord(prepared, makeRecordingStream);
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Offline Export
let exportCancelled = false;
document.getElementById('exportBtn').addEventListener('click', async () => {
  if (!audioBuffer) { alert('Load an audio file first.'); return; }
  if (offlineExporting) return;

  const btn = document.getElementById('exportBtn');
  const writable = btn.writable || await (async () => {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'spectrogram_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      return await handle.createWritable();
    } catch (e) { return null; }
  })();
  btn.writable = null;
  if (!writable) return;

  const overlay = document.getElementById('exportOverlay');
  const progressBar = document.getElementById('exportProgressBar');
  const percentText = document.getElementById('exportPercent');
  const statusText = document.getElementById('exportStatus');
  overlay.style.display = 'flex';
  exportCancelled = false;

  // Save and set export resolution
  const savedWidth = renderer.domElement.width;
  const savedHeight = renderer.domElement.height;
  const savedAspect = camera.aspect;
  renderer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();

  // Save scene state to restore after
  const savedRotationY = mesh.rotation.y;
  const savedCamPos = camera.position.clone();
  const savedTargetCamPos = targetCamPos.clone();
  const savedDriftAngle = driftAngle;
  const savedDriftRadius = driftRadius;
  const savedHistoryHead = historyHead;
  const savedAccumulator = accumulator;
  const savedUTime = spectrogramMaterial.uniforms.uTime.value;
  const savedHueOffset = hueShiftOffset;
  const savedLastHueUpdateOffset = lastHueUpdateOffset;

  offlineExporting = true;
  await audioContext.suspend();

  try {
    await offlineExport({
      audioBuffer,
      fps: 60,
      width: 1920,
      height: 1080,
      fftSize: analyser.fftSize,
      smoothingTimeConstant: analyser.smoothingTimeConstant,
      minDecibels: analyser.minDecibels,
      maxDecibels: analyser.maxDecibels,
      writable,
      isCancelled: () => exportCancelled,
      renderFrame: (fftData, delta) => {
        frequencyData.set(fftData);
        tickFrame(delta);
      },
      readCanvas: () => renderer.domElement,
      onProgress: (frac) => {
        const pct = Math.round(frac * 100);
        progressBar.style.width = pct + '%';
        percentText.textContent = pct + '%';
        statusText.textContent = 'Exporting... frame ' + Math.round(frac * Math.ceil(audioBuffer.duration * 60)) + '/' + Math.ceil(audioBuffer.duration * 60);
      },
      onDone: () => {
        statusText.textContent = 'Export complete!';
        setTimeout(() => { overlay.style.display = 'none'; }, 1500);
      },
    });
  } catch (e) {
    console.error('Export error:', e);
    statusText.textContent = 'Export failed: ' + e.message;
    setTimeout(() => { overlay.style.display = 'none'; }, 3000);
  }

  offlineExporting = false;
  await audioContext.resume();

  // Restore scene state
  mesh.rotation.y = savedRotationY;
  camera.position.copy(savedCamPos);
  targetCamPos.copy(savedTargetCamPos);
  driftAngle = savedDriftAngle;
  driftRadius = savedDriftRadius;
  historyHead = savedHistoryHead;
  accumulator = savedAccumulator;
  spectrogramMaterial.uniforms.uTime.value = savedUTime;
  hueShiftOffset = savedHueOffset;
  lastHueUpdateOffset = savedLastHueUpdateOffset;
  spectrogramMaterial.uniforms.uHistoryHead.value = historyHead;

  renderer.setSize(savedWidth, savedHeight);
  camera.aspect = savedAspect;
  camera.updateProjectionMatrix();
});

document.getElementById('exportCancelBtn').addEventListener('click', () => {
  exportCancelled = true;
  document.getElementById('exportStatus').textContent = 'Cancelling...';
});

</script>
</body>
</html>
