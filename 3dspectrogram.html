<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Spectrogram</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020305;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }

    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }

    #togglePanel.shifted {
      left: 290px;
    }

    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .top-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .top-btn.recording {
      background: rgba(200,0,0,0.7);
      border-color: rgba(255,100,100,0.5);
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<button id="togglePanel" class="shifted">☰ Hide Panel</button>

<div class="top-right-buttons">
  <button id="recordBtn" class="top-btn">⏺ Record</button>
  <button id="fullscreenBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <!-- Movement -->
  <div class="section-label">Movement</div>

  <label>
    Scroll Speed: <span id="speedLabel">0.8</span>
  </label>
  <input
    type="range"
    id="speedSlider"
    min="0.2"
    max="4"
    step="0.1"
    value="0.8"
  />

  <div class="checkbox-row">
    <input type="checkbox" id="rotateToggle" checked />
    <span>Rotate</span>
  </div>

  <label>
    Rotation Speed: <span id="rotSpeedLabel">0.02</span>
  </label>
  <input
    type="range"
    id="rotSpeedSlider"
    min="0"
    max="0.3"
    step="0.01"
    value="0.02"
  />

  <!-- Camera -->
  <div class="section-label">Camera</div>

  <div class="checkbox-row">
    <input type="checkbox" id="lowAngleToggle" />
    <span>Low Angle</span>
  </div>

  <!-- Color Gradient Section -->
  <div class="section-label">Color Gradient</div>

  <div class="color-row">
    <input type="color" id="colorLow" value="#000033" />
    <span>Low (quiet)</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorMid" value="#39a7c0" />
    <span>Mid</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorHigh" value="#d6eae8" />
    <span>High (loud)</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="hueShiftToggle" checked />
    <span>Hue Shift Over Time</span>
  </div>

  <!-- Depth Fade Section -->
  <div class="section-label">Depth Fade</div>

  <label>
    Fade Amount: <span id="fadeLabel">0.0</span>
  </label>
  <input
    type="range"
    id="fadeSlider"
    min="0"
    max="1"
    step="0.05"
    value="0.0"
  />

  <!-- Rendering -->
  <div class="section-label">Rendering</div>

  <label>
    Bloom Strength: <span id="bloomLabel">1.4</span>
  </label>
  <input
    type="range"
    id="bloomSlider"
    min="0"
    max="4"
    step="0.1"
    value="1.4"
  />

  <label>
    Wireframe Width: <span id="wireWidthLabel">0.5</span>
  </label>
  <input
    type="range"
    id="wireWidthSlider"
    min="0.5"
    max="5"
    step="0.5"
    value="0.5"
  />
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// =====================================================
// Scene
// =====================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020305);
scene.fog = new THREE.Fog(0x020305, 30, 160);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

// Camera positions
const CAM_HIGH = { x: 0, y: 32, z: -80 };
const CAM_LOW  = { x: 0, y: 12, z: -70 };
let lowAngle = false;

camera.position.set(CAM_HIGH.x, CAM_HIGH.y, CAM_HIGH.z);
camera.lookAt(0, 0, 0);

// preserveDrawingBuffer needed for MediaRecorder to capture frames
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// =====================================================
// Postprocessing
// =====================================================

const composer = new EffectComposer(renderer);

composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.4,
  0.4,
  0.85
);

composer.addPass(bloomPass);

// =====================================================
// Lights
// =====================================================

scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();

const analyser = audioContext.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);

// =====================================================
// Spectrogram Settings
// =====================================================

const FFT_BINS = analyser.frequencyBinCount;
const HISTORY = 400;

const LOW_BIN_SKIP = 10;

let scrollSpeed = 0.8;
let rotationEnabled = true;
let rotationSpeed = 0.02;
let fadeAmount = 0.0;

// Track whether audio has been loaded
let audioStarted = false;

// Gradient colors
let colorLow  = new THREE.Color(0x000020);
let colorMid  = new THREE.Color(0x39a7c0);
let colorHigh = new THREE.Color(0xd6eae8);

// Hue shift (enabled by default)
let hueShiftEnabled = true;
let hueShiftOffset = 0;

// Rendering options
let wireframeWidth = 0.5;

// =====================================================
// Geometry
// =====================================================

const geometry = new THREE.PlaneGeometry(
  110,
  160,
  FFT_BINS - 1,
  HISTORY - 1
);

geometry.rotateX(-Math.PI / 2);

// Add vertex color attribute
const vertexCount = geometry.attributes.position.count;
const colorsAttr = new Float32Array(vertexCount * 3);
geometry.setAttribute('color', new THREE.BufferAttribute(colorsAttr, 3));

// =====================================================
// Wireframe Mesh (main visual)
// =====================================================

const material = new THREE.MeshStandardMaterial({
  vertexColors: true,
  emissive: 0x000000,
  emissiveIntensity: 0.5,
  wireframe: true,
  transparent: true,
  opacity: 0.95
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// =====================================================
// Line Segments wireframe (for thickness control)
// =====================================================

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  linewidth: wireframeWidth
});

let lineSegments = null;
let useLineSegments = false;

function rebuildLineSegments() {
  if (lineSegments) {
    scene.remove(lineSegments);
    lineSegments.geometry.dispose();
  }
  const wireGeo = new THREE.WireframeGeometry(geometry);
  lineSegments = new THREE.LineSegments(wireGeo, lineMat);
  lineSegments.rotation.y = mesh.rotation.y;
  lineSegments.visible = useLineSegments;
  scene.add(lineSegments);
}

// =====================================================
// History Buffer — flat typed array + ring buffer
// =====================================================

// Single flat Float32Array: HISTORY rows × FFT_BINS columns
const historyBuffer = new Float32Array(HISTORY * FFT_BINS);
let historyHead = 0; // ring buffer write pointer

// Pre-built log index lookup table (avoids recomputing every frame)
const logIndexTable = new Uint16Array(FFT_BINS);
for (let i = 0; i < FFT_BINS; i++) {
  const normalized = i / FFT_BINS;
  const usableRange = FFT_BINS - 1 - LOW_BIN_SKIP;
  logIndexTable[i] = LOW_BIN_SKIP + Math.floor(Math.pow(normalized, 2.2) * usableRange);
}

// =====================================================
// Color Interpolation with Hue Shift
// =====================================================

const tmpColor = new THREE.Color();
const shiftedLow = new THREE.Color();
const shiftedMid = new THREE.Color();
const shiftedHigh = new THREE.Color();

function updateShiftedColors() {
  shiftedLow.copy(colorLow);
  shiftedMid.copy(colorMid);
  shiftedHigh.copy(colorHigh);

  if (hueShiftEnabled && hueShiftOffset > 0) {
    const hsl = {};

    shiftedLow.getHSL(hsl);
    shiftedLow.setHSL((hsl.h + hueShiftOffset) % 1, hsl.s, hsl.l);

    shiftedMid.getHSL(hsl);
    shiftedMid.setHSL((hsl.h + hueShiftOffset) % 1, hsl.s, hsl.l);

    shiftedHigh.getHSL(hsl);
    shiftedHigh.setHSL((hsl.h + hueShiftOffset) % 1, hsl.s, hsl.l);
  }
}

function getGradientColor(t) {
  if (t <= 0.5) {
    tmpColor.lerpColors(shiftedLow, shiftedMid, t * 2);
  } else {
    tmpColor.lerpColors(shiftedMid, shiftedHigh, (t - 0.5) * 2);
  }
  return tmpColor;
}

// =====================================================
// Recording (MediaRecorder at 1080p 60fps, video only)
// =====================================================

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

// Store original renderer size to restore after recording
let preRecordWidth = 0;
let preRecordHeight = 0;
let preRecordPixelRatio = 1;

function startRecording() {
  // Save current size
  preRecordWidth = renderer.domElement.clientWidth;
  preRecordHeight = renderer.domElement.clientHeight;
  preRecordPixelRatio = renderer.getPixelRatio();

  // Force renderer to 1920×1080 at pixel ratio 1
  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080);
  composer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();

  const canvas = renderer.domElement;
  const stream = canvas.captureStream(60);

  recordedChunks = [];

  // Try VP9 first, fall back to VP8
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm;codecs=vp8';

  mediaRecorder = new MediaRecorder(stream, {
    mimeType: mimeType,
    videoBitsPerSecond: 16000000 // 16 Mbps for high quality
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) {
      recordedChunks.push(e.data);
    }
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spectrogram_1080p60.webm';
    a.click();
    URL.revokeObjectURL(url);

    // Restore original size
    renderer.setPixelRatio(preRecordPixelRatio);
    renderer.setSize(preRecordWidth, preRecordHeight);
    composer.setSize(preRecordWidth, preRecordHeight);
    camera.aspect = preRecordWidth / preRecordHeight;
    camera.updateProjectionMatrix();
  };

  mediaRecorder.start(100); // collect data every 100ms
  isRecording = true;

  const btn = document.getElementById('recordBtn');
  btn.textContent = '⏹ Stop';
  btn.classList.add('recording');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;

  const btn = document.getElementById('recordBtn');
  btn.textContent = '⏺ Record';
  btn.classList.remove('recording');
}

// =====================================================
// UI
// =====================================================

// Panel toggle
const toggleBtn = document.getElementById('togglePanel');
const uiPanel = document.getElementById('ui');
let panelVisible = true;

toggleBtn.addEventListener('click', () => {
  panelVisible = !panelVisible;
  if (panelVisible) {
    uiPanel.classList.remove('hidden');
    toggleBtn.classList.add('shifted');
    toggleBtn.textContent = '☰ Hide Panel';
  } else {
    uiPanel.classList.add('hidden');
    toggleBtn.classList.remove('shifted');
    toggleBtn.textContent = '☰ Show Panel';
  }
});

// Record button
document.getElementById('recordBtn').addEventListener('click', () => {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
});

// Fullscreen button
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fullscreenBtn');
  if (document.fullscreenElement) {
    btn.textContent = '⛶ Exit Fullscreen';
  } else {
    btn.textContent = '⛶ Fullscreen';
  }
});

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');

speedSlider.addEventListener('input', (e) => {
  scrollSpeed = parseFloat(e.target.value);
  speedLabel.textContent = scrollSpeed.toFixed(1);
});

const rotateToggle = document.getElementById('rotateToggle');
rotateToggle.addEventListener('change', (e) => {
  rotationEnabled = e.target.checked;
});

const rotSpeedSlider = document.getElementById('rotSpeedSlider');
const rotSpeedLabel = document.getElementById('rotSpeedLabel');

rotSpeedSlider.addEventListener('input', (e) => {
  rotationSpeed = parseFloat(e.target.value);
  rotSpeedLabel.textContent = rotationSpeed.toFixed(2);
});

// Low angle toggle
document.getElementById('lowAngleToggle').addEventListener('change', (e) => {
  lowAngle = e.target.checked;
  const cam = lowAngle ? CAM_LOW : CAM_HIGH;
  camera.position.set(cam.x, cam.y, cam.z);
  camera.lookAt(0, 0, 0);
});

// Color pickers
document.getElementById('colorLow').addEventListener('input', (e) => {
  colorLow.set(e.target.value);
});
document.getElementById('colorMid').addEventListener('input', (e) => {
  colorMid.set(e.target.value);
});
document.getElementById('colorHigh').addEventListener('input', (e) => {
  colorHigh.set(e.target.value);
});

// Hue shift toggle
document.getElementById('hueShiftToggle').addEventListener('change', (e) => {
  hueShiftEnabled = e.target.checked;
  if (!hueShiftEnabled) {
    hueShiftOffset = 0;
  }
});

// Fade slider
const fadeSlider = document.getElementById('fadeSlider');
const fadeLabel = document.getElementById('fadeLabel');

fadeSlider.addEventListener('input', (e) => {
  fadeAmount = parseFloat(e.target.value);
  fadeLabel.textContent = fadeAmount.toFixed(2);
});

// Bloom strength slider
const bloomSlider = document.getElementById('bloomSlider');
const bloomLabel = document.getElementById('bloomLabel');

bloomSlider.addEventListener('input', (e) => {
  bloomPass.strength = parseFloat(e.target.value);
  bloomLabel.textContent = parseFloat(e.target.value).toFixed(1);
});

// Wireframe width slider
const wireWidthSlider = document.getElementById('wireWidthSlider');
const wireWidthLabel = document.getElementById('wireWidthLabel');

wireWidthSlider.addEventListener('input', (e) => {
  wireframeWidth = parseFloat(e.target.value);
  wireWidthLabel.textContent = wireframeWidth.toFixed(1);
  lineMat.linewidth = wireframeWidth;

  if (wireframeWidth > 1 && !useLineSegments) {
    useLineSegments = true;
    mesh.visible = false;
    rebuildLineSegments();
    if (lineSegments) lineSegments.visible = true;
  } else if (wireframeWidth <= 1 && useLineSegments) {
    useLineSegments = false;
    mesh.visible = true;
    if (lineSegments) lineSegments.visible = false;
  }
});

// =====================================================
// Audio File
// =====================================================

const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', async (e) => {

  const file = e.target.files[0];

  if (!file) return;

  await audioContext.resume();

  const arrayBuffer = await file.arrayBuffer();

  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

  const source = audioContext.createBufferSource();

  source.buffer = audioBuffer;

  source.connect(analyser);
  analyser.connect(audioContext.destination);

  source.start();

  audioStarted = true;
});

// =====================================================
// Animation
// =====================================================

const positions = geometry.attributes.position.array;
const colorArray = geometry.attributes.color.array;

const clock = new THREE.Clock();

let accumulator = 0;
let needsLineRebuild = false;

function updateSpectrogram(delta) {

  analyser.getByteFrequencyData(frequencyData);

  // Advance hue shift
  if (hueShiftEnabled) {
    hueShiftOffset += delta * 0.03;
    if (hueShiftOffset > 1) hueShiftOffset -= 1;
  }

  updateShiftedColors();

  accumulator += delta * scrollSpeed * 60;

  if (accumulator < 1) return;

  accumulator = 0;

  // Write new row directly into ring buffer (no array creation, no unshift)
  const rowOffset = historyHead * FFT_BINS;
  for (let i = 0; i < FFT_BINS; i++) {
    historyBuffer[rowOffset + i] = frequencyData[logIndexTable[i]];
  }

  // Advance ring buffer head
  historyHead = (historyHead + 1) % HISTORY;

  // Update vertex positions and colors
  let ptr = 0;

  for (let z = 0; z < HISTORY; z++) {

    const depthRatio = z / (HISTORY - 1);
    const depthMultiplier = 1.0 - (depthRatio * fadeAmount);

    // Read from ring buffer: newest row is at (historyHead - 1), oldest at historyHead
    const rowIndex = ((historyHead - 1 - z) % HISTORY + HISTORY) % HISTORY;
    const srcOffset = rowIndex * FFT_BINS;

    for (let x = 0; x < FFT_BINS; x++) {

      const value = historyBuffer[srcOffset + x] / 255;

      const amplified = Math.pow(value, 1.7) * 22;

      positions[ptr + 1] = amplified;

      const color = getGradientColor(value);

      colorArray[ptr]     = color.r * depthMultiplier;
      colorArray[ptr + 1] = color.g * depthMultiplier;
      colorArray[ptr + 2] = color.b * depthMultiplier;

      ptr += 3;
    }
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;

  needsLineRebuild = true;
}

function animate() {

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  updateSpectrogram(delta);

  // Only rotate after audio has started
  if (rotationEnabled && audioStarted) {
    mesh.rotation.y += delta * rotationSpeed;
    if (lineSegments) lineSegments.rotation.y = mesh.rotation.y;
  }

  // Rebuild line segments if geometry changed and they're visible
  if (needsLineRebuild && useLineSegments) {
    rebuildLineSegments();
    if (lineSegments) lineSegments.rotation.y = mesh.rotation.y;
    needsLineRebuild = false;
  }

  composer.render();
}

animate();

// =====================================================
// Resize (skip during recording to maintain 1080p)
// =====================================================

window.addEventListener('resize', () => {

  if (isRecording) return;

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
