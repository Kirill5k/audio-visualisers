<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Visualiser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}
.container {
  display: grid;
  grid-template-rows: 36px 1fr auto 1fr;
  height: 100vh;
  width: 100vw;
  gap: 1px;
  background: #222;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #000;
  border-bottom: 1px solid #333;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.upload-btn {
  background: none;
  border: 1px solid #555;
  color: #fff;
  font-family: inherit;
  font-size: 11px;
  padding: 4px 14px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.upload-btn:hover { border-color: #fff; }
.track-name { color: #888; font-size: 11px; }
.header-right { color: #666; font-size: 10px; letter-spacing: 1px; }

.main-panels {
  display: grid;
  grid-template-columns: 1fr 300px;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1px;
  background: #222;
  min-height: 0;
}
.main-panels .spectrum-area {
  grid-column: 1;
  grid-row: 1 / 4;
}
.main-panels .osc-stack {
  grid-column: 2;
  grid-row: 1 / 4;
  display: grid;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 1px;
}
.panel {
  background: #000;
  position: relative;
  overflow: hidden;
  padding: 4px 12px;
}
.panel-label {
  position: absolute;
  top: 4px;
  left: 12px;
  font-size: 9px;
  color: #555;
  letter-spacing: 1px;
  text-transform: uppercase;
  z-index: 2;
  pointer-events: none;
}
.panel canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.bottom-section {
  display: grid;
  grid-template-columns: 1fr 80px;
  grid-template-rows: 1fr 80px;
  gap: 1px;
  background: #222;
  height: 220px;
}
.bottom-section .meters-area {
  grid-column: 2;
  grid-row: 1 / 3;
}
.bottom-section .waveform-area {
  padding: 8px 12px;
}

.track-info-overlay {
  position: absolute;
  top: 4px;
  right: 8px;
  font-size: 9px;
  color: #555;
  text-align: right;
  z-index: 2;
  pointer-events: none;
  line-height: 1.5;
}
.track-info-bottom {
  background: #000;
  padding: 12px 16px;
  color: #555;
  font-size: 10px;
  line-height: 1.8;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <input type="file" id="file-input" accept="audio/*" style="display:none">
      <button class="upload-btn" id="upload-btn">LOAD AUDIO FILE</button>
      <span class="track-name" id="track-name">NO FILE LOADED</span>
    </div>
    <div class="header-right" id="header-info">48000 Hz &middot; 2ch &middot; 00:00 / 00:00</div>
  </div>

  <div class="main-panels">
    <div class="spectrum-area">
      <div class="panel" id="spectrum-panel" style="height:100%">
        <canvas id="spectrum-canvas"></canvas>
      </div>
    </div>
    <div class="osc-stack">
      <div class="panel">
        <span class="panel-label">HIGHS &gt;4k Hz</span>
        <canvas id="osc-high"></canvas>
      </div>
      <div class="panel">
        <span class="panel-label">MIDS 250–4k Hz</span>
        <canvas id="osc-mid"></canvas>
      </div>
      <div class="panel">
        <span class="panel-label">LOWS &lt;250 Hz</span>
        <canvas id="osc-low"></canvas>
      </div>
    </div>
  </div>

  <div class="bottom-section">
    <div class="panel" id="spectrogram-panel">
      <canvas id="spectrogram-canvas"></canvas>
    </div>
    <div class="panel meters-area" id="meters-panel">
      <span class="panel-label">L &nbsp; R</span>
      <canvas id="meters-canvas"></canvas>
    </div>
    <div class="panel waveform-area" id="waveform-panel">
      <canvas id="waveform-canvas"></canvas>
    </div>
  </div>

  <div class="track-info-bottom" id="track-details"></div>
</div>

<audio id="audio-el" style="display:none"></audio>

<script>
(function() {
  const $ = id => document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;

  // DOM refs
  const fileInput = $('file-input');
  const uploadBtn = $('upload-btn');
  const trackNameEl = $('track-name');
  const headerInfo = $('header-info');
  const audioEl = $('audio-el');
  const trackDetails = $('track-details');

  // Canvases
  const spectrumC = $('spectrum-canvas');
  const spectrogramC = $('spectrogram-canvas');
  const metersC = $('meters-canvas');
  const oscLowC = $('osc-low');
  const oscMidC = $('osc-mid');
  const oscHighC = $('osc-high');
  const waveformC = $('waveform-canvas');

  const allCanvases = [spectrumC, spectrogramC, metersC, oscLowC, oscMidC, oscHighC, waveformC];
  const contexts = {};

  function sizeCanvas(c) {
    const r = c.parentElement.getBoundingClientRect();
    c.width = Math.round(r.width * dpr);
    c.height = Math.round(r.height * dpr);
  }
  function sizeAll() { allCanvases.forEach(sizeCanvas); spectrogramImg = null; }

  allCanvases.forEach(c => { contexts[c.id] = c.getContext('2d'); });
  sizeAll();
  window.addEventListener('resize', () => { sizeAll(); if (waveformData) drawWaveformStatic(0); });

  // Audio state
  let actx, source, mainAnalyser, analyserL, analyserR, analyserLow, analyserMid, analyserHigh;
  let splitterNode, lpfNode, bpfNode, hpfNode;
  let freqData, timeData, freqDataL, freqDataR, timeLow, timeMid, timeHigh;
  var waveformData = null;
  var spectrogramImg = null;
  let peakL = 0, peakR = 0, peakDecay = 0.97;
  let peakHoldL = 0, peakHoldR = 0, peakHoldDecayCounter = 0;
  let animating = false;
  let fileInfo = {};

  // Upload
  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    loadFile(file);
  });

  function loadFile(file) {
    fileInfo.name = file.name;
    trackNameEl.textContent = file.name;

    const reader = new FileReader();
    reader.onload = function(ev) {
      const arrayBuf = ev.target.result;

      // Init audio context on first load
      if (!actx) initAudioContext();

      // Decode for waveform overview
      actx.decodeAudioData(arrayBuf.slice(0), buf => {
        fileInfo.sampleRate = buf.sampleRate;
        fileInfo.channels = buf.numberOfChannels;
        fileInfo.duration = buf.duration;
        renderWaveformOverview(buf);
      });

      // Play via element
      const blob = new Blob([arrayBuf], { type: file.type || 'audio/mpeg' });
      const url = URL.createObjectURL(blob);
      audioEl.src = url;
      audioEl.onloadeddata = () => {
        connectSource();
        audioEl.play();
        if (!animating) { animating = true; animate(); }
      };
    };
    reader.readAsArrayBuffer(file);
  }

  function initAudioContext() {
    actx = new (window.AudioContext || window.webkitAudioContext)();

    // Main analyser (spectrum + spectrogram)
    mainAnalyser = actx.createAnalyser();
    mainAnalyser.fftSize = 8192;
    mainAnalyser.smoothingTimeConstant = 0.8;
    freqData = new Uint8Array(mainAnalyser.frequencyBinCount);
    timeData = new Uint8Array(mainAnalyser.frequencyBinCount);

    // L/R splitter
    const splitter = actx.createChannelSplitter(2);
    analyserL = actx.createAnalyser(); analyserL.fftSize = 2048; analyserL.smoothingTimeConstant = 0.8;
    analyserR = actx.createAnalyser(); analyserR.fftSize = 2048; analyserR.smoothingTimeConstant = 0.8;
    freqDataL = new Uint8Array(analyserL.frequencyBinCount);
    freqDataR = new Uint8Array(analyserR.frequencyBinCount);

    // Band filters
    const lpf = actx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 250;
    const bpf = actx.createBiquadFilter(); bpf.type = 'bandpass'; bpf.frequency.value = 1000; bpf.Q.value = 0.5;
    const hpf = actx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 4000;

    analyserLow = actx.createAnalyser(); analyserLow.fftSize = 2048; analyserLow.smoothingTimeConstant = 0.7;
    analyserMid = actx.createAnalyser(); analyserMid.fftSize = 2048; analyserMid.smoothingTimeConstant = 0.7;
    analyserHigh = actx.createAnalyser(); analyserHigh.fftSize = 2048; analyserHigh.smoothingTimeConstant = 0.7;
    timeLow = new Uint8Array(analyserLow.frequencyBinCount);
    timeMid = new Uint8Array(analyserMid.frequencyBinCount);
    timeHigh = new Uint8Array(analyserHigh.frequencyBinCount);

    // Store nodes for wiring in connectSource()
    splitterNode = splitter;
    lpfNode = lpf; bpfNode = bpf; hpfNode = hpf;

    splitter.connect(analyserL, 0);
    splitter.connect(analyserR, 1);
    lpf.connect(analyserLow);
    bpf.connect(analyserMid);
    hpf.connect(analyserHigh);
    mainAnalyser.connect(actx.destination);
  }

  function connectSource() {
    if (source) return; // MediaElementSource can only be created once per element
    source = actx.createMediaElementSource(audioEl);
    source.connect(mainAnalyser);
    source.connect(splitterNode);
    source.connect(lpfNode);
    source.connect(bpfNode);
    source.connect(hpfNode);
  }

  // Waveform overview from AudioBuffer
  function renderWaveformOverview(buf) {
    const ch0 = buf.getChannelData(0);
    const c = waveformC;
    const w = c.width;
    const samplesPerPixel = Math.floor(ch0.length / w);
    const mins = new Float32Array(w);
    const maxs = new Float32Array(w);
    for (let i = 0; i < w; i++) {
      let min = 1, max = -1;
      const start = i * samplesPerPixel;
      for (let j = 0; j < samplesPerPixel; j++) {
        const s = ch0[start + j] || 0;
        if (s < min) min = s;
        if (s > max) max = s;
      }
      mins[i] = min;
      maxs[i] = max;
    }
    waveformData = { mins, maxs };
    drawWaveformStatic();
  }

  function drawWaveformStatic(playX) {
    if (!waveformData) return;
    const ctx = contexts['waveform-canvas'];
    const w = waveformC.width, h = waveformC.height;
    ctx.clearRect(0, 0, w, h);
    const { mins, maxs } = waveformData;
    const mid = h / 2;
    const len = Math.min(mins.length, w);
    const px = playX || 0;
    for (let i = 0; i < len; i++) {
      const top = mid + maxs[i] * mid;
      const bot = mid + mins[i] * mid;
      ctx.fillStyle = i < px ? '#aaa' : '#444';
      ctx.fillRect(i, top, 1, bot - top);
    }
  }

  // Format time
  function fmt(s) {
    if (!isFinite(s) || isNaN(s)) s = 0;
    const neg = s < 0; s = Math.abs(s);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    const str = (h > 0 ? String(h).padStart(2,'0') + ':' : '') + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    return neg ? '-' + str : str;
  }

  // Drawing functions
  function drawSpectrum() {
    mainAnalyser.getByteFrequencyData(freqData);
    const ctx = contexts['spectrum-canvas'];
    const w = spectrumC.width, h = spectrumC.height;
    ctx.clearRect(0, 0, w, h);

    // Grid
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    const gridFreqs = [60, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
    const nyquist = (fileInfo.sampleRate || 48000) / 2;
    const binCount = mainAnalyser.frequencyBinCount;
    for (const f of gridFreqs) {
      const x = freqToX(f, nyquist, binCount, w);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      ctx.fillStyle = '#333';
      ctx.font = `${9 * dpr}px monospace`;
      ctx.fillText(f >= 1000 ? (f/1000) + 'k' : f + '', x + 2, h - 4 * dpr);
    }
    // dB grid lines
    for (let i = 1; i <= 4; i++) {
      const y = h * i / 5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Bars with log frequency mapping
    const numBars = 85;
    for (let i = 0; i < numBars; i++) {
      const fLow = nyquist * Math.pow(i / numBars, 2);
      const fHigh = nyquist * Math.pow((i + 1) / numBars, 2);
      const binLow = Math.floor(fLow / nyquist * binCount);
      const binHigh = Math.max(binLow + 1, Math.floor(fHigh / nyquist * binCount));
      let sum = 0, count = 0;
      for (let b = binLow; b < binHigh && b < binCount; b++) { sum += freqData[b]; count++; }
      const val = count > 0 ? sum / count / 255 : 0;
      const barH = val * h;
      const x = (i / numBars) * w;
      const bw = w / numBars;
      if (barH > 0) {
        const grad = ctx.createLinearGradient(0, h, 0, h - barH);
        grad.addColorStop(0, '#222');
        grad.addColorStop(0.4, '#666');
        grad.addColorStop(0.7, '#aaa');
        grad.addColorStop(1, '#fff');
        ctx.fillStyle = grad;
        ctx.fillRect(x, h - barH, bw - (bw > 2 ? 1 : 0), barH);
      }
    }
  }

  function freqToX(freq, nyquist, binCount, w) {
    const ratio = freq / nyquist;
    const logPos = Math.sqrt(ratio);
    return logPos * w;
  }

  function drawSpectrogram() {
    mainAnalyser.getByteFrequencyData(freqData);
    const ctx = contexts['spectrogram-canvas'];
    const w = spectrogramC.width, h = spectrogramC.height;

    if (!spectrogramImg || spectrogramImg.width !== w || spectrogramImg.height !== h) {
      spectrogramImg = ctx.createImageData(w, h);
      for (let i = 3; i < spectrogramImg.data.length; i += 4) spectrogramImg.data[i] = 255;
    }

    // Shift left by 1 pixel
    const d = spectrogramImg.data;
    for (let y = 0; y < h; y++) {
      const row = y * w * 4;
      for (let x = 0; x < (w - 1); x++) {
        const dst = row + x * 4;
        const src = row + (x + 1) * 4;
        d[dst] = d[src]; d[dst+1] = d[src+1]; d[dst+2] = d[src+2];
      }
    }

    // Draw new column at right edge
    const binCount = mainAnalyser.frequencyBinCount;
    const col = (w - 1) * 4;
    for (let y = 0; y < h; y++) {
      const freqRatio = 1 - y / h;
      const bin = Math.floor(freqRatio * freqRatio * binCount);
      const val = bin < binCount ? freqData[bin] : 0;
      const idx = y * w * 4 + col;
      d[idx] = val; d[idx+1] = val; d[idx+2] = val;
    }

    ctx.putImageData(spectrogramImg, 0, 0);
  }

  function drawMeters() {
    analyserL.getByteFrequencyData(freqDataL);
    analyserR.getByteFrequencyData(freqDataR);
    const ctx = contexts['meters-canvas'];
    const w = metersC.width, h = metersC.height;
    ctx.clearRect(0, 0, w, h);

    // RMS levels
    let sumL = 0, sumR = 0;
    for (let i = 0; i < freqDataL.length; i++) sumL += freqDataL[i];
    for (let i = 0; i < freqDataR.length; i++) sumR += freqDataR[i];
    let lvlL = sumL / (freqDataL.length * 255);
    let lvlR = sumR / (freqDataR.length * 255);

    // Peak hold
    if (lvlL > peakHoldL) { peakHoldL = lvlL; peakHoldDecayCounter = 0; }
    if (lvlR > peakHoldR) { peakHoldR = lvlR; peakHoldDecayCounter = 0; }
    peakHoldDecayCounter++;
    if (peakHoldDecayCounter > 30) { peakHoldL *= 0.995; peakHoldR *= 0.995; }

    const meterW = w * 0.25;
    const gap = w * 0.1;
    const xL = w / 2 - meterW - gap / 2;
    const xR = w / 2 + gap / 2;
    const topPad = 18 * dpr;
    const botPad = 30 * dpr;
    const meterH = h - topPad - botPad;

    // Meter backgrounds
    ctx.fillStyle = '#111';
    ctx.fillRect(xL, topPad, meterW, meterH);
    ctx.fillRect(xR, topPad, meterW, meterH);

    // Meter fills
    const hL = lvlL * meterH;
    const hR = lvlR * meterH;
    ctx.fillStyle = '#fff';
    ctx.fillRect(xL, topPad + meterH - hL, meterW, hL);
    ctx.fillRect(xR, topPad + meterH - hR, meterW, hR);

    // Peak hold lines
    ctx.fillStyle = '#888';
    const phL = peakHoldL * meterH;
    const phR = peakHoldR * meterH;
    ctx.fillRect(xL, topPad + meterH - phL, meterW, 1 * dpr);
    ctx.fillRect(xR, topPad + meterH - phR, meterW, 1 * dpr);

    // dB scale
    ctx.fillStyle = '#444';
    ctx.font = `${8 * dpr}px monospace`;
    ctx.textAlign = 'center';
    const dbMarks = [0, -6, -12, -24, -48];
    for (const db of dbMarks) {
      const ratio = Math.pow(10, db / 20);
      const y = topPad + meterH - ratio * meterH;
      if (y >= topPad && y <= topPad + meterH) {
        ctx.fillText(db + '', w / 2, y + 3 * dpr);
        ctx.fillStyle = '#222';
        ctx.fillRect(xL, y, meterW, 1);
        ctx.fillRect(xR, y, meterW, 1);
        ctx.fillStyle = '#444';
      }
    }

    // dB readout
    const dbL = lvlL > 0 ? (20 * Math.log10(lvlL)).toFixed(1) : '-inf';
    const dbR = lvlR > 0 ? (20 * Math.log10(lvlR)).toFixed(1) : '-inf';
    ctx.fillStyle = '#888';
    ctx.font = `${10 * dpr}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(dbL, xL + meterW / 2, h - 8 * dpr);
    ctx.fillText(dbR, xR + meterW / 2, h - 8 * dpr);
  }

  function drawOscilloscope(canvas, analyser, dataArr) {
    analyser.getByteTimeDomainData(dataArr);
    const ctx = contexts[canvas.id];
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Center line
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();

    // Waveform
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    const step = Math.max(1, Math.floor(dataArr.length / w));
    for (let i = 0; i < w; i++) {
      const idx = i * step;
      const v = (dataArr[idx] || 128) / 128;
      const y = v * h / 2;
      if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i, y);
    }
    ctx.stroke();
  }

  function drawPlayhead() {
    if (!waveformData) return;
    drawWaveformStatic();
    const ctx = contexts['waveform-canvas'];
    const w = waveformC.width, h = waveformC.height;
    const dur = audioEl.duration || 1;
    const cur = audioEl.currentTime || 0;
    const x = (cur / dur) * w;

    drawWaveformStatic(x);

    // Playhead line
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();

    // Header info
    const sr = fileInfo.sampleRate || 48000;
    const ch = fileInfo.channels || 2;
    headerInfo.textContent = `${sr} Hz \u00b7 ${ch}ch \u00b7 ${fmt(cur)} / ${fmt(dur)}`;

    // Track details
    trackDetails.innerHTML = `${fileInfo.name || ''}<br>${sr} Hz &middot; ${ch} channels &middot; ${fmt(dur)} duration`;
  }

  // Click on waveform to seek
  $('waveform-panel').addEventListener('click', e => {
    if (!audioEl.duration) return;
    const rect = waveformC.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audioEl.currentTime = ratio * audioEl.duration;
  });

  // Animation loop
  function animate() {
    if (!mainAnalyser) { requestAnimationFrame(animate); return; }
    drawSpectrum();
    drawSpectrogram();
    drawMeters();
    drawOscilloscope(oscLowC, analyserLow, timeLow);
    drawOscilloscope(oscMidC, analyserMid, timeMid);
    drawOscilloscope(oscHighC, analyserHigh, timeHigh);
    drawPlayhead();
    requestAnimationFrame(animate);
  }
})();
</script>
</body>
</html>
