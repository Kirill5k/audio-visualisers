<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curl-Noise Particle Field</title>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>
<script src="audio-reactivity.js"></script>
<script src="viz-shell.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

// =====================================================
// Settings
// =====================================================
const TEX = 512;                 // 512 * 512 = 262,144 particles
const COUNT = TEX * TEX;
const BOUND = 62.0;

let flowSpeed = 7.0;
let fieldScale = 0.025;
let turbInfluence = 1.2;         // bass -> turbulence
let pointSize = 2.4;
let sparkle = 1.0;               // high -> sparkle
let glow = 1.0;
let hueDrift = 0.25;

let colorA = new THREE.Color(0x2bd6ff);
let colorB = new THREE.Color(0xff5bd0);

const BG = new THREE.Color(0x030208);

// =====================================================
// Shell
// =====================================================
const shell = createVizShell({
  title: 'Curl-Noise Particle Field',
  defaultFilename: 'particles',
  exportFilename: 'particles_export.mp4',
  controls: [
    { type: 'section', label: 'Flow' },
    { type: 'slider', id: 'flow', label: 'Flow Speed', min: 1, max: 20, step: 0.5, value: flowSpeed,
      format: (v) => v.toFixed(1), onChange: (v) => flowSpeed = v },
    { type: 'slider', id: 'scale', label: 'Field Scale', min: 0.005, max: 0.06, step: 0.001, value: fieldScale,
      format: (v) => v.toFixed(3), onChange: (v) => fieldScale = v },
    { type: 'slider', id: 'turb', label: 'Bass Turbulence', min: 0, max: 3, step: 0.05, value: turbInfluence,
      format: (v) => v.toFixed(2), onChange: (v) => turbInfluence = v },

    { type: 'section', label: 'Look' },
    { type: 'slider', id: 'size', label: 'Point Size', min: 0.5, max: 6, step: 0.1, value: pointSize,
      format: (v) => v.toFixed(1), onChange: (v) => pointSize = v },
    { type: 'slider', id: 'sparkle', label: 'Treble Sparkle', min: 0, max: 3, step: 0.05, value: sparkle,
      format: (v) => v.toFixed(2), onChange: (v) => sparkle = v },
    { type: 'slider', id: 'glow', label: 'Glow', min: 0.2, max: 2.5, step: 0.05, value: glow,
      format: (v) => v.toFixed(2), onChange: (v) => glow = v },

    { type: 'section', label: 'Color' },
    { type: 'color', id: 'colA', label: 'Color A', value: '#2bd6ff', onChange: (v) => { colorA.set(v); render2.uniforms.uColorA.value.copy(colorA); } },
    { type: 'color', id: 'colB', label: 'Color B', value: '#ff5bd0', onChange: (v) => { colorB.set(v); render2.uniforms.uColorB.value.copy(colorB); } },
    { type: 'slider', id: 'hue', label: 'Hue Drift', min: 0, max: 1, step: 0.05, value: hueDrift,
      format: (v) => v.toFixed(2), onChange: (v) => hueDrift = v },

    { type: 'section', label: 'Camera' },
    { type: 'checkbox', id: 'autoRotate', label: 'Camera Drift', value: true, onChange: (v) => controls.autoRotate = v },
    { type: 'slider', id: 'driftSpeed', label: 'Drift Speed', min: 0, max: 2, step: 0.05, value: 0.4,
      format: (v) => v.toFixed(2), onChange: (v) => controls.autoRotateSpeed = v },
  ],
});
const audio = shell.audio;

// =====================================================
// Scene
// =====================================================
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.FogExp2(BG, 0.006);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 8, 110);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 20;
controls.maxDistance = 400;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.update();

// =====================================================
// GPU compute (curl-noise advection)
// =====================================================
const NOISE_GLSL = `
  vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);
    vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }
  vec3 snoiseVec3(vec3 x){
    return vec3(snoise(x),
      snoise(vec3(x.y-19.1,x.z+33.4,x.x+47.2)),
      snoise(vec3(x.z+74.2,x.x-124.5,x.y+99.4)));
  }
  vec3 curlNoise(vec3 p){
    const float e=0.1; vec3 dx=vec3(e,0.0,0.0),dy=vec3(0.0,e,0.0),dz=vec3(0.0,0.0,e);
    vec3 px0=snoiseVec3(p-dx),px1=snoiseVec3(p+dx);
    vec3 py0=snoiseVec3(p-dy),py1=snoiseVec3(p+dy);
    vec3 pz0=snoiseVec3(p-dz),pz1=snoiseVec3(p+dz);
    float x=py1.z-py0.z-pz1.y+pz0.y;
    float y=pz1.x-pz0.x-px1.z+px0.z;
    float z=px1.y-px0.y-py1.x+py0.x;
    return normalize(vec3(x,y,z)/(2.0*e));
  }
  float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
`;

const computeShader = `
  ${NOISE_GLSL}
  uniform float uDelta, uTime, uSpeed, uScale, uTurb;
  void main(){
    vec2 uv = gl_FragCoord.xy / resolution.xy;
    vec4 data = texture2D(texturePosition, uv);
    vec3 pos = data.xyz;
    float seed = data.w;
    vec3 vel = curlNoise(pos * uScale + vec3(0.0, 0.0, uTime * 0.04));
    pos += vel * uSpeed * (1.0 + uTurb) * uDelta;
    if (length(pos) > ${BOUND.toFixed(1)}) {
      vec3 r = vec3(hash(vec3(seed, uTime, uv.x)), hash(vec3(uv.yx, seed + uTime)), hash(vec3(seed * 3.1, uv.x, uTime * 1.7)));
      pos = (r - 0.5) * 36.0;
    }
    gl_FragColor = vec4(pos, seed);
  }
`;

const gpu = new GPUComputationRenderer(TEX, TEX, renderer);
const initTex = gpu.createTexture();
fillInitial(initTex);
const posVar = gpu.addVariable('texturePosition', computeShader, initTex);
gpu.setVariableDependencies(posVar, [posVar]);
posVar.material.uniforms.uDelta = { value: 0.016 };
posVar.material.uniforms.uTime = { value: 0.0 };
posVar.material.uniforms.uSpeed = { value: flowSpeed };
posVar.material.uniforms.uScale = { value: fieldScale };
posVar.material.uniforms.uTurb = { value: 0.0 };
posVar.wrapS = THREE.RepeatWrapping;
posVar.wrapT = THREE.RepeatWrapping;
const gpuErr = gpu.init();
if (gpuErr) console.error(gpuErr);

function fillInitial(tex) {
  const d = tex.image.data;
  for (let i = 0; i < COUNT; i++) {
    // random point in a sphere
    let x, y, z, r2;
    do { x = Math.random() * 2 - 1; y = Math.random() * 2 - 1; z = Math.random() * 2 - 1; r2 = x * x + y * y + z * z; } while (r2 > 1);
    const rad = 30 * Math.cbrt(Math.random());
    const k = rad / Math.max(1e-4, Math.sqrt(r2));
    d[i * 4] = x * k;
    d[i * 4 + 1] = y * k;
    d[i * 4 + 2] = z * k;
    d[i * 4 + 3] = Math.random();
  }
}

// =====================================================
// Particle render material
// =====================================================
const refs = new Float32Array(COUNT * 2);
for (let i = 0; i < COUNT; i++) {
  refs[i * 2] = ((i % TEX) + 0.5) / TEX;
  refs[i * 2 + 1] = (Math.floor(i / TEX) + 0.5) / TEX;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT * 3), 3));
pGeo.setAttribute('aRef', new THREE.BufferAttribute(refs, 2));
pGeo.setDrawRange(0, COUNT);

const render2 = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uPosition: { value: null },
    uSize: { value: pointSize },
    uHue: { value: 0.0 },
    uSparkle: { value: 0.0 },
    uGlow: { value: glow },
    uColorA: { value: colorA.clone() },
    uColorB: { value: colorB.clone() },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  vertexShader: `
    uniform sampler2D uPosition;
    uniform float uSize, uHue, uSparkle, uGlow, uPixelRatio;
    uniform vec3 uColorA, uColorB;
    attribute vec2 aRef;
    varying vec3 vColor;
    varying float vAlpha;
    vec3 hueShift(vec3 c, float a){
      const vec3 k = vec3(0.57735);
      float cs = cos(a), sn = sin(a);
      return c * cs + cross(k, c) * sn + k * dot(k, c) * (1.0 - cs);
    }
    void main(){
      vec4 data = texture2D(uPosition, aRef);
      vec3 pos = data.xyz;
      float seed = data.w;
      float t = clamp(length(pos) / 60.0, 0.0, 1.0);
      vec3 base = mix(uColorA, uColorB, fract(seed * 5.0));
      base = mix(base, vec3(1.0), pow(t, 3.0) * 0.25);
      base = hueShift(base, uHue);
      float spark = step(0.992, fract(seed * 91.7 + uHue * 4.0)) * uSparkle;
      vColor = base * uGlow + spark;
      vAlpha = 0.6 + 0.4 * seed;
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = uSize * uPixelRatio * (1.0 + spark * 1.5) * (260.0 / max(1.0, -mv.z));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = smoothstep(0.25, 0.0, r);
      gl_FragColor = vec4(vColor, a * vAlpha);
    }
  `,
});

const points = new THREE.Points(pGeo, render2);
points.frustumCulled = false;
scene.add(points);

// =====================================================
// Render loop
// =====================================================
let hue = 0;

function render(delta) {
  const d = Math.min(delta, 0.05);
  posVar.material.uniforms.uDelta.value = d;
  posVar.material.uniforms.uTime.value += d;
  posVar.material.uniforms.uSpeed.value = flowSpeed * (0.5 + 0.8 * audio.build + 0.5 * audio.rms);
  posVar.material.uniforms.uScale.value = fieldScale;
  posVar.material.uniforms.uTurb.value = audio.bass * turbInfluence;
  gpu.compute();

  render2.uniforms.uPosition.value = gpu.getCurrentRenderTarget(posVar).texture;
  render2.uniforms.uSize.value = pointSize;
  render2.uniforms.uGlow.value = glow * (0.7 + 0.6 * audio.build);
  render2.uniforms.uSparkle.value = audio.high * sparkle;
  hue += d * hueDrift * (0.4 + audio.mid);
  render2.uniforms.uHue.value = hue;

  controls.update();
  renderer.render(scene, camera);
}

function onResize(w, h) {
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  render2.uniforms.uPixelRatio.value = renderer.getPixelRatio();
}

function onExportReset() {
  hue = 0;
  posVar.material.uniforms.uTime.value = 0;
  gpu.renderTexture(initTex, posVar.renderTargets[0]);
  gpu.renderTexture(initTex, posVar.renderTargets[1]);
}

shell.start({ renderer, camera, render, onResize, onExportReset });
</script>
</body>
</html>
