<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Gradient Visualiser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0a0e27;
    }
    #webGLApp {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }
    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }
    #togglePanel.shifted { left: 290px; }

    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }
    .top-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .top-btn:hover { background: rgba(255,255,255,0.1); }
    #fpsCounter {
      background: rgba(0,0,0,0.7);
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      min-width: 60px;
      text-align: center;
      pointer-events: none;
    }
    .top-btn.recording {
      background: rgba(200,0,0,0.7);
      border-color: rgba(255,100,100,0.5);
    }

    input[type="range"] { width: 100%; }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }
    .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; }
    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }
    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }
    canvas { display: block; }
  </style>
</head>
<body>

<button id="togglePanel" class="shifted">&#9776; Hide Panel</button>

<div class="top-right-buttons">
  <div id="fpsCounter">-- fps</div>
  <button id="recordBtn" class="top-btn">&#9210; Record</button>
  <button id="exportBtn" class="top-btn">&#11015; Export</button>
  <button id="fullscreenBtn" class="top-btn">&#9974; Fullscreen</button>
</div>

<div id="exportOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; flex-direction:column; color:#fff; font-family:Arial,sans-serif;">
  <div style="font-size:18px; margin-bottom:16px;" id="exportStatus">Exporting...</div>
  <div style="width:400px; height:8px; background:#333; border-radius:4px; overflow:hidden;">
    <div id="exportProgressBar" style="width:0%; height:100%; background:#4af; transition:width 0.1s;"></div>
  </div>
  <div style="font-size:14px; margin-top:8px; color:#aaa;" id="exportPercent">0%</div>
  <button id="exportCancelBtn" style="margin-top:20px; padding:8px 20px; cursor:pointer; background:#c33; border:none; color:#fff; border-radius:4px; font-size:14px;">Cancel</button>
</div>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <div class="section-label">Colors</div>
  <div class="color-row">
    <input type="color" id="color1" value="#f15a22" />
    <span>Color 1</span>
  </div>
  <div class="color-row">
    <input type="color" id="color2" value="#0a0e27" />
    <span>Color 2</span>
  </div>
  <div class="color-row">
    <input type="color" id="color3" value="#f15a22" />
    <span>Color 3</span>
  </div>
  <div class="color-row">
    <input type="color" id="color4" value="#0a0e27" />
    <span>Color 4</span>
  </div>
  <div class="color-row">
    <input type="color" id="color5" value="#f15a22" />
    <span>Color 5</span>
  </div>
  <div class="color-row">
    <input type="color" id="color6" value="#0a0e27" />
    <span>Color 6</span>
  </div>

  <div class="section-label">Animation</div>

  <label>Speed: <span id="speedLabel">1.2</span></label>
  <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1.2" />

  <label>Intensity: <span id="intensityLabel">1.8</span></label>
  <input type="range" id="intensitySlider" min="0.5" max="4" step="0.1" value="1.8" />

  <div class="section-label">Audio Reactivity</div>

  <label>Bass Pulse: <span id="bassPulseLabel">0.5</span></label>
  <input type="range" id="bassPulseSlider" min="0" max="2" step="0.05" value="0.5" />

  <label>Color Shift: <span id="colorShiftLabel">0.3</span></label>
  <input type="range" id="colorShiftSlider" min="0" max="1" step="0.05" value="0.3" />

  <div class="section-label">Effects</div>

  <div class="checkbox-row">
    <input type="checkbox" id="filmGrainToggle" checked />
    <span>Film Grain</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="cursorDistortionToggle" checked />
    <span>Cursor Distortion</span>
  </div>

  <label>Grain Intensity: <span id="grainLabel">0.08</span></label>
  <input type="range" id="grainSlider" min="0" max="0.3" step="0.01" value="0.08" />

  <div class="section-label">Recording</div>

  <div class="checkbox-row">
    <input type="checkbox" id="autoRecordToggle" />
    <span>Record on Play</span>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="autoExportToggle" />
    <span>Export on Play</span>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="lock60fpsToggle" />
    <span>Lock 60fps</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>

<script>
"use strict";

// =====================================================
// TouchTexture
// =====================================================

class TouchTexture {
  constructor() {
    this.size = 64;
    this.width = this.height = this.size;
    this.maxAge = 64;
    this.radius = 0.25 * this.size;
    this.speed = 1 / this.maxAge;
    this.trail = [];
    this.last = null;
    this.canvas = document.createElement("canvas");
    this.canvas.width = this.width;
    this.canvas.height = this.height;
    this.ctx = this.canvas.getContext("2d");
    this.ctx.fillStyle = "black";
    this.ctx.fillRect(0, 0, this.width, this.height);
    this.texture = new THREE.Texture(this.canvas);
  }

  addTouch(point) {
    let force = 0, vx = 0, vy = 0;
    const last = this.last;
    if (last) {
      const dx = point.x - last.x;
      const dy = point.y - last.y;
      if (dx === 0 && dy === 0) return;
      const dd = dx * dx + dy * dy;
      const d = Math.sqrt(dd);
      vx = dx / d;
      vy = dy / d;
      force = Math.min(dd * 20000, 2.0);
    }
    this.last = { x: point.x, y: point.y };
    this.trail.push({ x: point.x, y: point.y, age: 0, force, vx, vy });
  }

  update() {
    this.ctx.fillStyle = "black";
    this.ctx.fillRect(0, 0, this.width, this.height);
    for (let i = this.trail.length - 1; i >= 0; i--) {
      const point = this.trail[i];
      const f = point.force * this.speed * (1 - point.age / this.maxAge);
      point.x += point.vx * f;
      point.y += point.vy * f;
      point.age++;
      if (point.age > this.maxAge) {
        this.trail.splice(i, 1);
      } else {
        this.drawPoint(point);
      }
    }
    this.texture.needsUpdate = true;
  }

  drawPoint(point) {
    const pos = { x: point.x * this.width, y: (1 - point.y) * this.height };
    let intensity;
    if (point.age < this.maxAge * 0.3) {
      intensity = Math.sin((point.age / (this.maxAge * 0.3)) * (Math.PI / 2));
    } else {
      const t = 1 - (point.age - this.maxAge * 0.3) / (this.maxAge * 0.7);
      intensity = -t * (t - 2);
    }
    intensity *= point.force;
    const color = `${((point.vx + 1) / 2) * 255}, ${((point.vy + 1) / 2) * 255}, ${intensity * 255}`;
    const offset = this.size * 5;
    this.ctx.shadowOffsetX = offset;
    this.ctx.shadowOffsetY = offset;
    this.ctx.shadowBlur = this.radius;
    this.ctx.shadowColor = `rgba(${color},${0.2 * intensity})`;
    this.ctx.beginPath();
    this.ctx.fillStyle = "rgba(255,0,0,1)";
    this.ctx.arc(pos.x - offset, pos.y - offset, this.radius, 0, Math.PI * 2);
    this.ctx.fill();
  }
}

// =====================================================
// Scene Setup
// =====================================================

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,
  powerPreference: "high-performance",
  alpha: false,
  stencil: false,
  depth: false
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
renderer.domElement.id = "webGLApp";

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
camera.position.z = 50;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e27);

const clock = new THREE.Clock();
const touchTexture = new TouchTexture();

// =====================================================
// Uniforms & Shader Material
// =====================================================

const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  uColor1: { value: new THREE.Vector3(0.945, 0.353, 0.133) },
  uColor2: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
  uColor3: { value: new THREE.Vector3(0.945, 0.353, 0.133) },
  uColor4: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
  uColor5: { value: new THREE.Vector3(0.945, 0.353, 0.133) },
  uColor6: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
  uSpeed: { value: 1.2 },
  uIntensity: { value: 1.8 },
  uTouchTexture: { value: touchTexture.texture },
  uGrainIntensity: { value: 0.08 },
  uDarkNavy: { value: new THREE.Vector3(0.039, 0.055, 0.153) },
  uAudioFrequency: { value: 0.0 },
  uAudioBass: { value: 0.0 },
  uBassPulse: { value: 0.5 },
  uColorShift: { value: 0.3 },
  uCursorDistortion: { value: 1.0 },
};

const vertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const fragmentShader = `
  uniform float uTime;
  uniform vec2 uResolution;
  uniform vec3 uColor1;
  uniform vec3 uColor2;
  uniform vec3 uColor3;
  uniform vec3 uColor4;
  uniform vec3 uColor5;
  uniform vec3 uColor6;
  uniform float uSpeed;
  uniform float uIntensity;
  uniform sampler2D uTouchTexture;
  uniform float uGrainIntensity;
  uniform vec3 uDarkNavy;
  uniform float uAudioFrequency;
  uniform float uAudioBass;
  uniform float uBassPulse;
  uniform float uColorShift;
  uniform float uCursorDistortion;

  varying vec2 vUv;

  #define PI 3.14159265359

  float grain(vec2 uv, float time) {
    vec2 grainUv = uv * uResolution * 0.5;
    float grainValue = fract(sin(dot(grainUv + time, vec2(12.9898, 78.233))) * 43758.5453);
    return grainValue * 2.0 - 1.0;
  }

  vec3 getGradientColor(vec2 uv, float time) {
    float gradientRadius = 1.0 + uAudioBass * uBassPulse * 0.5;

    vec2 center1 = vec2(0.5 + sin(time * uSpeed * 0.4) * 0.4, 0.5 + cos(time * uSpeed * 0.5) * 0.4);
    vec2 center2 = vec2(0.5 + cos(time * uSpeed * 0.6) * 0.5, 0.5 + sin(time * uSpeed * 0.45) * 0.5);
    vec2 center3 = vec2(0.5 + sin(time * uSpeed * 0.35) * 0.45, 0.5 + cos(time * uSpeed * 0.55) * 0.45);
    vec2 center4 = vec2(0.5 + cos(time * uSpeed * 0.5) * 0.4, 0.5 + sin(time * uSpeed * 0.4) * 0.4);
    vec2 center5 = vec2(0.5 + sin(time * uSpeed * 0.7) * 0.35, 0.5 + cos(time * uSpeed * 0.6) * 0.35);
    vec2 center6 = vec2(0.5 + cos(time * uSpeed * 0.45) * 0.5, 0.5 + sin(time * uSpeed * 0.65) * 0.5);

    float dist1 = length(uv - center1);
    float dist2 = length(uv - center2);
    float dist3 = length(uv - center3);
    float dist4 = length(uv - center4);
    float dist5 = length(uv - center5);
    float dist6 = length(uv - center6);

    float influence1 = 1.0 - smoothstep(0.0, gradientRadius, dist1);
    float influence2 = 1.0 - smoothstep(0.0, gradientRadius, dist2);
    float influence3 = 1.0 - smoothstep(0.0, gradientRadius, dist3);
    float influence4 = 1.0 - smoothstep(0.0, gradientRadius, dist4);
    float influence5 = 1.0 - smoothstep(0.0, gradientRadius, dist5);
    float influence6 = 1.0 - smoothstep(0.0, gradientRadius, dist6);

    vec2 rotatedUv1 = uv - 0.5;
    float angle1 = time * uSpeed * 0.15;
    rotatedUv1 = vec2(
      rotatedUv1.x * cos(angle1) - rotatedUv1.y * sin(angle1),
      rotatedUv1.x * sin(angle1) + rotatedUv1.y * cos(angle1)
    );
    rotatedUv1 += 0.5;

    vec2 rotatedUv2 = uv - 0.5;
    float angle2 = -time * uSpeed * 0.12;
    rotatedUv2 = vec2(
      rotatedUv2.x * cos(angle2) - rotatedUv2.y * sin(angle2),
      rotatedUv2.x * sin(angle2) + rotatedUv2.y * cos(angle2)
    );
    rotatedUv2 += 0.5;

    float radialGradient1 = length(rotatedUv1 - 0.5);
    float radialGradient2 = length(rotatedUv2 - 0.5);
    float radialInfluence1 = 1.0 - smoothstep(0.0, 0.8, radialGradient1);
    float radialInfluence2 = 1.0 - smoothstep(0.0, 0.8, radialGradient2);

    // Audio-reactive color shift
    float audioShift = uAudioFrequency * uColorShift * 0.01;

    vec3 c1 = uColor1; c1.r += audioShift;
    vec3 c3 = uColor3; c3.g += audioShift;
    vec3 c5 = uColor5; c5.b += audioShift;

    vec3 color = vec3(0.0);
    color += c1 * influence1 * (0.55 + 0.45 * sin(time * uSpeed));
    color += uColor2 * influence2 * (0.55 + 0.45 * cos(time * uSpeed * 1.2));
    color += c3 * influence3 * (0.55 + 0.45 * sin(time * uSpeed * 0.8));
    color += uColor4 * influence4 * (0.55 + 0.45 * cos(time * uSpeed * 1.3));
    color += c5 * influence5 * (0.55 + 0.45 * sin(time * uSpeed * 1.1));
    color += uColor6 * influence6 * (0.55 + 0.45 * cos(time * uSpeed * 0.9));

    color += mix(c1, c3, radialInfluence1) * 0.45;
    color += mix(uColor2, uColor4, radialInfluence2) * 0.4;

    // Audio bass pulse - boost intensity
    float audioPulse = 1.0 + uAudioBass * uBassPulse * 0.3;
    color = clamp(color, vec3(0.0), vec3(1.0)) * uIntensity * audioPulse;

    float luminance = dot(color, vec3(0.299, 0.587, 0.114));
    color = mix(vec3(luminance), color, 1.35);
    color = pow(color, vec3(0.92));

    float brightness1 = length(color);
    float mixFactor1 = max(brightness1 * 1.2, 0.15);
    color = mix(uDarkNavy, color, mixFactor1);

    float brightness = length(color);
    if (brightness > 1.0) color = color * (1.0 / brightness);

    return color;
  }

  void main() {
    vec2 uv = vUv;

    // Cursor-driven distortion
    vec4 touchTex = texture2D(uTouchTexture, uv);
    float vx = -(touchTex.r * 2.0 - 1.0);
    float vy = -(touchTex.g * 2.0 - 1.0);
    float touchIntensity = touchTex.b;
    uv.x += vx * 0.8 * touchIntensity * uCursorDistortion;
    uv.y += vy * 0.8 * touchIntensity * uCursorDistortion;

    vec2 center = vec2(0.5);
    float dist = length(uv - center);
    float ripple = sin(dist * 20.0 - uTime * 3.0) * 0.04 * touchIntensity * uCursorDistortion;
    float wave = sin(dist * 15.0 - uTime * 2.0) * 0.03 * touchIntensity * uCursorDistortion;
    uv += vec2(ripple + wave);

    // Audio-driven distortion
    float audioDistort = uAudioBass * uBassPulse * 0.005;
    uv.x += sin(uv.y * 10.0 + uTime * 2.0) * audioDistort;
    uv.y += cos(uv.x * 10.0 + uTime * 2.0) * audioDistort;

    vec3 color = getGradientColor(uv, uTime);

    // Film grain
    float grainValue = grain(uv, uTime);
    color += grainValue * uGrainIntensity;

    float timeShift = uTime * 0.5;
    color.r += sin(timeShift) * 0.02;
    color.g += cos(timeShift * 1.4) * 0.02;
    color.b += sin(timeShift * 1.2) * 0.02;

    float brightness2 = length(color);
    float mixFactor2 = max(brightness2 * 1.2, 0.15);
    color = mix(uDarkNavy, color, mixFactor2);

    color = clamp(color, vec3(0.0), vec3(1.0));
    float brightness = length(color);
    if (brightness > 1.0) color = color * (1.0 / brightness);

    gl_FragColor = vec4(color, 1.0);
  }
`;

function getViewSize() {
  const fovInRadians = (camera.fov * Math.PI) / 180;
  const height = Math.abs(camera.position.z * Math.tan(fovInRadians / 2) * 2);
  return { width: height * camera.aspect, height };
}

const viewSize = getViewSize();
const geometry = new THREE.PlaneGeometry(viewSize.width, viewSize.height, 1, 1);
const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();
const analyser = audioContext.createAnalyser();
analyser.fftSize = 256;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);
let audioDestNode = null;
let audioStarted = false;
let audioBuffer = null;
let audioSource = null;
let lockRecordingFps = false;

// =====================================================
// Mouse
// =====================================================

let cursorDistortionEnabled = true;

window.addEventListener("mousemove", (ev) => {
  if (!cursorDistortionEnabled) return;
  touchTexture.addTouch({
    x: ev.clientX / window.innerWidth,
    y: 1 - ev.clientY / window.innerHeight
  });
});

window.addEventListener("touchmove", (ev) => {
  if (!cursorDistortionEnabled) return;
  const touch = ev.touches[0];
  touchTexture.addTouch({
    x: touch.clientX / window.innerWidth,
    y: 1 - touch.clientY / window.innerHeight
  });
});

// =====================================================
// Recording
// =====================================================

let videoTrack = null;
let lastCaptureMs = 0;
let preRecordWidth = 0;
let preRecordHeight = 0;
let preRecordPixelRatio = 1;
const glCtx = renderer.getContext();

const recorder = createRecorder({
  defaultFilename: 'gradient_1080p',
  onStart: () => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '\u23F9 Stop';
    btn.classList.add('recording');
  },
  onStop: () => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '\u23FA Record';
    btn.classList.remove('recording');
    try { analyser.disconnect(audioDestNode); } catch(e) {}
    audioDestNode = null;
    videoTrack = null;
    renderer.setPixelRatio(preRecordPixelRatio);
    renderer.setSize(preRecordWidth, preRecordHeight);
    camera.aspect = preRecordWidth / preRecordHeight;
    camera.updateProjectionMatrix();
    rebuildPlane();
  },
});

function rebuildPlane() {
  const vs = getViewSize();
  mesh.geometry.dispose();
  mesh.geometry = new THREE.PlaneGeometry(vs.width, vs.height, 1, 1);
  uniforms.uResolution.value.set(renderer.domElement.width, renderer.domElement.height);
}

function makeRecordingStream() {
  preRecordWidth = window.innerWidth;
  preRecordHeight = window.innerHeight;
  preRecordPixelRatio = renderer.getPixelRatio();

  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();
  rebuildPlane();

  const canvas = renderer.domElement;
  const videoStream = canvas.captureStream(0);
  videoTrack = videoStream.getVideoTracks()[0];
  lastCaptureMs = 0;

  const audioStreamDest = audioContext.createMediaStreamDestination();
  audioDestNode = audioStreamDest;
  analyser.connect(audioStreamDest);

  const audioTrack = audioStreamDest.stream.getAudioTracks()[0];
  if (audioTrack) videoStream.addTrack(audioTrack);

  return videoStream;
}

// =====================================================
// Animation
// =====================================================

let offlineExporting = false;
let fpsFrames = 0;
let fpsElapsed = 0;
let lastTickTime = performance.now();

function tickFrame(delta) {
  uniforms.uTime.value += delta;

  touchTexture.update();

  if (!offlineExporting) {
    analyser.getByteFrequencyData(frequencyData);
    let avg = 0, bass = 0;
    const bassEnd = Math.min(8, frequencyData.length);
    for (let i = 0; i < frequencyData.length; i++) {
      avg += frequencyData[i];
      if (i < bassEnd) bass += frequencyData[i];
    }
    avg /= frequencyData.length;
    bass /= bassEnd;
    uniforms.uAudioFrequency.value += (avg - uniforms.uAudioFrequency.value) * 0.15;
    uniforms.uAudioBass.value += (bass / 255 - uniforms.uAudioBass.value) * 0.15;
  }

  renderer.render(scene, camera);
  if (recorder.isRecording) glCtx.finish();

  const now = performance.now();
  fpsElapsed += now - lastTickTime;
  lastTickTime = now;
  fpsFrames++;
  if (fpsElapsed >= 500) {
    document.getElementById('fpsCounter').textContent = Math.round(fpsFrames / (fpsElapsed / 1000)) + ' fps';
    fpsFrames = 0;
    fpsElapsed = 0;
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (offlineExporting) { clock.getDelta(); return; }
  const now = performance.now();
  if (recorder.isRecording && lockRecordingFps && now - lastCaptureMs < 16.5) return;
  const delta = recorder.isRecording ? (1 / 60) : Math.min(clock.getDelta(), 0.1);
  tickFrame(delta);
  if (recorder.isRecording && videoTrack) {
    videoTrack.requestFrame();
    lastCaptureMs = now;
  }
}

animate();

// =====================================================
// UI
// =====================================================

document.getElementById('togglePanel').addEventListener('click', (e) => {
  const ui = document.getElementById('ui');
  const btn = e.target;
  if (ui.classList.contains('hidden')) {
    ui.classList.remove('hidden');
    btn.classList.add('shifted');
    btn.textContent = '\u2630 Hide Panel';
  } else {
    ui.classList.add('hidden');
    btn.classList.remove('shifted');
    btn.textContent = '\u2630 Show Panel';
  }
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.getElementById('recordBtn').addEventListener('click', () => {
  recorder.toggle(makeRecordingStream);
});

function hexToVec3(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  return { r, g, b };
}

for (let i = 1; i <= 6; i++) {
  document.getElementById('color' + i).addEventListener('input', (e) => {
    const c = hexToVec3(e.target.value);
    uniforms['uColor' + i].value.set(c.r, c.g, c.b);
  });
}

document.getElementById('speedSlider').addEventListener('input', (e) => {
  uniforms.uSpeed.value = parseFloat(e.target.value);
  document.getElementById('speedLabel').textContent = uniforms.uSpeed.value.toFixed(1);
});

document.getElementById('intensitySlider').addEventListener('input', (e) => {
  uniforms.uIntensity.value = parseFloat(e.target.value);
  document.getElementById('intensityLabel').textContent = uniforms.uIntensity.value.toFixed(1);
});

document.getElementById('bassPulseSlider').addEventListener('input', (e) => {
  uniforms.uBassPulse.value = parseFloat(e.target.value);
  document.getElementById('bassPulseLabel').textContent = uniforms.uBassPulse.value.toFixed(2);
});

document.getElementById('colorShiftSlider').addEventListener('input', (e) => {
  uniforms.uColorShift.value = parseFloat(e.target.value);
  document.getElementById('colorShiftLabel').textContent = uniforms.uColorShift.value.toFixed(2);
});

document.getElementById('filmGrainToggle').addEventListener('change', (e) => {
  uniforms.uGrainIntensity.value = e.target.checked ? parseFloat(document.getElementById('grainSlider').value) : 0;
});

document.getElementById('cursorDistortionToggle').addEventListener('change', (e) => {
  cursorDistortionEnabled = e.target.checked;
  uniforms.uCursorDistortion.value = e.target.checked ? 1.0 : 0.0;
});

document.getElementById('grainSlider').addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  document.getElementById('grainLabel').textContent = val.toFixed(2);
  if (document.getElementById('filmGrainToggle').checked) {
    uniforms.uGrainIntensity.value = val;
  }
});

document.getElementById('lock60fpsToggle').addEventListener('change', (e) => {
  lockRecordingFps = e.target.checked;
});

// =====================================================
// Audio file import
// =====================================================

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const autoExport = document.getElementById('autoExportToggle').checked;
  const autoRecord = document.getElementById('autoRecordToggle').checked;

  let writable;
  if (autoExport) {
    if (offlineExporting) return;
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'gradient_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      writable = await handle.createWritable();
    } catch (err) { return; }
  }

  let prepared;
  if (autoRecord && !autoExport) {
    prepared = await recorder.prepareAutoRecord();
    if (!prepared) return;
  }

  await audioContext.resume();
  if (audioSource) { try { audioSource.stop(); } catch(e) {} }
  audioBuffer = await audioContext.decodeAudioData(await file.arrayBuffer());

  if (autoExport) {
    document.getElementById('exportBtn').writable = writable;
    document.getElementById('exportBtn').click();
    return;
  }

  audioSource = audioContext.createBufferSource();
  audioSource.buffer = audioBuffer;
  audioSource.connect(analyser);
  analyser.connect(audioContext.destination);
  audioSource.start();
  audioStarted = true;

  if (prepared && !recorder.isRecording) {
    recorder.startAutoRecord(prepared, makeRecordingStream);
  }
});

// =====================================================
// Resize
// =====================================================

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  rebuildPlane();
});

// =====================================================
// Offline Export
// =====================================================

let exportCancelled = false;

document.getElementById('exportBtn').addEventListener('click', async () => {
  if (!audioBuffer) { alert('Load an audio file first.'); return; }
  if (offlineExporting) return;

  const btn = document.getElementById('exportBtn');
  const writable = btn.writable || await (async () => {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'gradient_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      return await handle.createWritable();
    } catch (e) { return null; }
  })();
  btn.writable = null;
  if (!writable) return;

  const overlay = document.getElementById('exportOverlay');
  const progressBar = document.getElementById('exportProgressBar');
  const percentText = document.getElementById('exportPercent');
  const statusText = document.getElementById('exportStatus');
  overlay.style.display = 'flex';
  exportCancelled = false;

  const savedWidth = renderer.domElement.width;
  const savedHeight = renderer.domElement.height;
  const savedAspect = camera.aspect;
  renderer.setSize(1920, 1080);
  camera.aspect = 1920 / 1080;
  camera.updateProjectionMatrix();
  rebuildPlane();

  const savedUTime = uniforms.uTime.value;
  uniforms.uTime.value = 0;

  offlineExporting = true;
  await audioContext.suspend();

  try {
    await offlineExport({
      audioBuffer,
      fps: 60,
      width: 1920,
      height: 1080,
      fftSize: analyser.fftSize,
      smoothingTimeConstant: analyser.smoothingTimeConstant,
      minDecibels: analyser.minDecibels,
      maxDecibels: analyser.maxDecibels,
      writable,
      isCancelled: () => exportCancelled,
      renderFrame: (fftData, delta) => {
        let avg = 0, bass = 0;
        const bassEnd = Math.min(8, fftData.length);
        for (let i = 0; i < fftData.length; i++) {
          avg += fftData[i];
          if (i < bassEnd) bass += fftData[i];
        }
        avg /= fftData.length;
        bass /= bassEnd;
        uniforms.uAudioFrequency.value += (avg - uniforms.uAudioFrequency.value) * 0.15;
        uniforms.uAudioBass.value += (bass / 255 - uniforms.uAudioBass.value) * 0.15;
        uniforms.uTime.value += delta;
        touchTexture.update();
        renderer.render(scene, camera);
      },
      readCanvas: () => renderer.domElement,
      gpuFinish: () => glCtx.finish(),
      onProgress: (frac) => {
        const pct = Math.round(frac * 100);
        progressBar.style.width = pct + '%';
        percentText.textContent = pct + '%';
        const totalFrames = Math.ceil(audioBuffer.duration * 60);
        statusText.textContent = 'Exporting... frame ' + Math.round(frac * totalFrames) + '/' + totalFrames;
      },
      onDone: () => {
        statusText.textContent = 'Export complete!';
        setTimeout(() => { overlay.style.display = 'none'; }, 1500);
      },
    });
  } catch (e) {
    console.error('Export error:', e);
    statusText.textContent = 'Export failed: ' + e.message;
    setTimeout(() => { overlay.style.display = 'none'; }, 3000);
  }

  offlineExporting = false;
  await audioContext.resume();

  uniforms.uTime.value = savedUTime;
  renderer.setSize(savedWidth, savedHeight);
  camera.aspect = savedAspect;
  camera.updateProjectionMatrix();
  rebuildPlane();
});

document.getElementById('exportCancelBtn').addEventListener('click', () => {
  exportCancelled = true;
  document.getElementById('exportStatus').textContent = 'Cancelling...';
});

</script>
