<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domain-Warped Fractal Noise</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020305;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 14px;
      border-radius: 12px;
      width: 260px;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #ui.hidden {
      transform: translateX(-280px);
      opacity: 0;
      pointer-events: none;
    }

    #togglePanel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: left 0.3s ease;
    }

    #togglePanel.shifted {
      left: 290px;
    }

    .top-right-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .top-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    #fpsCounter {
      background: rgba(0,0,0,0.7);
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      min-width: 60px;
      text-align: center;
      pointer-events: none;
    }

    .top-btn.recording {
      background: rgba(200,0,0,0.7);
      border-color: rgba(255,100,100,0.5);
    }

    input[type="range"] {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .color-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
      font-size: 13px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .section-label {
      margin-top: 16px;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }

    canvas {
      display: block;
    }

  </style>
</head>
<body>

<button id="togglePanel" class="shifted">☰ Hide Panel</button>

<div class="top-right-buttons">
  <div id="fpsCounter">-- fps</div>
  <button id="replayBtn" class="top-btn">⏮ Replay</button>
  <button id="unloadBtn" class="top-btn">⏏ Unload</button>
  <button id="recordBtn" class="top-btn">⏺ Record</button>
  <button id="exportBtn" class="top-btn">⬇ Export</button>
  <button id="fullscreenBtn" class="top-btn">⛶ Fullscreen</button>
</div>

<div id="exportOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; font-family:Arial,sans-serif;">
  <div style="font-size:18px; margin-bottom:16px;" id="exportStatus">Exporting...</div>
  <div style="width:400px; height:8px; background:#333; border-radius:4px; overflow:hidden;">
    <div id="exportProgressBar" style="width:0%; height:100%; background:#4af; transition:width 0.1s;"></div>
  </div>
  <div style="font-size:14px; margin-top:8px; color:#aaa;" id="exportPercent">0%</div>
  <button id="exportCancelBtn" style="margin-top:20px; padding:8px 20px; cursor:pointer; background:#c33; border:none; color:#fff; border-radius:4px; font-size:14px;">Cancel</button>
</div>

<div id="ui">
  <input type="file" id="fileInput" accept="audio/*" />

  <!-- Noise -->
  <div class="section-label">Noise</div>

  <div class="checkbox-row">
    <input type="checkbox" id="audioModeToggle" />
    <span>Overall Mode (off = 3-Band)</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="colorModeToggle" />
    <span>Cosine Palette (off = LUT Gradient)</span>
  </div>

  <label>
    Warp Amount: <span id="warpLabel">2.5</span>
  </label>
  <input type="range" id="warpSlider" min="0" max="6" step="0.1" value="2.5" />

  <label>
    Flow Speed: <span id="flowLabel">0.25</span>
  </label>
  <input type="range" id="flowSlider" min="0" max="1.5" step="0.05" value="0.25" />

  <label>
    Noise Scale: <span id="scaleLabel">2.5</span>
  </label>
  <input type="range" id="scaleSlider" min="0.5" max="8" step="0.1" value="2.5" />

  <label>
    Detail (Octaves): <span id="octavesLabel">5</span>
  </label>
  <input type="range" id="octavesSlider" min="1" max="7" step="1" value="5" />

  <!-- Color Gradient Section -->
  <div class="section-label">Color Gradient</div>

  <div class="color-row">
    <input type="color" id="colorLow" value="#000033" />
    <span>Low (quiet)</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorMid" value="#39a7c0" />
    <span>Mid</span>
  </div>
  <div class="color-row">
    <input type="color" id="colorHigh" value="#d6eae8" />
    <span>High (loud)</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="hueShiftToggle" checked />
    <span>Hue Shift Over Time</span>
  </div>

  <!-- Rendering -->
  <div class="section-label">Rendering</div>

  <label>
    Gain: <span id="gainLabel">1.4</span>
  </label>
  <input type="range" id="gainSlider" min="0.5" max="4" step="0.1" value="1.4" />

  <!-- Effects -->
  <div class="section-label">Effects</div>

  <div class="checkbox-row">
    <input type="checkbox" id="filmGrainToggle" />
    <span>Film Grain</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="emissiveGlowToggle" checked />
    <span>Emissive Glow</span>
  </div>

  <!-- Recording -->
  <div class="section-label">Recording</div>

  <div class="checkbox-row">
    <input type="checkbox" id="autoRecordToggle" />
    <span>Record on Play</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="autoExportToggle" />
    <span>Export on Play</span>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="lock60fpsToggle" />
    <span>Lock 60fps</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>

<script src="recorder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script src="offline-exporter.js"></script>

<script type="module">

import * as THREE from 'three';

// =====================================================
// Scene
// =====================================================

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// =====================================================
// Audio
// =====================================================

const audioContext = new AudioContext();
const analyser = audioContext.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.85;

const frequencyData = new Uint8Array(analyser.frequencyBinCount);
let audioDestNode = null;

// =====================================================
// Settings
// =====================================================

const FFT_BINS = analyser.frequencyBinCount; // 1024

let audioStarted = false;
let audioBuffer = null;
let audioSource = null;
let lockRecordingFps = false;

let warpAmount = 2.5;
let flowSpeed  = 0.25;
let noiseScale = 2.5;
let octaves    = 5;
let audioMode  = 0;    // 0 = 3-band, 1 = overall
let colorMode  = 0;    // 0 = LUT, 1 = cosine
let gain       = 1.4;

let smBass = 0, smMid = 0, smTreble = 0, smOverall = 0;
let tBass = 0, tMid = 0, tTreble = 0;

let colorLow  = new THREE.Color(0x000020);
let colorMid  = new THREE.Color(0x39a7c0);
let colorHigh = new THREE.Color(0xd6eae8);

let hueShiftEnabled = true;
let hueShiftOffset = 0;
let lastHueUpdateOffset = -1;

let filmGrainEnabled = false;
let emissiveGlowEnabled = true;

// =====================================================
// Color LUT
// =====================================================

const COLOR_LUT_SIZE = 256;
const colorLUTData = new Uint8Array(COLOR_LUT_SIZE * 4);

const shiftedLow  = new THREE.Color();
const shiftedMid  = new THREE.Color();
const shiftedHigh = new THREE.Color();
const tmpColor = new THREE.Color();
const tempHSL  = { h: 0, s: 0, l: 0 };

function rebuildColorLUT() {
  for (let i = 0; i < COLOR_LUT_SIZE; i++) {
    const t = i / (COLOR_LUT_SIZE - 1);
    if (t <= 0.5) {
      tmpColor.lerpColors(shiftedLow, shiftedMid, t * 2);
    } else {
      tmpColor.lerpColors(shiftedMid, shiftedHigh, (t - 0.5) * 2);
    }
    colorLUTData[i * 4]     = Math.round(tmpColor.r * 255);
    colorLUTData[i * 4 + 1] = Math.round(tmpColor.g * 255);
    colorLUTData[i * 4 + 2] = Math.round(tmpColor.b * 255);
    colorLUTData[i * 4 + 3] = 255;
  }
}

function updateShiftedColors() {
  shiftedLow.copy(colorLow);
  shiftedMid.copy(colorMid);
  shiftedHigh.copy(colorHigh);
  if (hueShiftEnabled && hueShiftOffset > 0) {
    shiftedLow.getHSL(tempHSL);
    shiftedLow.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
    shiftedMid.getHSL(tempHSL);
    shiftedMid.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
    shiftedHigh.getHSL(tempHSL);
    shiftedHigh.setHSL((tempHSL.h + hueShiftOffset) % 1, tempHSL.s, tempHSL.l);
  }
  rebuildColorLUT();
}
updateShiftedColors();

const colorLUTTexture = new THREE.DataTexture(
  colorLUTData, COLOR_LUT_SIZE, 1, THREE.RGBAFormat, THREE.UnsignedByteType
);
colorLUTTexture.minFilter = THREE.LinearFilter;
colorLUTTexture.magFilter = THREE.LinearFilter;
colorLUTTexture.needsUpdate = true;

function updateColorLUTTexture() {
  colorLUTTexture.image.data.set(colorLUTData);
  colorLUTTexture.needsUpdate = true;
}

// =====================================================
// Shader
// =====================================================

const noiseMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uResolution:   { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uTime:         { value: 0.0 },
    uTimeBass:     { value: 0.0 },
    uTimeMid:      { value: 0.0 },
    uTimeTreble:   { value: 0.0 },
    uColorLUT:     { value: colorLUTTexture },
    uWarpAmount:   { value: warpAmount },
    uFlowSpeed:    { value: flowSpeed },
    uNoiseScale:   { value: noiseScale },
    uOctaves:      { value: octaves * 1.0 },
    uAudioMode:    { value: 0.0 },
    uColorMode:    { value: 0.0 },
    uBass:         { value: 0.0 },
    uMid:          { value: 0.0 },
    uTreble:       { value: 0.0 },
    uOverall:      { value: 0.0 },
    uGain:         { value: gain },
    uEmissiveGlow: { value: 1.0 },
    uFilmGrain:    { value: 0.0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform vec2  uResolution;
    uniform float uTime;
    uniform float uTimeBass, uTimeMid, uTimeTreble;
    uniform float uWarpAmount, uFlowSpeed, uNoiseScale, uOctaves;
    uniform float uAudioMode, uColorMode;
    uniform float uBass, uMid, uTreble, uOverall;
    uniform float uGain, uEmissiveGlow, uFilmGrain;
    uniform sampler2D uColorLUT;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 345.45));
      p += dot(p, p + 34.345);
      return fract(p.x * p.y);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }

    float fbm(vec2 p) {
      float amp = 0.5, sum = 0.0, norm = 0.0;
      for (int i = 0; i < 7; i++) {
        if (float(i) >= uOctaves) break;
        sum  += amp * vnoise(p);
        norm += amp;
        p     = p * 2.0 + 17.3;
        amp  *= 0.5;
      }
      return sum / max(norm, 0.0001);
    }

    vec3 cosPalette(float t) {
      vec3 a = vec3(0.5);
      vec3 b = vec3(0.5);
      vec3 c = vec3(1.0);
      vec3 d = vec3(0.00, 0.33, 0.67);
      return a + b * cos(6.28318 * (c * t + d));
    }

    void main() {
      vec2 uv = vUv;
      uv.x *= uResolution.x / uResolution.y;

      float warpAudio   = mix(uBass,   uOverall, uAudioMode);
      float flowAudio   = mix(uMid,    uOverall, uAudioMode);
      float detailAudio = mix(uTreble, uOverall, uAudioMode);
      float brightAudio = detailAudio;

      // Extremely subtle coordinate pulsing instead of violent zoom-shaking
      float scale = uNoiseScale * (1.0 + 0.02 * warpAudio);
      vec2  p     = uv * scale;
      
      // Extremely subtle warp response instead of jittery warping
      float warp  = uWarpAmount * (0.8 + 0.2 * warpAudio);

      // Smoothly morphing layers driven by our accumulated time uniforms
      vec2 q = vec2(
        fbm(p + uTimeBass),
        fbm(p + vec2(5.2, 1.3) + uTimeBass)
      );
      vec2 r = vec2(
        fbm(p + warp * q + vec2(1.7, 9.2) + uTimeMid),
        fbm(p + warp * q + vec2(8.3, 2.8) + uTimeMid * 0.85)
      );

      float f = fbm(p + warp * r + uTimeBass * 0.25);
      f = mix(f, fbm(p * 3.0 + warp * r + uTimeTreble), 0.35 * detailAudio);
      f = clamp(f * uGain, 0.0, 1.0);

      vec3 lutColor    = texture2D(uColorLUT, vec2(f, 0.5)).rgb;
      vec3 cosColor    = cosPalette(f + 0.1 * uTime);
      vec3 baseColor   = mix(lutColor, cosColor, uColorMode);

      float glow = pow(f, 2.5) * uEmissiveGlow * (1.0 + brightAudio);
      vec3  color = baseColor + baseColor * glow;

      if (uFilmGrain > 0.0) {
        float grain = hash(vUv * 10.0 + uTime) - 0.5;
        color += grain * 0.08 * uFilmGrain;
      }

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const geometry = new THREE.PlaneGeometry(2, 2);
const mesh = new THREE.Mesh(geometry, noiseMaterial);
mesh.frustumCulled = false;
scene.add(mesh);

// =====================================================
// Audio Band Reduction
// =====================================================

const BASS_LO = 1,   BASS_HI = 12;
const MID_LO  = 12,  MID_HI  = 120;
const TRE_LO  = 120, TRE_HI  = 400;
const BAND_EASE = 0.18;

function avgBins(freq, lo, hi) {
  let sum = 0;
  for (let i = lo; i < hi; i++) sum += freq[i];
  return sum / ((hi - lo) * 255);
}

function computeAudioBands(freq) {
  const bass    = avgBins(freq, BASS_LO, BASS_HI);
  const mid     = avgBins(freq, MID_LO,  MID_HI);
  const treble  = avgBins(freq, TRE_LO,  TRE_HI);
  let s = 0;
  for (let i = 1; i < TRE_HI; i++) s += freq[i];
  const overall = s / ((TRE_HI - 1) * 255);

  smBass    += (bass    - smBass)    * BAND_EASE;
  smMid     += (mid     - smMid)     * BAND_EASE;
  smTreble  += (treble  - smTreble)  * BAND_EASE;
  smOverall += (overall - smOverall) * BAND_EASE;
}

// =====================================================
// Recording
// =====================================================

let videoTrack = null;
let lastCaptureMs = 0;
let preRecordWidth = 0;
let preRecordHeight = 0;
let preRecordPixelRatio = 1;

const recorder = createRecorder({
  defaultFilename: 'noise_1080p',
  onStart: (codec) => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '⏹ Stop';
    btn.classList.add('recording');
  },
  onStop: () => {
    const btn = document.getElementById('recordBtn');
    btn.textContent = '⏺ Record';
    btn.classList.remove('recording');

    try { analyser.disconnect(audioDestNode); } catch(e) {}
    audioDestNode = null;
    videoTrack = null;

    renderer.setPixelRatio(preRecordPixelRatio);
    renderer.setSize(preRecordWidth, preRecordHeight);
    noiseMaterial.uniforms.uResolution.value.set(preRecordWidth, preRecordHeight);
  },
});

function makeRecordingStream() {
  preRecordWidth = window.innerWidth;
  preRecordHeight = window.innerHeight;
  preRecordPixelRatio = renderer.getPixelRatio();

  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080);
  noiseMaterial.uniforms.uResolution.value.set(1920, 1080);

  const canvas = renderer.domElement;
  const videoStream = canvas.captureStream(0);
  videoTrack = videoStream.getVideoTracks()[0];
  lastCaptureMs = 0;

  const audioStreamDest = audioContext.createMediaStreamDestination();
  audioDestNode = audioStreamDest;
  analyser.connect(audioStreamDest);

  const audioTrack = audioStreamDest.stream.getAudioTracks()[0];
  if (audioTrack) videoStream.addTrack(audioTrack);

  return videoStream;
}

// =====================================================
// Animation
// =====================================================

document.getElementById('recordBtn').addEventListener('click', () => {
  recorder.toggle(makeRecordingStream);
});

const clock = new THREE.Clock();

const fpsCounter = document.getElementById('fpsCounter');
const glCtx = renderer.getContext();
let fpsFrames = 0;
let fpsElapsed = 0;
let lastTickTime = performance.now();
let offlineExporting = false;

function tickFrame(delta) {
  noiseMaterial.uniforms.uTime.value += delta;
  if (!offlineExporting) analyser.getByteFrequencyData(frequencyData);

  if (hueShiftEnabled) {
    hueShiftOffset += delta * 0.03;
    if (hueShiftOffset > 1) hueShiftOffset -= 1;
    if (Math.abs(hueShiftOffset - lastHueUpdateOffset) > 0.002) {
      lastHueUpdateOffset = hueShiftOffset;
      updateShiftedColors();
      updateColorLUTTexture();
    }
  }

  computeAudioBands(frequencyData);

  const flowAudio = (audioMode === 1.0) ? smOverall : smMid;
  const warpAudio = (audioMode === 1.0) ? smOverall : smBass;
  const detailAudio = (audioMode === 1.0) ? smOverall : smTreble;

  const speedBass = flowSpeed + warpAudio * 1.5;
  const speedMid = flowSpeed * 0.2 + flowAudio * 0.6;
  const speedTreble = flowSpeed * 1.5 + detailAudio * 2.5;

  tBass += delta * speedBass;
  tMid += delta * speedMid;
  tTreble += delta * speedTreble;

  noiseMaterial.uniforms.uTimeBass.value = tBass;
  noiseMaterial.uniforms.uTimeMid.value = tMid;
  noiseMaterial.uniforms.uTimeTreble.value = tTreble;

  noiseMaterial.uniforms.uBass.value    = smBass;
  noiseMaterial.uniforms.uMid.value     = smMid;
  noiseMaterial.uniforms.uTreble.value  = smTreble;
  noiseMaterial.uniforms.uOverall.value = smOverall;

  renderer.render(scene, camera);
  if (recorder.isRecording) glCtx.finish();

  const now = performance.now();
  fpsElapsed += now - lastTickTime;
  lastTickTime = now;
  fpsFrames++;
  if (fpsElapsed >= 500) {
    fpsCounter.textContent = Math.round(fpsFrames / (fpsElapsed / 1000)) + ' fps';
    fpsFrames = 0;
    fpsElapsed = 0;
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (offlineExporting) { clock.getDelta(); return; }
  const now = performance.now();
  if (recorder.isRecording && lockRecordingFps && now - lastCaptureMs < 16.5) return;
  const delta = recorder.isRecording ? (1 / 60) : clock.getDelta();
  tickFrame(delta);
  if (recorder.isRecording && videoTrack) {
    videoTrack.requestFrame();
    lastCaptureMs = now;
  }
}

animate();

// =====================================================
// UI Listeners
// =====================================================

document.getElementById('togglePanel').addEventListener('click', (e) => {
  const ui = document.getElementById('ui');
  const btn = e.target;
  if (ui.classList.contains('hidden')) {
    ui.classList.remove('hidden');
    btn.classList.add('shifted');
    btn.textContent = '☰ Hide Panel';
  } else {
    ui.classList.add('hidden');
    btn.classList.remove('shifted');
    btn.textContent = '☰ Show Panel';
  }
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.getElementById('audioModeToggle').addEventListener('change', (e) => {
  audioMode = e.target.checked ? 1.0 : 0.0;
  noiseMaterial.uniforms.uAudioMode.value = audioMode;
});

document.getElementById('colorModeToggle').addEventListener('change', (e) => {
  colorMode = e.target.checked ? 1.0 : 0.0;
  noiseMaterial.uniforms.uColorMode.value = colorMode;
});

document.getElementById('warpSlider').addEventListener('input', (e) => {
  warpAmount = parseFloat(e.target.value);
  document.getElementById('warpLabel').textContent = warpAmount.toFixed(1);
  noiseMaterial.uniforms.uWarpAmount.value = warpAmount;
});

document.getElementById('flowSlider').addEventListener('input', (e) => {
  flowSpeed = parseFloat(e.target.value);
  document.getElementById('flowLabel').textContent = flowSpeed.toFixed(2);
  noiseMaterial.uniforms.uFlowSpeed.value = flowSpeed;
});

document.getElementById('scaleSlider').addEventListener('input', (e) => {
  noiseScale = parseFloat(e.target.value);
  document.getElementById('scaleLabel').textContent = noiseScale.toFixed(1);
  noiseMaterial.uniforms.uNoiseScale.value = noiseScale;
});

document.getElementById('octavesSlider').addEventListener('input', (e) => {
  octaves = parseInt(e.target.value);
  document.getElementById('octavesLabel').textContent = octaves;
  noiseMaterial.uniforms.uOctaves.value = octaves * 1.0;
});

document.getElementById('colorLow').addEventListener('input', (e) => {
  colorLow.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorMid').addEventListener('input', (e) => {
  colorMid.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});
document.getElementById('colorHigh').addEventListener('input', (e) => {
  colorHigh.set(e.target.value);
  updateShiftedColors();
  updateColorLUTTexture();
});

document.getElementById('hueShiftToggle').addEventListener('change', (e) => {
  hueShiftEnabled = e.target.checked;
  if (!hueShiftEnabled) {
    hueShiftOffset = 0;
    updateShiftedColors();
    updateColorLUTTexture();
  }
});

document.getElementById('gainSlider').addEventListener('input', (e) => {
  gain = parseFloat(e.target.value);
  document.getElementById('gainLabel').textContent = gain.toFixed(1);
  noiseMaterial.uniforms.uGain.value = gain;
});

document.getElementById('filmGrainToggle').addEventListener('change', (e) => {
  filmGrainEnabled = e.target.checked;
  noiseMaterial.uniforms.uFilmGrain.value = filmGrainEnabled ? 1.0 : 0.0;
});

document.getElementById('emissiveGlowToggle').addEventListener('change', (e) => {
  emissiveGlowEnabled = e.target.checked;
  noiseMaterial.uniforms.uEmissiveGlow.value = emissiveGlowEnabled ? 1.0 : 0.0;
});

document.getElementById('lock60fpsToggle').addEventListener('change', (e) => {
  lockRecordingFps = e.target.checked;
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const autoExport = document.getElementById('autoExportToggle').checked;
  const autoRecord = document.getElementById('autoRecordToggle').checked;

  let writable;
  if (autoExport) {
    if (offlineExporting) return;
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'noise_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      writable = await handle.createWritable();
    } catch (err) { return; }
  }

  let prepared;
  if (autoRecord && !autoExport) {
    prepared = await recorder.prepareAutoRecord();
    if (!prepared) return;
  }

  await audioContext.resume();
  audioBuffer = await audioContext.decodeAudioData(await file.arrayBuffer());

  if (autoExport) {
    document.getElementById('exportBtn').writable = writable;
    document.getElementById('exportBtn').click();
    return;
  }

  audioSource = audioContext.createBufferSource();
  audioSource.buffer = audioBuffer;
  audioSource.connect(analyser);
  analyser.connect(audioContext.destination);
  audioSource.start();
  audioStarted = true;

  if (prepared && !recorder.isRecording) {
    recorder.startAutoRecord(prepared, makeRecordingStream);
  }
});

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  noiseMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});

// =====================================================
// Offline Export
// =====================================================

let exportCancelled = false;
document.getElementById('exportBtn').addEventListener('click', async () => {
  if (!audioBuffer) { alert('Load an audio file first.'); return; }
  if (offlineExporting) return;

  const btn = document.getElementById('exportBtn');
  const writable = btn.writable || await (async () => {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'noise_export.mp4',
        types: [{ description: 'MP4 Video', accept: { 'video/mp4': ['.mp4'] } }]
      });
      return await handle.createWritable();
    } catch (e) { return null; }
  })();
  btn.writable = null;
  if (!writable) return;

  const overlay = document.getElementById('exportOverlay');
  const progressBar = document.getElementById('exportProgressBar');
  const percentText = document.getElementById('exportPercent');
  const statusText = document.getElementById('exportStatus');
  overlay.style.display = 'flex';
  exportCancelled = false;

  // Save and set export resolution
  const savedWidth  = renderer.domElement.width;
  const savedHeight = renderer.domElement.height;
  renderer.setSize(1920, 1080);
  noiseMaterial.uniforms.uResolution.value.set(1920, 1080);

  // Save scene state
  const savedUTime               = noiseMaterial.uniforms.uTime.value;
  const savedUTimeBass           = noiseMaterial.uniforms.uTimeBass.value;
  const savedUTimeMid            = noiseMaterial.uniforms.uTimeMid.value;
  const savedUTimeTreble         = noiseMaterial.uniforms.uTimeTreble.value;
  const savedTBass               = tBass;
  const savedTMid                = tMid;
  const savedTTreble             = tTreble;
  const savedHueOffset           = hueShiftOffset;
  const savedLastHueUpdateOffset = lastHueUpdateOffset;
  const savedAudioStarted        = audioStarted;
  const savedSmBass    = smBass;
  const savedSmMid     = smMid;
  const savedSmTreble  = smTreble;
  const savedSmOverall = smOverall;

  // Reset for export
  noiseMaterial.uniforms.uTime.value = 0;
  noiseMaterial.uniforms.uTimeBass.value = 0;
  noiseMaterial.uniforms.uTimeMid.value = 0;
  noiseMaterial.uniforms.uTimeTreble.value = 0;
  tBass = tMid = tTreble = 0;
  hueShiftOffset = 0;
  lastHueUpdateOffset = -1;
  smBass = smMid = smTreble = smOverall = 0;
  audioStarted = true;

  offlineExporting = true;
  await audioContext.suspend();

  try {
    await offlineExport({
      audioBuffer,
      fps: 60,
      width: 1920,
      height: 1080,
      fftSize: analyser.fftSize,
      smoothingTimeConstant: analyser.smoothingTimeConstant,
      minDecibels: analyser.minDecibels,
      maxDecibels: analyser.maxDecibels,
      writable,
      isCancelled: () => exportCancelled,
      renderFrame: (fftData, delta) => {
        frequencyData.set(fftData);
        tickFrame(delta);
      },
      readCanvas: () => renderer.domElement,
      gpuFinish: () => glCtx.finish(),
      onProgress: (frac) => {
        const pct = Math.round(frac * 100);
        progressBar.style.width = pct + '%';
        percentText.textContent = pct + '%';
        statusText.textContent = 'Exporting... frame ' + Math.round(frac * Math.ceil(audioBuffer.duration * 60)) + '/' + Math.ceil(audioBuffer.duration * 60);
      },
      onDone: () => {
        statusText.textContent = 'Export complete!';
        setTimeout(() => { overlay.style.display = 'none'; }, 1500);
      },
    });
  } catch (e) {
    console.error('Export error:', e);
    statusText.textContent = 'Export failed: ' + e.message;
    setTimeout(() => { overlay.style.display = 'none'; }, 3000);
  }

  offlineExporting = false;
  await audioContext.resume();

  // Restore scene state
  noiseMaterial.uniforms.uTime.value = savedUTime;
  noiseMaterial.uniforms.uTimeBass.value = savedUTimeBass;
  noiseMaterial.uniforms.uTimeMid.value = savedUTimeMid;
  noiseMaterial.uniforms.uTimeTreble.value = savedUTimeTreble;
  tBass   = savedTBass;
  tMid    = savedTMid;
  tTreble = savedTTreble;
  hueShiftOffset = savedHueOffset;
  lastHueUpdateOffset = savedLastHueUpdateOffset;
  audioStarted = savedAudioStarted;
  smBass    = savedSmBass;
  smMid     = savedSmMid;
  smTreble  = savedSmTreble;
  smOverall = savedSmOverall;

  renderer.setSize(savedWidth, savedHeight);
  noiseMaterial.uniforms.uResolution.value.set(savedWidth, savedHeight);
});

document.getElementById('replayBtn').addEventListener('click', () => {
  if (!audioBuffer) { alert('Load an audio file first.'); return; }
  if (offlineExporting || recorder.isRecording) return;

  if (audioSource) {
    try { audioSource.stop(); } catch(e) {}
    try { audioSource.disconnect(); } catch(e) {}
  }

  audioSource = audioContext.createBufferSource();
  audioSource.buffer = audioBuffer;
  audioSource.connect(analyser);
  analyser.connect(audioContext.destination);
  audioSource.start();
  audioStarted = true;
});

document.getElementById('unloadBtn').addEventListener('click', () => {
  if (!audioBuffer) return;
  if (offlineExporting || recorder.isRecording) return;

  if (audioSource) {
    try { audioSource.stop(); } catch(e) {}
    try { audioSource.disconnect(); } catch(e) {}
    audioSource = null;
  }

  audioBuffer = null;
  audioStarted = false;
  document.getElementById('fileInput').value = '';
});

document.getElementById('exportCancelBtn').addEventListener('click', () => {
  exportCancelled = true;
  document.getElementById('exportStatus').textContent = 'Cancelling...';
});

</script>
</body>
</html>
